<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Feature-dle e2e</title>
<style>body{font:13px/1.4 Consolas,monospace;padding:12px} .pass{color:#0a7a4d} .fail{color:#b00020;font-weight:bold} .sec{margin-top:10px;color:#12134B;font-weight:bold} iframe{width:1280px;height:900px;border:1px solid #ccc}</style>
</head>
<body>
<pre id="out"></pre>
<iframe id="app" title="app"></iframe>
<script>
/* Runs the whole game in an iframe against its own save slot (?ns=test) and a pretend date (?today=), so it behaves the same on any day of the week.
   Headless:  powershell -ExecutionPolicy Bypass -File tools\test.ps1
   Accessibility (axe): open  tests/e2e.html?axe=1  in a real browser tab while tools\serve.ps1 is running. */
(async () => {
  const out = document.getElementById('out');
  const log = (s, cls) => { const d = document.createElement('div'); d.className = cls || ''; d.textContent = s; out.appendChild(d); };
  const section = (s) => log('== ' + s, 'sec');
  let pass = 0, fail = 0;
  const ok = (cond, name, extra) => { if (cond) { pass++; log('PASS ' + name, 'pass'); } else { fail++; log('FAIL ' + name + (extra ? ' :: ' + extra : ''), 'fail'); } };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const params = new URLSearchParams(location.search);
  const wantAxe = params.get('axe') === '1';

  const frame = document.getElementById('app');
  const TODAY = '2026-11-17';              /* a Tuesday: a normal weekday */
  const errors = [];
  let FD = null, bootN = 0, realNow = null, skew = 0;
  const W = () => frame.contentWindow, D = () => frame.contentDocument;
  const q = (s) => D().querySelector(s), qa = (s) => Array.from(D().querySelectorAll(s));
  const cs = (el, pseudo) => W().getComputedStyle(el, pseudo || null);
  const waitFor = async (fn, ms = 4000) => { const t = Date.now(); while (Date.now() - t < ms) { try { if (fn()) return true; } catch (e) {} await sleep(50); } return false; };

  const boot = async (hash, o = {}) => {
    const { today = TODAY, welcome = false, width = 1280 } = o;
    frame.style.width = width + 'px';
    await new Promise((res) => { frame.onload = () => res(); frame.src = '../index.html?ns=test' + (welcome ? '' : '&nowelcome') + '&today=' + today + '&r=' + (++bootN) + (hash || '#/'); });
    realNow = null; skew = 0;   /* the new page has the real Date.now (the old one keeps its skew until it has unloaded, so its pagehide handlers still work) */
    W().addEventListener('error', (e) => errors.push(e.message));
    W().addEventListener('unhandledrejection', (e) => errors.push('promise: ' + (e.reason && e.reason.message)));
    await waitFor(() => W().FD && W().FD.lib && W().FD.lib.ready);
    FD = W().FD;
    await waitFor(() => FD.daily && FD.daily.scheduleInfo().loaded);   /* the Daily plan (data/daily.json) is read just after the library */
    await sleep(200);
  };
  const go = async (hash, ms = 300) => { if (W().location.hash === hash) FD.ui.render(); else W().location.hash = hash; await sleep(ms); };
  const typeInto = (v) => { const i = q('#guess-input'); i.focus(); i.value = v; i.dispatchEvent(new Event('input', { bubbles: true })); };
  const submit = () => q('#guess-form').requestSubmit();
  const giveUp = async () => { q('[data-act="giveup"]').click(); await sleep(250); const y = D().querySelector('dialog[open] [data-dlg="yes"]'); if (y) y.click(); await sleep(300); };
  const closeDialogs = async () => { qa('dialog[open] [data-close]').forEach((b) => b.click()); await sleep(200); };
  const clockSecs = (t) => { const m = /^(?:(\d+):)?(\d+):(\d\d)/.exec(String(t).trim()); return m ? (+m[1] || 0) * 3600 + +m[2] * 60 + +m[3] : NaN; };
  /* move the app's clock forward without waiting (the app reads Date.now() every time it needs the time) */
  const skewClock = (ms) => { if (!realNow) { const d = W().Date; realNow = d.now.bind(d); d.now = () => realNow() + skew; } skew += ms; };
  /* pretend the page is hidden (another tab, a minimised window) or visible again */
  const hide = (state) => { Object.defineProperty(D(), 'visibilityState', { configurable: true, get: () => state }); D().dispatchEvent(new (W().Event)('visibilitychange')); };
  const rgb = (s) => (String(s).match(/[\d.]+/g) || []).slice(0, 3).map(Number);
  const lum = (c) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
  const ratio = (a, b) => { const [hi, lo] = [lum(rgb(a)), lum(rgb(b))].sort((m, n) => n - m); return (hi + 0.05) / (lo + 0.05); };
  const follows = (a, b) => !!(a.compareDocumentPosition(b) & 4);   /* b comes after a in the page */
  /* what a screen reader calls a button or link: its aria-label if it has one, otherwise the words inside it, leaving out whatever is hidden from it (display:none, visibility:hidden, aria-hidden, the hidden attribute) */
  const accName = (el) => {
    const lab = (el.getAttribute('aria-label') || '').trim(); if (lab) return lab;
    const words = (n) => {
      if (n.nodeType === 3) return n.textContent;
      if (n.nodeType !== 1 || n.hidden || n.getAttribute('aria-hidden') === 'true') return '';
      const st = cs(n); if (st.display === 'none' || st.visibility === 'hidden') return '';
      return Array.from(n.childNodes).map(words).join('');
    };
    return words(el).replace(/\s+/g, ' ').trim();
  };
  /* what a CSS variable is, as the browser paints it (e.g. tok('--orange') is 'rgb(...)'); prop is the property to read it back from */
  const tok = (name, prop) => { const t = D().createElement('span'); const p = prop || 'color'; t.style[p] = 'var(' + name + ')'; D().body.appendChild(t); const c = cs(t)[p]; t.remove(); return c; };
  /* multi-selects (ui.msel): what is ticked ([] means all), the words on its button, a box by value, its options, and ticking one the way a click does */
  const mv = (id) => FD.ui.msel.values(q('#' + id));
  const mtext = (id) => q('#' + id + ' .msel-text').textContent.trim();
  const mbox = (id, v) => (v === 'all' ? q('#' + id + ' input[data-all]') : qa('#' + id + ' .msel-panel input[type="checkbox"]').find((b) => b.value === v));
  const mopts = (id) => qa('#' + id + ' .msel-panel input[type="checkbox"]:not([data-all])').map((b) => b.nextElementSibling.textContent.trim());
  const mtick = async (id, v, on) => { const b = mbox(id, v); b.checked = on !== false; b.dispatchEvent(new Event('change', { bubbles: true })); await sleep(150); return b; };
  const mopen = (id) => q('#' + id).classList.contains('is-open');
  /* what a CSS variable is inside one element (--c is the category colour of a Feature Book card), as an rgb() colour */
  const cv = (el, name) => { const t = D().createElement('i'); t.style.backgroundColor = 'var(' + name + ')'; el.appendChild(t); const c = cs(t).backgroundColor; t.remove(); return c; };
  /* a border as the browser draws it: widths are rounded down to whole device pixels */
  const px = (n) => Math.max(1, Math.floor(n * (W().devicePixelRatio || 1))) / (W().devicePixelRatio || 1);
  const dowOf = (k) => new Date(FD.u.keyToDay(k) * 86400000).getUTCDay();
  const typoFor = (f) => {
    const n = f.name, tries = [n.slice(0, 3) + n.slice(4), n.slice(0, 4) + n.slice(5), n.slice(0, 2) + n[3] + n[2] + n.slice(4)];
    return tries.find((c) => { const r = FD.match.resolve(c, FD.lib.features, f.id); return c !== n && r && !r.ambiguous && r.feature.id === f.id; }) || n;
  };

  try {
  await boot('#/');
  ok(FD.lib.features.length > 0, 'library loaded', String(FD.lib.features.length));
  log('   library: ' + FD.lib.features.length + ' features');
  ok(/\.test$/.test(FD.store.key) && FD.store.key !== 'copilot-feature-dle.v1', 'safety: tests run in their own save slot, never a real player\u2019s', FD.store.key);
  ok(FD.u.dateKey() === TODAY, 'safety: the pretend date only works in a test save slot', FD.u.dateKey());

  /* =============================================================== unit: matching */
  section('matching');
  const target = FD.lib.features.find((f) => f.id === 'copilot-pages') || FD.lib.features[0];
  const m = (txt) => { const r = FD.match.resolve(txt, FD.lib.features, target.id); return r ? r.feature.id : null; };
  const pagesId = target.id;
  [['Copilot Pages', pagesId], ['copilot pages', pagesId], ['Pages', pagesId], ['Copilot Page', pagesId], ['copilot pagse', pagesId], ['Coilot Pages', pagesId], ['copilotpages', pagesId], ['Microsoft 365 Copilot Pages', pagesId], ['pages copilot', pagesId]]
    .forEach(([t, id]) => ok(m(t) === id, 'match: "' + t + '" -> pages', String(m(t))));
  ok(m('zzzzzz') === null, 'match: nonsense is unknown');
  ok(m('copilot') === null, 'match: bare "copilot" is not a feature');
  const wordF = FD.lib.features.find((f) => /word/i.test(f.name));
  if (wordF) ok(FD.match.resolve('Word', FD.lib.features, 'x').feature.id === wordF.id, 'match: "Word" -> ' + wordF.name);
  ok(FD.match.suggest('cop', FD.lib.features, 5, []).length > 0, 'suggest: "cop" returns suggestions');
  ok(FD.match.suggest('c', FD.lib.features, 5, []).length <= 5, 'suggest: never more than the 5 asked for');
  const waves = FD.lib.features.filter((f) => /\bwave\b/i.test(f.name));
  if (waves.length > 1) {
    const wr = FD.match.resolve('Wave', FD.lib.features, waves[0].id);
    ok(wr && wr.ambiguous && wr.options.length >= 2, 'match: "Wave" is ambiguous between wave packs');
    ok(FD.match.resolve(waves[0].name, FD.lib.features, waves[1].id).feature.id === waves[0].id, 'match: an exact name is never ambiguous');
  }
  const selfFail = FD.lib.features.filter((f) => [f.name, ...f.aliases].some((t) => { const r = FD.match.resolve(t, FD.lib.features, f.id); return !r || r.feature.id !== f.id || r.ambiguous; }));
  ok(selfFail.length === 0, 'match: every name and alias resolves to its own feature', selfFail.map((f) => f.name).join(', '));
  const wrongAccept = [];
  FD.lib.features.forEach((a) => FD.lib.features.forEach((b) => { if (a.id !== b.id) { const r = FD.match.resolve(a.name, FD.lib.features, b.id); if (r && r.feature.id === b.id) wrongAccept.push(a.name + ' -> ' + b.name); } }));
  ok(wrongAccept.length === 0, 'match: no feature name is accepted for a different answer', wrongAccept.slice(0, 3).join('; '));

  /* =============================================================== unit: scoring, XP, ranks, badges */
  section('scoring, XP and ranks');
  const S = FD.scoring, ranks = FD.config.ranks;
  ok(S.base(1) === 100 && S.base(5) === 20, 'scoring: base 100..20');
  const tierText = FD.config.speedBonus.map((t) => t.maxMs / 1000 + 's +' + t.pts).join(', ');
  ok(tierText === '15s +30, 30s +25, 45s +20, 60s +15, 90s +10, 120s +5', 'scoring: the Speed Bonus tiers are 30, 25, 20, 15, 10 and 5 points, for 15, 30, 45, 60, 90 and 120 seconds', tierText);
  ok(S.speed(5000) === 30 && S.speed(15000) === 30 && S.speed(15001) === 25 && S.speed(30000) === 25 && S.speed(45000) === 20 && S.speed(60000) === 15 && S.speed(90000) === 10 && S.speed(120000) === 5 && S.speed(120001) === 0 && S.speed(300000) === 0 && S.speed(null) === 0, 'scoring: speed bonus steps down from +30 to +5 and is gone after two minutes');
  ok(S.speedApplies('daily') === true && ['hunt', 'free', 'speed', 'pack', 'match', 'prompt', 'review', '', undefined].every((md) => S.speedApplies(md) === false), 'scoring: the Speed Bonus belongs to the Daily Challenge alone');
  ok(S.multiplier === undefined && FD.config.streakMultiplier === undefined, 'scoring: there is no streak score multiplier (fair for everyone)');
  ok(S.compute({ hints: 2, ms: 30000, mode: 'daily' }).total === 80 + 25 && S.compute({ hints: 1, ms: 9000, mode: 'daily' }).total === 130 && S.compute({ hints: 5, ms: 119000, mode: 'daily' }).total === 20 + 5, 'scoring: a Daily Challenge total is base + speed, never multiplied');
  const noBonus = ['hunt', 'free', 'speed', 'pack', 'review', undefined].map((md) => S.compute({ hints: 1, ms: 3000, mode: md }));
  ok(noBonus.every((b) => b.speed === 0 && b.total === 100 && b.base === 100), 'scoring: outside the Daily Challenge a very fast answer earns no Speed Bonus (the points are the answer alone)');
  ok(S.potential(1, 3000, 'daily').total === 130 && S.potential(1, 3000, 'free').total === 100 && S.potential(3, 40000, 'daily').speed === 20 && S.potential(3, 40000).speed === 0, 'scoring: the live "what you would score now" follows the same rule');
  ok(S.computeQuiz({ points: 50, ms: 9000, mode: 'daily' }).total === 80 && S.computeQuiz({ points: 30, ms: 61000, mode: 'daily' }).total === 30 + 10 && S.computeQuiz({ points: 10, ms: 100000, mode: 'daily' }).total === 15, 'scoring: a Daily Challenge question is its pick points (50, 30 or 10) plus the Speed Bonus');
  ok(['match', 'prompt', 'free', 'speed', 'pack', undefined].every((md) => { const b = S.computeQuiz({ points: 50, ms: 3000, mode: md }); return b.speed === 0 && b.total === 50 && b.base === 50; }) && S.computeQuiz({ points: -5, ms: 0, mode: 'free' }).total === 0, 'scoring: a question outside the Daily Challenge is only its pick points, and never less than nothing');
  ok(FD.config.promptLab.points.join() === '50,30,10' && FD.config.scenarioMatch.points.join() === '50,30,10' && FD.config.promptLab.maxTries === 3 && FD.config.scenarioMatch.maxTries === 3 && FD.config.points.join() === '100,80,60,40,20', 'scoring: Feature Hunt is worth 100 to 20, and a Scenario Match or Prompt Lab question 50, 30 or 10 over three picks');
  ok(FD.prompts.pointsFor(1) === 50 && FD.prompts.pointsFor(2) === 30 && FD.prompts.pointsFor(3) === 10 && FD.scenarios.pointsFor(1) === 50 && FD.scenarios.pointsFor(3) === 10 && FD.prompts.maxTries() === 3 && FD.scenarios.maxPoints(5) === 250, 'scoring: pointsFor and maxPoints read 50, 30, 10 and 250 for five rounds', [1, 2, 3, 4].map((n) => FD.prompts.pointsFor(n)).join());
  ok(S.streakXpPct(0) === 0 && Math.abs(S.streakXpPct(2) - 0.02) < 1e-9 && Math.abs(S.streakXpPct(30) - 0.3) < 1e-9 && S.streakXpPct(50) === 0.5 && S.streakXpPct(200) === 0.5, 'xp: a Daily streak adds +1% XP per day, capped at +50%');
  ok(ranks.length === 8 && ranks[ranks.length - 1].id === 'champion' && ranks[ranks.length - 1].name === 'Copilot Champion', 'ranks: two more ranks and Copilot Champion is still the top');
  ok(ranks.some((r) => r.name === 'Agent Whisperer') && ranks.some((r) => r.name === 'Copilot Coach'), 'ranks: the two new ranks are Agent Whisperer and Copilot Coach');
  ok(ranks.every((r, i) => i === 0 || r.xp > ranks[i - 1].xp), 'ranks: thresholds strictly increase');
  const rankGaps = ranks.map((r, i) => (i ? r.xp - ranks[i - 1].xp : 0));
  ok(ranks.find((r) => r.id === 'champion').xp === 12000 && ranks.map((r) => r.xp).join() === '0,350,900,1800,3100,5000,8000,12000', 'ranks: Copilot Champion needs 12,000 XP, and the ranks before it are spread out to match', ranks.map((r) => r.xp).join());
  ok(rankGaps[6] > rankGaps[5] && rankGaps[7] > rankGaps[6] && rankGaps[6] >= 3000 && rankGaps[7] >= 4000 && rankGaps.slice(1, 6).every((g, i, a) => !i || g > a[i - 1]), 'ranks: each step is longer than the last, and the jumps from Adoption Ace to Copilot Coach (3,000) and on to Copilot Champion (4,000) are the widest', rankGaps.join());
  ok(S.rank(0).rank.id === 'newcomer' && S.rank(2200).rank.id !== 'champion' && S.rank(9600).rank.id === 'coach' && S.rank(11999).rank.id === 'coach' && S.rank(12000).rank.id === 'champion' && S.rank(12000).next === null && S.rank(20000).pct === 100, 'ranks: newcomer .. champion (Champion starts at exactly 12,000 XP)');
  const badgeIds = FD.badges.all(FD.lib).map((b) => b.id);
  ok(!['sharer', 'hat-trick', 'unstoppable'].some((id) => badgeIds.includes(id)), 'badges: the sharing and win-streak badges are retired');
  ok(FD.share === undefined, 'share: the share module is gone');

  /* =============================================================== unit: Feature Book states, layers and mastery */
  section('Feature Book: layers, states, Needs Another Look and mastery (unit)');
  {
    const lib = FD.lib, pages = lib.byId['copilot-pages'], plain = lib.byId['interpreter'];
    const scnOf = (eng, id) => eng.scenarios.filter((s) => s.feature === id);
    const blank = () => ({ collection: {}, match: { seen: {} }, prompts: { seen: {} } });
    const hunt = (p, id, won) => { p.collection[id] = { seen: 1, solved: won ? 1 : 0, last: { t: 5, won } }; };
    const finishAll = (p, f) => { hunt(p, f.id, true); scnOf(FD.scenarios, f.id).forEach((s) => { p.match.seen[s.id] = { n: 1, won: 1, last: 7 }; }); scnOf(FD.prompts, f.id).forEach((s) => { p.prompts.seen[s.id] = { n: 1, won: 1, last: 7 }; }); };
    ok(S.solvedIn({ a: { n: 1, won: 1 } }, 'a') && S.solvedIn({ a: { n: 2 } }, 'a') && !S.solvedIn({ a: { n: 1, won: 0, miss: 1 } }, 'a') && !S.solvedIn({}, 'a') && !S.solvedIn(null, 'a') && S.solvedIn({ a: { n: 2, won: 1, miss: 1 } }, 'a'), 'book: solvedIn(seen, id) is true once a puzzle was solved (an older save with no "won" count counts as solved, and a puzzle solved once and missed since still counts)');
    ok(scnOf(FD.scenarios, pages.id).length === 4 && scnOf(FD.prompts, pages.id).length === 1 && scnOf(FD.scenarios, plain.id).length > 0 && scnOf(FD.prompts, plain.id).length === 0, 'book: the unit tests have a feature with every kind of puzzle (Copilot Pages) and one with no Prompt Lab prompt yet (Interpreter)');
    const p0 = blank(), L0 = S.layers(p0, pages);
    ok(L0.total === 1 + 4 + 1 && L0.done === 0 && L0.any === false && L0.mastered === false && L0.triple === false && L0.know === false && L0.use.total === 4 && L0.use.done === 0 && L0.prompt.total === 1 && L0.prompt.done === 0, 'book: layers() counts one Know it puzzle, every Use it scenario and every Prompt it prompt, and nothing is done yet', JSON.stringify(L0));
    ok(S.bookState(p0, pages) === 'new' && S.collected(p0, pages) === false && S.known(p0, pages) === false, 'book: a feature nothing has happened with is Not collected (state "new")');
    const p1 = blank(); hunt(p1, pages.id, false);
    ok(S.bookState(p1, pages) === 'spotted' && S.collected(p1, pages) === false && S.known(p1, pages) === false, 'book: a Feature Hunt that showed its answer (a miss) makes the feature Spotted, not collected');
    const p2 = blank(); p2.match.seen[scnOf(FD.scenarios, pages.id)[0].id] = { n: 1, won: 0, miss: 1, last: 4 };
    ok(S.bookState(p2, pages) === 'spotted' && S.layers(p2, pages).use.met === 1 && S.layers(p2, pages).use.done === 0, 'book: a Scenario Match question that was met but missed also makes it Spotted (met, not done)');
    const p3 = blank(); p3.prompts.seen[scnOf(FD.prompts, pages.id)[0].id] = { n: 1, won: 0, miss: 1, last: 4 };
    ok(S.bookState(p3, pages) === 'spotted' && S.layers(p3, pages).prompt.met === 1 && S.layers(p3, pages).prompt.done === 0, 'book: a missed Prompt Lab question makes it Spotted too');
    const p4 = blank(); hunt(p4, pages.id, true);
    ok(S.bookState(p4, pages) === 'collected' && S.collected(p4, pages) && S.known(p4, pages) && S.layers(p4, pages).done === 1 && S.layers(p4, pages).any && !S.layers(p4, pages).mastered, 'book: any one puzzle done makes it Collected');
    const p5 = blank(); p5.match.seen[scnOf(FD.scenarios, pages.id)[1].id] = { n: 1, won: 1, last: 4 };
    ok(S.bookState(p5, pages) === 'collected' && S.collected(p5, pages) && !S.known(p5, pages) && S.layers(p5, pages).use.done === 1, 'book: a Scenario Match question is enough to collect a feature (Know it stays not done)');
    const p5b = blank(); hunt(p5b, pages.id, true); p5b.match.seen[scnOf(FD.scenarios, pages.id)[0].id] = { n: 2, won: 1, miss: 1, last: 4 };
    ok(S.layers(p5b, pages).use.done === 1 && S.bookState(p5b, pages) === 'collected', 'book: a puzzle solved once and missed on a later go still counts as done');
    const p6 = blank(); finishAll(p6, pages);
    const L6 = S.layers(p6, pages);
    ok(S.bookState(p6, pages) === 'mastered' && L6.mastered && L6.done === 6 && L6.total === 6 && L6.triple, 'book: every puzzle done (1 + 4 + 1) makes it Mastered, and a Triple Threat');
    const p7 = blank(); finishAll(p7, plain);
    const L7 = S.layers(p7, plain);
    ok(L7.prompt.total === 0 && L7.mastered && S.bookState(p7, plain) === 'mastered' && L7.triple === false && L7.total === 1 + L7.use.total, 'book: a feature with no Prompt Lab prompts is mastered without one (a layer with nothing to play is simply not asked), but it can never be a Triple Threat');
    const p8 = blank(); finishAll(p8, pages); delete p8.prompts.seen[scnOf(FD.prompts, pages.id)[0].id];
    ok(S.bookState(p8, pages) === 'collected' && !S.layers(p8, pages).mastered, 'book: one puzzle left (the prompt) and it is only Collected');
    ok(S.masteredCount(p6, lib) === 1 && S.tripleCount(p6, lib) === 1 && S.masteredCount(p0, lib) === 0, 'book: masteredCount and tripleCount follow layers()');
    ok(S.masterStatus === undefined && typeof FD.badges.masterStatus === 'function', 'book: masterStatus lives on FD.badges (FD.scoring.masterStatus does not exist)');
    const ms0 = FD.badges.masterStatus(blank(), lib), agents = ms0.rows.find((r) => r.category.name === 'Agents');
    ok(ms0.total === lib.categories.filter((c) => lib.features.filter((f) => f.category === c.name).length >= 2).length && ms0.rows.length === ms0.total && ms0.mastered === 0 && !!agents && agents.total === 8 && agents.features.length === 8 && agents.layers.length === 8 && agents.puzzles.know.total === 8 && agents.puzzles.use.total === agents.features.reduce((a, f) => a + scnOf(FD.scenarios, f.id).length, 0) && agents.puzzles.prompt.total === agents.features.reduce((a, f) => a + scnOf(FD.prompts, f.id).length, 0) && agents.have === 0 && agents.master === false, 'mastery: masterStatus gives each category its features, their layers, and its Know it / Use it / Prompt it puzzle totals', JSON.stringify(agents && agents.puzzles));
    const p9 = blank(); agents.features.slice(0, 3).forEach((f) => finishAll(p9, f)); hunt(p9, agents.features[3].id, true);
    const a9 = FD.badges.masterStatus(p9, lib).rows.find((r) => r.category.name === 'Agents');
    ok(a9.have === 4 && a9.mastered === 3 && a9.master === false && a9.puzzles.know.done === 4, 'mastery: collected and mastered are counted apart (4 collected, 3 mastered), and the category is not mastered yet', JSON.stringify([a9.have, a9.mastered, a9.puzzles.know]));
    agents.features.forEach((f) => finishAll(p9, f));
    const a10 = FD.badges.masterStatus(p9, lib), a10row = a10.rows.find((r) => r.category.name === 'Agents');

      await go('#/packs'); await sleep(400);
      ok(rvAct() === 'Play 1', 'review: Packs now says "Play 1"', rvAct());
      FD.store.recordQuizRound('prompt', { id: pS.id, points: 50, solved: true, tries: 1 }, FD.lib.byId[pS.feature], { mode: 'free' });

  /* =============================================================== badges */
  section('badges: collecting and mastering (Category Masters, Feature Master, Toolkit Builder, Triple Threat)');
  {
    FD.store.resetAll(); FD.store.setOnboarded();
    const lib = FD.lib, P = FD.store.profile();
    const scnOf = (eng, id) => eng.scenarios.filter((s) => s.feature === id);
    const huntSet = (id, won) => { P.collection[id] = { seen: 1, solved: won ? 1 : 0, last: { t: 5, won } }; };
    const finishAll = (f) => { huntSet(f.id, true); scnOf(FD.scenarios, f.id).forEach((s) => { P.match.seen[s.id] = { n: 1, won: 1, last: 7 }; }); scnOf(FD.prompts, f.id).forEach((s) => { P.prompts.seen[s.id] = { n: 1, won: 1, last: 7 }; }); };
    const B = FD.badges.all(lib), by = (id) => B.find((b) => b.id === id), ev = () => FD.badges.evaluate(P, {}, lib).map((b) => b.id), cm = B.filter((b) => b.master);
    ok(by('feature-master').desc === 'Master every feature in the library: complete every one of its puzzles.' && by('toolkit-10').desc === 'Master 10 features: complete every puzzle they have, in every game mode.' && by('triple-threat').desc === 'Know it, Use it and Prompt it: solve a feature in Feature Hunt, match one of its scenarios and pick its best prompt.' && ['collector-10:10', 'collector-25:25', 'collector-50:50'].every((x) => by(x.split(':')[0]).desc === 'Collect ' + x.split(':')[1] + ' features in your Feature Book.'), 'badges: Feature Master, Toolkit Builder, Triple Threat and the Collector badges describe what they ask (mastering means every puzzle, in every game mode)');

    ok(!B.some((b) => /Speed Round|Use Case|use cases/i.test(b.name + ' ' + b.desc)) && B.every((b) => b.name && b.desc && b.color && b.icon), 'badges: no badge talks about the old Speed Round, and every badge has a name, a description, a colour and an icon');
    /* collecting: any puzzle counts, in any game mode */
    const withScn = lib.features.filter((f) => scnOf(FD.scenarios, f.id).length > 0);
    withScn.slice(0, 9).forEach((f) => { P.match.seen[scnOf(FD.scenarios, f.id)[0].id] = { n: 1, won: 1, last: 7 }; });
    ev();
    ok(!P.badges['collector-10'] && FD.scoring.solvedCount(P, lib) === 9, 'badges: nine features collected is not yet a Collector', String(FD.scoring.solvedCount(P, lib)));
    P.match.seen[scnOf(FD.scenarios, withScn[9].id)[0].id] = { n: 1, won: 1, last: 7 };
    ev();
    ok(!!P.badges['collector-10'] && !P.badges['first-spark'] && FD.scoring.layers(P, withScn[9]).any && !FD.scoring.known(P, withScn[9]), 'badges: a feature is collected by any one puzzle: ten Scenario Match answers (and no Feature Hunt) make ten collected features, a Collector, and not a First Spark');
    /* Triple Threat needs a puzzle in each game mode, not the whole feature */

    huntSet(tf.id, true); P.match.seen[scnOf(FD.scenarios, tf.id)[0].id] = { n: 1, won: 1, last: 7 }; P.prompts.seen[scnOf(FD.prompts, tf.id)[0].id] = { n: 1, won: 1, last: 7 };

  section('layout: the new screens on a phone');
  {
    await boot('#/', { width: 390 }); FD.store.resetAll(); FD.store.setOnboarded();

    const cw = () => D().documentElement.clientWidth, over = () => D().documentElement.scrollWidth - cw();

    const hit = (a, b) => { const x = a.getBoundingClientRect(), y = b.getBoundingClientRect(); return x.left < y.right - 1 && y.left < x.right - 1 && x.top < y.bottom - 1 && y.top < x.bottom - 1; };
