      metric: (p) => html`<strong>${p.played}</strong><small>${p.played === 1 ? 'game' : 'games'}</small>`, sub: (p) => `${p.totalScore} pts overall` }
  ];

  FD.views.leaderboard = {
    title: 'Leaderboard',
    async render(main) {
      let tab = 'daily', data = FD.board.local(), live = false, note = '', loading = false;
      const remote = FD.board.remoteEnabled();
      const rows = (t, list) => list.length
        ? html`<ol class="board">${list.map((p, i) => html`<li class="lb-row ${p.you ? 'is-you' : ''}"><span class="lb-rank r${i + 1}" aria-label="Rank ${i + 1}">${i + 1}</span>${FD.avatar(p.name, p.color, 40)}<span class="lb-name"><strong>${p.name}</strong>${p.you ? html`<span class="chip chip-solid c-blue">You</span>` : ''}${p.sample ? html`<span class="chip" title="Sample player so the board is never empty. Turn off in Settings.">Sample</span>` : ''}<small>${t.sub(p)}</small></span><span class="lb-metric">${t.metric(p)}</span></li>`)}</ol>`
        : html`<div class="empty-state">${FD.pip('think', { size: 100 })}<p>${t.empty}</p><a class="btn btn-primary" href="#/daily">Play today\u2019s challenge</a></div>`;

      function draw() {
        const t = TABS.find((x) => x.id === tab);
        main.innerHTML = flat(html`<div class="container hub">
          <header class="hub-head"><p class="eyebrow">${live ? 'Live event board' : 'On this device'}</p><h1>Leaderboard</h1>
            <p class="lede">${live ? 'Everyone playing in this event, updated live.' : 'Everyone who has played on this device, plus a few friendly sample players. Running an event? You can connect a shared board.'}</p></header>
          <div class="tabs" role="tablist" aria-label="Leaderboards">${TABS.map((x) => html`<button class="tab" role="tab" id="tab-${x.id}" aria-controls="lb-panel" aria-selected="${String(x.id === tab)}" tabindex="${x.id === tab ? 0 : -1}" data-tab="${x.id}">${FD.icon(x.icon, { size: 18 })}${x.label}</button>`)}</div>
          <section class="card lb-card" id="lb-panel" role="tabpanel" aria-labelledby="tab-${tab}">
            <div class="section-head"><h2>${t.heading}</h2>${remote ? html`<button class="btn btn-ghost btn-sm" type="button" data-action="lb-refresh">${FD.icon('refresh', { size: 16 })}${loading ? 'Refreshing\u2026' : 'Refresh'}</button>` : ''}</div>
            ${note ? html`<p class="banner c-orange">${FD.icon('info', { size: 18 })} ${note}</p>` : ''}
            ${rows(t, data[tab])}
          </section>
          <p class="muted small lb-foot">${FD.icon('shield', { size: 16 })} ${live ? 'Names are whatever each player typed. Scores are only as honest as the players \u2013 this is a friendly game!' : html`Your progress and this board are stored only on this device. ${data.players.some((p) => p.sample) ? 'Players marked \u201CSample\u201D are placeholders. Switch them off in Settings.' : ''}`}</p>
        </div>`);
        const list = $('.tabs', main);
        list.addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; draw(); $('#tab-' + tab, main).focus(); } });
        list.addEventListener('keydown', (e) => {
          const i = TABS.findIndex((x) => x.id === tab);
          const n = e.key === 'ArrowRight' ? (i + 1) % TABS.length : e.key === 'ArrowLeft' ? (i - 1 + TABS.length) % TABS.length : e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : -1;
          if (n >= 0) { e.preventDefault(); tab = TABS[n].id; draw(); $('#tab-' + tab, main).focus(); }
        });
      }
      async function refresh() {
        if (!remote) return;
        loading = true; draw();
        try { data = await FD.board.fetchRemote(); live = true; note = ''; }
        catch (e) { live = false; data = FD.board.local(); note = 'Couldn\u2019t reach the event leaderboard, so you\u2019re seeing this device only.'; }
        loading = false; draw();
      }
      ui.actions['lb-refresh'] = refresh;
      draw();
      if (remote) refresh();
    }
  };
})();

  "name" (official name), "aliases" (2-4 other names people use), "difficulty" (Easy = common features, Medium = newer features, Hard = niche or recent, Expert = champion/consultant territory), "category", "tags" (1-3 lowercase words),
  "hints" (exactly 5, from deliberately obscure to nearly obvious; do NOT put the feature's name in hints 1-3),
  "description" (1-2 sentences: what it does), "why" (1-2 sentences: why it matters at work),
  "useCases" (exactly 3 objects with "title" and "text": practical workplace scenarios),
  "prompt" (one realistic example prompt someone could paste into Copilot),
  "learnMore" (an official https://learn.microsoft.com or https://support.microsoft.com link you are confident exists).

Shape:
{ "name": "Pack name", "description": "One line about the pack", "author": "My name", "features": [ { ...feature... } ] }`;

  FD.views.packs = {
    title: 'Packs & themes',
    render(main) {
      const lib = FD.lib, month = new Date().getMonth() + 1;
      const official = lib.packs.filter((p) => p.kind !== 'community');
      const community = FD.store.community();
      let preview = null;

      const draw = () => {
        main.innerHTML = flat(html`<div class="container hub">
          <header class="hub-head"><p class="eyebrow">Extend the game</p><h1>Packs &amp; themes</h1><p class="lede">Themed sets of features for events, release waves and monthly spotlights \u2013 plus your own packs, written by you or with a little help from Copilot.</p></header>

          ${ui.section('Official packs', html`<div class="pack-grid">${official.map((p) => { const n = FD.data.packFeatures(p.id).length; return html`<article class="pack-card c-${p.color || 'blue'}"><span class="pack-ic" aria-hidden="true">${FD.icon(p.icon || 'package', { size: 28 })}</span><div><h3>${p.name}</h3><p>${p.description}</p><p class="pack-n">${FD.u.plural(n, 'feature')}</p></div><a class="btn btn-dark btn-sm" href="#/free?pack=${p.id}&start=1">${FD.icon('play', { size: 16 })}Play</a></article>`; })}</div>`, { id: 'pk-off' })}

          ${ui.section('Monthly spotlights', html`<ol class="theme-list">${(lib.themes || []).slice().sort((a, b) => a.month - b.month).map((t) => { const n = FD.data.pool({ tag: t.tag }).length; const name = new Date(2026, t.month - 1, 1).toLocaleDateString('en-AU', { month: 'long' }); return html`<li class="theme c-${t.color || 'blue'} ${t.month === month ? 'is-now' : ''}"><span class="theme-month">${name}</span><div><h3>${t.title}${t.month === month ? html` <span class="chip chip-solid c-green">This month</span>` : ''}</h3><p>${t.blurb}</p></div>${n ? html`<a class="btn btn-ghost btn-sm" href="#/free?tag=${t.tag}&start=1">Play ${n}</a>` : html`<span class="muted small">Coming soon</span>`}</li>`; })}</ol>`, { id: 'pk-themes' })}

          ${ui.section('Community & AI-generated packs', html`
            ${community.length ? html`<ul class="community-list">${community.map((c) => html`<li class="card"><div><h3>${c.name}</h3><p class="muted">${c.description}${c.author ? html` \u00B7 by ${c.author}` : ''} \u00B7 ${FD.u.plural(c.features.length, 'feature')}</p></div><div class="btn-row"><a class="btn btn-primary btn-sm" href="#/free?pack=${c.id}&start=1">Play</a><button class="btn btn-ghost btn-sm" type="button" data-action="pack-remove" data-id="${c.id}">${FD.icon('trash', { size: 16 })}Remove</button></div></li>`)}</ul>` : html`<p class="muted">No community packs yet. Add one below!</p>`}
            <div class="card creator" aria-labelledby="cr-h">
              <h3 id="cr-h">Create your own pack with Copilot</h3>
              <ol class="creator-steps">
                <li><strong>Copy the prompt.</strong> Paste it into Copilot Chat and swap in your topic.
                  <details class="prompt-box"><summary>Show the prompt</summary><pre tabindex="0">${aiPrompt()}</pre></details>
                  <div class="btn-row"><button class="btn btn-dark btn-sm" type="button" data-action="copy" data-copy="${aiPrompt()}">${FD.icon('copy', { size: 16 })}Copy prompt</button><button class="btn btn-ghost btn-sm" type="button" data-action="pack-template">${FD.icon('download', { size: 16 })}Download a template</button></div></li>
                <li><strong>Check Copilot\u2019s work.</strong> Make sure each feature and link is accurate. You know your audience best.</li>
                <li><strong>Paste the JSON here.</strong>
                  <label class="sr-only" for="pack-json">Pack JSON</label>
                  <textarea id="pack-json" class="textarea" rows="8" spellcheck="false" placeholder='{ "name": "My pack", "features": [ ... ] }'></textarea>
                  <div class="btn-row"><button class="btn btn-primary" type="button" data-action="pack-check">${FD.icon('check', { size: 18 })}Check my pack</button><label class="btn btn-ghost" for="pack-file">${FD.icon('upload', { size: 18 })}Load a .json file</label><input id="pack-file" class="sr-only" type="file" accept="application/json,.json"></div>
                  <div id="pack-report" aria-live="polite"></div></li>
              </ol>
            </div>`, { id: 'pk-com' })}
        </div>`);
        $('#pack-file', main).addEventListener('change', (e) => {
          const file = e.target.files[0]; if (!file) return;
          const r = new FileReader(); r.onload = () => { $('#pack-json', main).value = String(r.result); check(); }; r.readAsText(file);
        });
      };

      function check() {
        const box = $('#pack-json', main), out = $('#pack-report', main);
        let json;
        const txt = box.value.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
        try { json = JSON.parse(txt); } catch (e) { preview = null; out.innerHTML = flat(html`<div class="banner c-red">${FD.icon('x', { size: 20 })}<p>That isn\u2019t valid JSON yet (${e.message}). Copy only the JSON from Copilot\u2019s reply.</p></div>`); return; }
        const v = FD.data.validatePack(json);
        preview = v.ok ? v.pack : null;
        out.innerHTML = flat(html`
          ${v.errors.length ? html`<div class="banner c-red">${FD.icon('x', { size: 20 })}<div><strong>Needs a tweak</strong><ul>${v.errors.map((m) => html`<li>${m}</li>`)}</ul></div></div>` : ''}
          ${v.warnings.length ? html`<div class="banner c-yellow">${FD.icon('info', { size: 20 })}<div><strong>Heads up</strong><ul>${v.warnings.slice(0, 8).map((m) => html`<li>${m}</li>`)}</ul></div></div>` : ''}
          ${v.ok ? html`<div class="banner c-green">${FD.icon('check', { size: 20 })}<div><strong>Looks good!</strong> ${v.pack.name} has ${FD.u.plural(v.pack.features.length, 'feature')}:
            <ul class="preview-list">${v.pack.features.map((f) => html`<li><strong>${f.name}</strong> <span class="muted">\u00B7 ${f.difficulty || 'Medium'} \u00B7 \u201C${(f.hints || [])[0]}\u201D</span></li>`)}</ul>
            <div class="btn-row"><button class="btn btn-primary" type="button" data-action="pack-add">${FD.icon('plus', { size: 18 })}Add this pack</button></div></div></div>` : ''}`);
      }

      ui.actions['pack-check'] = check;
      ui.actions['pack-add'] = () => {
        if (!preview) return;
        const earned = FD.store.addCommunityPack(preview);
        ui.toast(`${preview.name} added!`, { icon: 'package' }); ui.celebrate({ newBadges: earned });
        preview = null; draw();
      };
      ui.actions['pack-remove'] = async (el) => { if (await ui.confirm('Remove this pack?', 'Its features disappear from the game. Your Feature Book progress for them is kept.', 'Remove pack', true)) { FD.store.removeCommunityPack(el.dataset.id); draw(); } };
      ui.actions['pack-template'] = () => FD.u.download(JSON.stringify(TEMPLATE, null, 2), 'feature-dle-pack-template.json', 'application/json');
      draw();
    }
  };
})();

/* Copilot Feature-dle · boot, routes, midnight ticker, PWA bits */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});
  const { html, flat, $, $$ } = FD.u;
  const ui = FD.ui;

  function routes() {
    ui.route('/', FD.views.home);
    ui.route('/daily', FD.views.daily);
    ui.route('/free', FD.views.free);
    ui.route('/speed', FD.views.speed);
    ui.route('/team', FD.views.team);
    ui.route('/play/:id', FD.views.play);
    ui.route('/c/:code', FD.views.challenge);
    ui.route('/book/:id?', FD.views.book);
    ui.route('/stats', FD.views.stats);
    ui.route('/leaderboard', FD.views.leaderboard);
    ui.route('/about', FD.views.about);
    ui.route('/settings', FD.views.settings);
    ui.route('/packs', FD.views.packs);
  }

  /* countdown to the next Daily Challenge + roll the page over at local midnight */
  function ticker() {
    let key = FD.u.dateKey();
    setInterval(() => {
      const t = FD.u.fmtClock(FD.u.msToMidnight());
      $$('[data-countdown]').forEach((el) => { el.textContent = t; });
      const now = FD.u.dateKey();
      if (now !== key) { key = now; const p = ui.current().path; if (p === '/' || p === '/daily') ui.render(); }
    }, 1000);
  }

  function pwa() {
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); FD.pwa.deferred = e; if (ui.current().path === '/settings') ui.render(); });
    window.addEventListener('appinstalled', () => { FD.pwa.deferred = null; ui.toast('Feature-dle installed. Find it on your home screen!', { icon: 'check' }); });
    window.addEventListener('offline', () => ui.toast('You\u2019re offline. Feature-dle keeps working!', { icon: 'offline' }));
    window.addEventListener('online', () => ui.toast('Back online', { icon: 'check' }));
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { FD.pwa.controlled = !!navigator.serviceWorker.controller; })
        .catch(() => { /* offline support is a bonus */ });
      navigator.serviceWorker.addEventListener('controllerchange', () => { FD.pwa.controlled = true; });
    }
  }

  /* live event board: share a link like  https://your-host/?event=LUNCH26  and everyone who opens it joins the same board
     (needs an endpoint such as the one built into tools\serve.ps1, see README) */
  const cleanCode = (v) => String(v || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
  /* a link may only point the board at this same site - never at a third-party endpoint */
  const sameSiteEndpoint = (v) => {
    if (!v) return '';
    try { const u = new URL(String(v), location.href); return u.origin === location.origin ? u.pathname + u.search : ''; } catch (e) { return ''; }
  };
  function applyEvent() {
    const ev = FD.store.state.meta.event;
    if (!FD.config.leaderboard.endpoint && ev && cleanCode(ev.code)) FD.config.leaderboard = { endpoint: sameSiteEndpoint(ev.endpoint) || 'api/leaderboard', eventCode: cleanCode(ev.code) };
  }
  function joinEventFromUrl() {
    const sp = new URLSearchParams(location.search), code = cleanCode(sp.get('event'));
    if (code) { FD.store.state.meta.event = { code, endpoint: sameSiteEndpoint(sp.get('board')) || 'api/leaderboard' }; FD.store.save(); }
    applyEvent();
  }
  FD.joinEvent = (code) => {
    const c = cleanCode(code);
    if (c) FD.store.state.meta.event = { code: c, endpoint: 'api/leaderboard' }; else delete FD.store.state.meta.event;
    FD.config.leaderboard = c ? { endpoint: 'api/leaderboard', eventCode: c } : { endpoint: '', eventCode: '' };
    FD.store.save();
    return c;
  };

  async function boot() {
    FD.store.load();
    FD.store.applySettings();
    routes();
    ui.renderShell();
    try {
      const raw = await FD.data.load();
      FD.rawLib = raw;
      FD.data.build(raw, FD.store.community());
    } catch (e) {
      console.error(e);
      $('#main').innerHTML = flat(html`<div class="container section"><div class="card"><h1>Hmm, the feature library didn\u2019t load</h1><p>Pip couldn\u2019t find <code>data/features.json</code>. If you opened the page straight from a folder, try the single-file edition or serve the folder with <code>tools\\serve.ps1</code>.</p></div></div>`);
      return;
    }
    if (location.hash === '' || location.hash === '#') history.replaceState(null, '', '#/');
    joinEventFromUrl();
    ui.render();
    if (!FD.store.onboarded() && !/[?&]nowelcome\b/.test(location.search)) ui.firstRun();
    ticker();
    pwa();
    document.documentElement.classList.add('is-ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
