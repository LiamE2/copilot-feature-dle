anager attaches several store sales exports and asks which products perform best and where outliers appear, without merging the files first."},{"title":"Survey trend check","text":"An HR partner uploads engagement survey results as a CSV and asks for trends by department and any surprising outliers, with a chart for the leadership update."},{"title":"Budget variance check","text":"A finance lead attaches budget and actuals workbooks, asks where spending drifted most, and checks the Python on screen to confirm the numbers add up."}],"prompt":"Using the attached files, identify our top-performing products based on customer engagement, flag any outliers, and chart the monthly trend. Explain your reasoning step by step so I can check it.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-analyst-in-microsoft-365-copilot","learnLabel":"Microsoft Support: Get started with Analyst","related":["researcher","copilot-cowork"]},{"id":"facilitator","name":"Facilitator","aliases":["Facilitator agent","Microsoft Facilitator","@Facilitator","Facilitator in Teams"],"difficulty":"Hard","category":"Teams \u0026 Meetings","tags":["meetings","teams","collaboration","agents"],"packs":["core"],"hints":["I\u0027m the one at the table who watches the clock, so nobody else has to.","I keep a meeting on track by taking notes, answering questions and drafting documents as it happens.","Unlike Copilot in Teams, anything you ask me is visible to everyone in the meeting.","You\u0027ll find me on a meeting\u0027s Notes tab, in meeting chat via @-mention, and in Teams Rooms.","I\u0027m the Teams agent that facilitates meetings with live notes everyone can edit, agenda timers and Word drafts."],"description":"An AI agent for Teams meetings and Teams Rooms that helps keep discussions on track. It keeps collaborative live notes, tracks agenda time, answers questions from meeting and web content, and can draft Word documents during or after the meeting.","why":"Nobody gets stuck being the scribe, and everyone works from the same live notes, agenda and timer, so the conversation stays focused and on schedule.","useCases":[{"title":"Keeping to the agenda","text":"A project manager adds agenda topics in meeting chat and lets the timeline markers and midway reminders keep a kick-off from overrunning."},{"title":"Requirements workshop","text":"In a requirements workshop, a consultant asks the agent to draft a business requirements document in Word during or straight after the meeting."},{"title":"Teams Room huddle","text":"A school leadership team meets in a Teams Room; everyone edits the shared live notes while timers keep each agenda topic moving."}],"prompt":"@Facilitator Add \u0027budget review\u0027 and \u0027launch risks\u0027 to the agenda, then once we wrap up, draft a Word document of what we decided.","learnMore":"https://learn.microsoft.com/en-us/microsoftteams/facilitator-teams","learnLabel":"Microsoft Learn: Facilitator in Teams","related":["interpreter","planner-agent"]},{"id":"planner-agent","name":"Planner Agent","aliases":["Project Manager agent","Project Manager","Microsoft Planner Agent"],"difficulty":"Hard","category":"Agents","tags":["agents","automation","collaboration"],"packs":["core"],"hints":["I\u0027m assignable like any teammate, but you won\u0027t find me on the org chart.","Assign me a task and I\u0027ll draft the work, while you stay assigned too to follow along.","I can write status reports for the last week, fortnight, month or quarter, in a length you choose.","Board view can group tasks by AI agent progress: pending, assigned to me, couldn\u0027t complete, ready for review.","Formerly the Project Manager agent, I now carry Planner\u0027s name and a matching icon."],"description":"An AI agent built into Microsoft Planner that you can assign tasks to. It drafts the work for you to review, writes status reports from your plan data and, in premium plans, can turn a high-level goal into tasks.","why":"Routine project admin, such as drafting task output and writing status updates, can be handed to an agent, leaving the team more time for the work that needs people.","useCases":[{"title":"Fortnightly status update","text":"A project lead opens the Reports tab, picks the last two weeks and a concise length, and shares the result with stakeholders as a SharePoint newsletter."},{"title":"Delegate a first draft","text":"A marketing coordinator assigns the agent a task to draft a launch announcement outline, then reviews it once the task shows as ready for review."},{"title":"Goal to task list","text":"An operations manager on a premium plan types a high-level goal like \u0027open the new depot by June\u0027 and has the agent generate tasks to refine."}],"prompt":"Draft a one-page announcement of our new returns process: what changes, who is affected and the key dates. Use the policy document I\u0027ve uploaded as your source and note anything you couldn\u0027t confirm.","learnMore":"https://support.microsoft.com/en-us/planner/copilot/access-planner-agent","learnLabel":"Microsoft Support: Access Planner Agent","related":["facilitator","agent-flows"]},{"id":"employee-self-service-agent","name":"Employee Self-Service agent","aliases":["Employee Self-Service","ESS agent","ESS","Employee Self Service agent","Employee Self-Service Agent in M365 Copilot"],"difficulty":"Expert","category":"Agents","tags":["agents","studio","knowledge","automation"],"packs":["core"],"daily":false,"hints":["I\u0027m a head start, not a blank page: organisations add their own knowledge and systems.","People ask me about policies, benefits or a stubborn laptop, and I can raise a ticket.","I come with ready-made scenarios for Workday and ServiceNow: getting, creating and updating cases.","Staff meet me inside Microsoft Copilot, mobile app included, as an agent their organisation publishes.","Think HR and IT self-service, packaged as prebuilt agent starters that organisations deploy through Copilot Studio."],"description":"A prebuilt set of agent starters for HR and IT that organisations deploy through Copilot Studio. Employees ask questions in Microsoft Copilot, from policies and benefits to IT troubleshooting, and can take actions in systems such as Workday and ServiceNow.","why":"Staff can ask a question or start an HR or IT request in the Copilot they already use, without hunting for the right portal, while organisations start from a prebuilt starter rather than building from scratch.","useCases":[{"title":"New starter benefits","text":"A new starter asks which benefits they\u0027re eligible for and how to enrol, and gets an answer drawn from the organisation\u0027s HR knowledge instead of emailing HR."},{"title":"Device setup help","text":"A clinic nurse asks how to set up a new tablet and fix a sign-in problem, getting guided steps from the IT agent."},{"title":"Sandbox-first rollout","text":"A consultant deploys the HR starter in a sandbox, runs FlightCheck to catch configuration issues, then deploys the IT starter separately."}],"prompt":"How much parental leave am I entitled to under our policy, and what do I need to submit? If a case needs to be raised, please start it for me.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/employee-self-service/declarative-agent-overview","learnLabel":"Microsoft Learn: Employee Self-Service agent","related":["copilot-studio","declarative-agents","custom-engine-agents"]},{"id":"agent-registry","name":"Agent Registry","aliases":["Registry","Microsoft 365 agent registry","M365 Agent Registry","Agent inventory"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["agents","governance","admin"],"packs":["core"],"hints":["I\u0027m the admin\u0027s roll call, not the shop window.","I give admins one central place to monitor, manage and govern every agent available to their organisation.","My summary cards count everything, the ownerless and the unmanaged.","You\u0027ll find me in the Microsoft 365 admin center under Agents, then All Agents.","I\u0027m the \u0027registry\u0027: one list of every agent your organisation can use, with owner, publisher type and status."],"description":"The Microsoft 365 admin center\u0027s central list of every agent available to your organisation, showing ownership, publisher type and status. Admins can filter and export it to monitor, manage and govern agents, and tenants with the right licence also see risk signals.","why":"Agents can come from Microsoft, partners and colleagues, so IT needs one place to see what exists, who owns it and what\u0027s unmanaged. That visibility makes it easier to keep agents under control.","useCases":[{"title":"Cleaning up ownerless agents","text":"After a staff member\u0027s account is deleted, a university IT admin uses the Agents without owners card to find their shared agents and block or delete them."},{"title":"Audit-ready agent list","text":"A public-sector compliance lead exports the registry to CSV, filtered by publisher type, and hands the list to auditors."},{"title":"Reviewing agent risk","text":"With the right licence, a bank\u0027s security analyst opens an agent\u0027s Risk details to see high, medium and low signals from Microsoft Purview, Entra and Defender."}],"prompt":"I\u0027m a Microsoft 365 admin. Give me a weekly checklist for reviewing the agent registry: how to spot agents without owners or unmanaged agents, which filters to use, and what to do before blocking or deleting an agent.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-registry?view=o365-worldwide","learnLabel":"Microsoft Learn: Agent registry"},{"id":"champion-community","name":"Champion Program","aliases":["Microsoft 365 Champion Program","Microsoft 365 Champion community","Copilot Champions","Champions community","AI Champions"],"difficulty":"Hard","category":"Adoption \u0026 Learning","tags":["adoption","learning"],"packs":["core"],"daily":false,"hints":["I\u0027m a club for the colleague who always says, \u0027Here, let me show you.\u0027","I\u0027m for people who blend tech know-how with people skills to help colleagues adopt Microsoft 365 and Copilot.","My calls go by \u0027Driving Adoption\u0027, and recordings let you catch up on demand.","I\u0027m filed under Training on Microsoft\u0027s Adoption site, yet I\u0027m a network of peers, not a course.","A short sign-up form is all it takes to become a Champion yourself."],"description":"A free Microsoft community and resource hub for the people who help colleagues adopt Microsoft 365 and Copilot. Members get peer networking, an adoption asset library, Microsoft experts, community calls and a forum.","why":"New tools stick when someone down the hall can show you how. The community gives those helpers peers, adoption assets and Microsoft experts, so good habits spread through the organisation.","useCases":[{"title":"Write the role charter","text":"A public-sector adoption lead drafts a one-page role charter from Microsoft\u0027s AI Champion guide, then invites a Champion from each department."},{"title":"Learn from peers","text":"A hospital digital trainer joins a Driving Adoption call, watches an on-demand recording and asks the forum how other organisations got staff using Copilot."},{"title":"Share early wins","text":"A bank\u0027s internal-comms specialist uses the storytelling guide and sample adoption plan to share early wins with branch staff."}],"prompt":"I\u0027m setting up an AI Champions network for about 800 staff. Help me draft a one-page role charter (purpose, expectations, what Champions don\u0027t do) and a short email inviting people to join.","learnMore":"https://adoption.microsoft.com/en-us/become-a-champion/","learnLabel":"Microsoft Adoption: Become a Champion","related":["copilot-success-kit","copilot-academy"]},{"id":"channel-agent-teams","name":"Channel Agent","aliases":["Channel agent in Teams","Channel Agent in Microsoft Teams","Channel Agent for Teams channels","Teams Channel Agent","Channel Agents"],"difficulty":"Hard","category":"Teams \u0026 Meetings","tags":["teams","agents","collaboration","meetings"],"packs":["core"],"daily":false,"hints":["I take my name from the place I live, not from a person.","I flag deadlines and answer questions about the work, as a domain expert for one team.","I draft status reports as Loop files, ready for your team to review and customise.","Unlike Facilitator, which belongs to a single meeting, I belong to one place where a team works.","A Teams channel can have only one of me: its own dedicated AI expert."],"description":"Gives a Teams channel its own AI expert, currently in public preview. It draws on the channel\u0027s messages, files and approved meeting summaries to answer questions, flag deadlines, draft status reports and create tasks.","why":"Project knowledge often sits in scattered threads and files. A dedicated expert for the channel can answer questions from that material and draft status updates, so people spend less time chasing colleagues for the latest.","useCases":[{"title":"Friday status report","text":"A project manager asks the agent to draft a weekly status report from the channel\u0027s conversations and files, then reviews and edits it before sharing."},{"title":"Deadline check","text":"A marketing lead in a campaign channel asks which deadlines are coming up and gets an answer drawn from the channel\u0027s messages and shared files."},{"title":"Meeting actions to tasks","text":"After a channel meeting, a programme officer approves the agent\u0027s summary, then asks it to create tasks with reminders for the agreed actions."}],"prompt":"Draft this week\u0027s status report for our team: summarise progress since Monday, flag any deadlines at risk, and list the open tasks with their owners.","learnMore":"https://support.microsoft.com/en-us/teams/chat-channels/get-started-with-channel-agent-for-teams-channels","learnLabel":"Microsoft Support: Channel Agent","related":["facilitator","planner-agent"]},{"id":"copilot-academy","name":"Copilot Academy","aliases":["Microsoft Copilot Academy","Viva Learning Copilot Academy","Microsoft 365 Copilot Academy"],"difficulty":"Medium","category":"Adoption \u0026 Learning","tags":["learning","adoption"],"packs":["core"],"hints":["I\u0027m a school whose door is open by default: everyone with Microsoft 365 can walk in.","Microsoft has already curated my lessons, so nobody has to build an AI curriculum from scratch.","Admins with a Viva licence can duplicate me, swap in their own learning paths and publish to groups.","I\u0027m sometimes mistaken for Microsoft Learn, but I live in Viva Learning and borrow its lessons.","Graduation caps optional: my name ends with \u0027Academy\u0027, and my lessons are all about AI."],"description":"Officially called Microsoft Copilot Academy, this is a ready-made, Microsoft-curated learning academy inside Viva Learning, with structured Copilot learning paths. Knowledge admins can restrict it to Copilot-licensed users, and admins with a Viva licence can duplicate and customise it.","why":"People get more from Copilot when they know how to use it well. The Academy gives everyone ready-made lessons inside Viva Learning, and gives admins a head start on staff training.","useCases":[{"title":"Tailored company academy","text":"A manufacturer\u0027s L\u0026D lead duplicates the academy, swaps in company-specific learning paths and publishes it to the sales and operations groups."},{"title":"Match training to licences","text":"A university\u0027s Knowledge admin restricts the academy to Copilot-licensed staff, so learning matches who actually has Copilot."},{"title":"Monthly Teams nudge","text":"A sales rep with a Copilot licence opens the monthly Teams notification, picks a learning path and tries one new Copilot skill before their next customer call."}],"prompt":"I\u0027m a Knowledge admin rolling out Copilot to 300 staff. Draft a plan for introducing Microsoft Copilot Academy in Viva Learning: who gets access, how to customise it for finance and sales, and a short Teams announcement.","learnMore":"https://learn.microsoft.com/en-us/viva/learning/academy-copilot","learnLabel":"Microsoft Learn: Microsoft Copilot Academy","related":["copilot-prompt-gallery","champion-community"]},{"id":"copilot-chat","name":"Copilot Chat","aliases":["Microsoft Copilot Chat","Microsoft 365 Copilot Chat","Business Chat","BizChat"],"difficulty":"Easy","category":"Copilot Chat","tags":["chat","essentials"],"packs":["core"],"introduced":"2023-03","hints":["I\u0027m not a search tab, a canvas or a notebook; I\u0027m the one you simply talk to.","I answer, draft and summarise using the web and, with one toggle on, your work data.","Type a slash and I\u0027ll let you point me at one specific file, person or meeting.","I\u0027ve swapped name tags: my first said \u0027Business\u0027, a later one said \u0027365\u0027.","I\u0027m the Copilot you chat with, on the web, on your phone, and inside Teams and Outlook."],"description":"The conversational assistant in the Copilot app, Outlook, Teams and Office: speak or type a request and it drafts, summarises and answers using the web and, via Work IQ, your work data. Once called Business Chat, then Microsoft 365 Copilot Chat.","why":"Instead of hunting through inboxes and folders, you just ask. It can draft, summarise and answer from the web and the work you already have access to, so you spend your time deciding, not digging.","useCases":[{"title":"Prep for a client call","text":"Ask for a summary of recent emails and meetings with a client, pointing to the account file with a slash, then draft talking points."},{"title":"Explain a policy","text":"Ask Copilot to summarise a long HR policy document in plain English and list the three things managers most need to know."},{"title":"Draft a stakeholder update","text":"A project officer asks for a plain-English status update from this week\u0027s team meeting, then refines the tone and length with follow-up requests."}],"prompt":"Goal: draft a 150-word update for my leadership team. Context: we\u0027re two weeks from launching our new onboarding portal. Details: friendly, plain English, flag one risk and one decision we need from them. Data: the launch plan file and last Tuesday\u0027s project meeting.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-microsoft-365-copilot-chat","learnLabel":"Microsoft Support: Copilot Chat","related":["copilot-search","copilot-pages","copilot-notebooks"]},{"id":"copilot-controls","name":"Copilot Control System","aliases":["Copilot controls","CCS","Microsoft Copilot Control System"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["governance","admin"],"packs":["core"],"daily":false,"hints":["I\u0027m not a switch, a product or a licence - think of me as an umbrella.","I help IT and security teams secure, manage and measure Copilot and agents as they scale.","I rest on three pillars: security and governance, management, and measurement and reporting.","The admin center\u0027s Copilot \u003e Settings page is where admins change things; I\u0027m the bigger picture around it.","Microsoft\u0027s pages use two names for me, and one of them ends in \u0027System\u0027."],"description":"Microsoft\u0027s umbrella framework of guides and tools for securing, managing and measuring Microsoft 365 Copilot, Copilot Chat and Microsoft Copilot Studio, built on three pillars. Microsoft\u0027s pages use both \u0027Copilot Control System\u0027 and \u0027Copilot controls\u0027.","why":"Rolling Copilot and agents out across a whole company is smoother when security, settings and usage reporting follow one plan. IT gets clear guardrails, and the business can scale with confidence.","useCases":[{"title":"Pre-rollout oversharing check","text":"A council\u0027s IT team works through the oversharing blueprint in the security and governance pillar before switching Copilot on for staff."},{"title":"Agent and web-search rules","text":"Using the management pillar\u0027s admin center scenarios, a retail IT admin decides how staff create and use agents and whether Copilot can search the web."},{"title":"Proving adoption and value","text":"A change lead at a bank uses the measurement pillar\u0027s Copilot Dashboard and analytics playbooks to show executives how Copilot is being adopted."}],"prompt":"I\u0027m the IT admin for a 2,000-person company about to roll out Microsoft 365 Copilot. Using the three pillars of Copilot controls (security and governance, management, measurement and reporting), draft a 30-60-90 day plan with owners and the first checks to run.","learnMore":"https://adoption.microsoft.com/en-us/copilot/copilot-controls/","learnLabel":"Microsoft Adoption: Copilot controls","related":["copilot-dashboard","purview-for-copilot"]},{"id":"copilot-create","name":"Copilot Create","aliases":["Create","Create in the Microsoft Copilot app","Create in the Microsoft 365 Copilot app"],"difficulty":"Medium","category":"Copilot Chat","tags":["creation"],"packs":["core","wave-2"],"introduced":"2025-04","hints":["I\u0027m a workshop where a single sentence does the heavy lifting.","I turn what you describe into visuals or written drafts.","Whatever I make, you can edit it and save it to your Library.","Look behind the \u0027Apps and more\u0027 icon at the top left of the Copilot app.","My name is the verb for making something new: posters, banners, videos and more."],"description":"A creation hub in the Microsoft Copilot app. Describe an image, banner, poster, video, infographic, story or form, or start from a template, and Copilot makes it for you to edit and save to your Library.","why":"Get a first draft of a visual or a written piece just by describing it, then refine it. Official Brand Kits help keep it on brand when your organisation provides one.","useCases":[{"title":"On-brand event banner","text":"A marketing coordinator describes a webinar banner and, if the organisation provides an official Brand Kit, gets a draft that stays on brand."},{"title":"Classroom infographic","text":"A teacher describes an infographic explaining the water cycle for Year 5, then refines it and saves it to their Library."},{"title":"Quick staff survey","text":"An HR officer describes a short staff pulse survey and gets a draft form to review and tweak before sharing it."}],"prompt":"Create a wide banner for our customer webinar \u0027Budgeting basics\u0027 in a clean, friendly style, using calm blues and leaving space on the left for the title text.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-create-in-the-microsoft-365-copilot-app","learnLabel":"Microsoft Support: Get started with Create","related":["copilot-pages"]},{"id":"copilot-dashboard","name":"Copilot Dashboard","aliases":["Copilot Analytics","Viva Insights Copilot Dashboard","Microsoft Copilot Dashboard"],"difficulty":"Hard","category":"Security \u0026 Admin","tags":["analytics","adoption","admin"],"packs":["core"],"hints":["Think of me as a four-part report card on an organisation\u0027s AI journey.","I help leaders judge if Copilot is landing: are people ready, using it, gaining from it, happy?","My readiness, adoption and impact pages each look back over the previous 28 days.","I\u0027m often mixed up with the Microsoft 365 admin center\u0027s simpler Copilot usage reports, but I live elsewhere.","Find me in Viva Insights\u0027 left navigation, under a name ending in \u0027Dashboard\u0027."],"description":"A Viva Insights dashboard that tracks four things: how ready your organisation is for Copilot, how people are adopting it, what impact it\u0027s having and how people feel about it. It covers Copilot Chat usage too.","why":"Rolling out AI is easier to steer when readiness, usage, impact and feelings are visible in one place. Leaders can back what\u0027s working and show the value with evidence, not hunches.","useCases":[{"title":"Pre-rollout readiness check","text":"Before a rollout, a university IT lead checks the Readiness page\u0027s recommended steps, like enabling Copilot Chat and activating agents, to decide what to tackle first."},{"title":"Team adoption check-in","text":"A sales manager reviews her group\u0027s adoption metrics to see how often the team uses Copilot and where coaching might help."},{"title":"Telling the impact story","text":"A change manager at a health provider combines impact metrics with survey-based sentiment to tell executives how Copilot is landing with staff."}],"prompt":"Help me prepare a 10-minute update for our leadership team on Copilot adoption. Using the four categories in the Copilot Dashboard (readiness, adoption, impact and sentiment), outline the questions to answer, the numbers to show and the actions to recommend.","learnMore":"https://learn.microsoft.com/en-us/viva/insights/org-team-insights/copilot-dashboard","learnLabel":"Microsoft Learn: Copilot Dashboard","related":["copilot-controls"]},{"id":"copilot-in-edge","name":"Copilot in Edge","aliases":["Edge Copilot","Copilot Mode in Edge","Copilot in Microsoft Edge","Browse with Copilot"],"difficulty":"Medium","category":"Devices \u0026 Mobile","tags":["chat","windows"],"packs":["core"],"daily":false,"hints":["I do my work in plain sight, and you can grab the wheel whenever you like.","I can summarise the page you\u0027re on and compare it with your other open tabs.","I\u0027ll ask for your attention before buying, booking, sending an email or deleting a calendar event.","I\u0027m not the Copilot app on Windows; I live inside a web browser instead.","Click my icon at the top right of Microsoft Edge to chat about the page you\u0027re on."],"description":"Copilot built into Microsoft Edge has a side pane that chats about the page you\u0027re on, summarises it and compares tabs. Browse with Copilot, which is experimental, can also click and type in your tabs while you watch.","why":"Instead of juggling tabs and copy-pasting into another app, you can ask about the page in front of you. With a work account, enterprise data protection applies, shown by a shield icon.","useCases":[{"title":"Compare supplier pages","text":"A buyer opens three supplier pages and asks Copilot to compare prices, delivery terms and warranty details across the tabs."},{"title":"Skim before you read","text":"A policy analyst opens a long report on the web and asks Copilot to summarise it before deciding whether to read the full text."},{"title":"Supervised browsing","text":"Where Browse with Copilot is available, a travel coordinator watches it work through open tabs and takes over when it asks for attention before booking."}],"prompt":"Summarise this page in five bullet points, then compare it with my other open tabs and tell me which supplier has the best delivery terms.","learnMore":"https://explore.microsoft.com/en-us/edge/copilot","learnLabel":"Microsoft Edge: Copilot in Edge"},{"id":"copilot-in-forms","name":"Copilot in Forms","aliases":["Forms","Copilot in Microsoft Forms","Forms Copilot"],"difficulty":"Medium","category":"Microsoft 365 Apps","tags":["creation","collaboration"],"packs":["core"],"hints":["I\u0027m a ghostwriter for questions that other people will end up answering.","Describe what you want to find out and I\u0027ll propose a title, questions and answer options.","I can review a draft for leading or double-barrelled questions and suggest improvements.","I\u0027m not the agent that makes surveys from chat; I\u0027m built into the survey-and-quiz app itself.","Start a new survey or quiz in Microsoft Forms, describe it, and I\u0027ll draft the lot."],"description":"Describe the survey or quiz you need and Copilot drafts a title, questions and answer options. It can also review your questions, help you share the form, and summarise the responses into key findings and insights.","why":"A blank form is slow to build and easy to get wrong. Copilot gives you a solid first draft, reviews your questions and turns piles of responses into insights you can act on.","useCases":[{"title":"Pulse survey check","text":"An HR partner describes an employee pulse survey, lets Copilot draft the questions, then asks it to review them for leading or double-barrelled wording before sending."},{"title":"Class quiz in minutes","text":"A teacher describes this week\u0027s topic and Copilot drafts a quiz with questions and answer options, ready to keep, refine or regenerate."},{"title":"Resident feedback survey","text":"A council officer drafts a resident feedback form with Copilot, shares it by QR code, then asks Copilot to summarise the responses into key findings."}],"prompt":"Create a short employee pulse survey about workload, team communication and career growth. Keep the wording neutral and avoid leading or double-barrelled questions.","learnMore":"https://support.microsoft.com/en-us/Forms/welcome-to-copilot-in-forms","learnLabel":"Microsoft Support: Copilot in Forms"},{"id":"copilot-in-loop","name":"Copilot in Loop","aliases":["Loop","Copilot in Loop workspaces","Loop Copilot","Copilot for Loop"],"difficulty":"Hard","category":"Microsoft 365 Apps","tags":["collaboration"],"packs":["core"],"daily":false,"hints":["Part of my toolkit was boxed up on purpose; Microsoft plans to bring some back.","I can recap the changes made on a page.","In meetings I generate collaborative notes with suggested tasks, shareable as components.","Copilot Pages is built on the same technology as the app I live in.","Find me behind the upper-right Copilot button of a page in Microsoft\u0027s Loop app."],"description":"Copilot inside the Loop app lets licensed users ask web or work questions in a chat and insert answers onto a page, recap page changes, and generate collaborative notes in meetings. Microsoft has trimmed some features while aligning Loop with Copilot Pages.","why":"Shared pages change fast. A quick recap and auto-drafted meeting notes with suggested tasks keep everyone in step, and colleagues without a Copilot licence can still view and edit what Copilot created.","useCases":[{"title":"Recap page changes","text":"A marketing lead opens the Recap pane and asks Copilot to summarise the latest changes on the campaign planning page."},{"title":"Meeting notes with tasks","text":"An operations manager lets Copilot generate collaborative notes during the weekly stand-up, then shares the suggested tasks as components the whole team can edit."},{"title":"Web answer onto the page","text":"A school coordinator asks the Copilot chat a web question on exam-preparation techniques and inserts the answer onto the staff planning page."}],"prompt":"Give me five short bullet points on best practice for onboarding remote new starters, with one sentence on why each matters. I\u0027ll insert them onto our team page.","learnMore":"https://support.microsoft.com/en-us/loop/frequently-asked-questions-about-copilot-in-loop","learnLabel":"Microsoft Support: Copilot in Loop FAQ","related":["copilot-in-onenote"]},{"id":"copilot-in-onedrive","name":"Copilot in OneDrive","aliases":["OneDrive","OneDrive Copilot","Copilot for OneDrive","OneDrive agents"],"difficulty":"Medium","category":"Microsoft 365 Apps","tags":["files"],"packs":["core","wave-2"],"introduced":"2024-09","hints":["I spare you from opening the filing-cabinet drawers one at a time.","Ask me one question about up to five files and I\u0027ll answer across all of them.","I can turn a Word document into an audio overview, with one host or two.","I share a licence and an admin switch with my cousin in SharePoint.","Look for the Copilot button at the bottom right of OneDrive for Business on the web."],"description":"Copilot in OneDrive for Business on the web answers questions across several files, compares and summarises them, and turns Word documents, PDFs and Teams recordings with transcripts into audio overviews. It can also create presentations and reports and organise folders.","why":"Finding the answer often means opening file after file. Copilot reads across several documents at once, so you can compare files, get the gist and move on to the work that matters.","useCases":[{"title":"Compare supplier proposals","text":"A procurement officer selects two supplier proposals and asks Copilot to compare them and list the key differences in price terms and delivery commitments."},{"title":"Listen to a board paper","text":"A finance manager turns a long board paper into an audio overview and listens to the key points on the way to a meeting."},{"title":"Ask across inspection reports","text":"A site manager asks one question across several inspection reports, without opening each file, to find which sites still have open safety actions."}],"prompt":"Compare these two supplier proposals and list the key differences in pricing, delivery timelines and support terms. Then give me a three-bullet summary of which looks stronger and why.","learnMore":"https://support.microsoft.com/en-us/onedrive/get-started-with-copilot-in-onedrive","learnLabel":"Microsoft Support: Copilot in OneDrive","related":["copilot-in-sharepoint"]},{"id":"copilot-in-onenote","name":"Copilot in OneNote","aliases":["OneNote","OneNote Copilot","Copilot for OneNote","Copilot OneNote"],"difficulty":"Easy","category":"Microsoft 365 Apps","tags":["collaboration","creation"],"packs":["core"],"hints":["I\u0027m the tidy-minded friend of anyone with a messy pile of jottings.","I turn scribbles into summaries, task lists and clearer wording.","I read whichever page, section or passage you point me at.","I\u0027m often mixed up with Copilot Notebooks, but I live inside a Microsoft 365 app.","I\u0027m the AI helper inside OneNote; find my button on the Home tab."],"description":"Copilot inside OneNote reads the page, section or text you point it at to summarise it, rewrite it for clarity, build task lists and analyse ideas. It can also draft new content such as event plans, presentation outlines and meeting agendas.","why":"Notes pile up faster than anyone rereads them. Copilot condenses them, tidies the wording and pulls out task lists, so your scribbles turn into action instead of an archive.","useCases":[{"title":"Section summary","text":"A project manager asks Copilot to summarise a whole section of weekly check-in notes into key decisions and open questions before the steering meeting."},{"title":"Lesson outline","text":"A teacher highlights scattered lesson ideas and asks Copilot to analyse them, then draft a presentation outline for the term\u0027s first class."},{"title":"Event plan brainstorm","text":"An events coordinator jots venue and catering ideas, then asks Copilot to brainstorm an event plan and a task list of what to book next."}],"prompt":"Summarise this section in five bullet points, then create a task list of every follow-up mentioned, with owners where I\u0027ve named them.","learnMore":"https://support.microsoft.com/en-us/onenote/welcome-to-copilot-in-onenote","learnLabel":"Microsoft Support: Copilot in OneNote","related":["copilot-in-loop"]},{"id":"copilot-in-outlook","name":"Copilot in Outlook","aliases":["Outlook Copilot","Outlook","Copilot Chat in Outlook","Microsoft 365 Copilot in Outlook","Copilot for Outlook"],"difficulty":"Easy","category":"Microsoft 365 Apps","tags":["email","essentials"],"packs":["core"],"hints":["I\u0027m a chat partner for your messages and meetings, but my home isn\u0027t Teams.","I let you manage your mail and calendar just by asking in plain words.","I\u0027ll flag your manager\u0027s unread mail or set an automatic reply the moment you ask.","Click my button near the top of the app and I open beside your mail.","I\u0027m the AI assistant built into Outlook itself, not a separate chat app."],"description":"An AI chat built into Outlook that opens beside your mail. Ask about your messages, calendar and meetings, then have it act: drafting, scheduling, flagging or setting an automatic reply.","why":"Instead of clicking through menus, you just say what you want done with your mail and calendar. Less admin, more time for the work that needs you.","useCases":[{"title":"Flag the boss\u0027s emails","text":"A regional sales lead asks Copilot to flag all unread emails from their manager before a stand-up, so the boss\u0027s requests get answered first."},{"title":"Automatic reply for leave","text":"A school administrator taking leave next Friday asks Copilot to set an automatic reply for that day, without digging through settings menus."},{"title":"Plan tomorrow\u0027s calendar","text":"Before a busy day, a finance controller asks Copilot what\u0027s on their calendar tomorrow, then has it draft a note asking to reschedule a clash."}],"prompt":"Flag all unread emails from my manager, then set up an automatic reply for next Friday saying I\u0027m out of the office and will reply on Monday.","learnMore":"https://support.microsoft.com/en-us/outlook/copilot-outlook/chat-with-copilot-in-outlook","learnLabel":"Microsoft Support: Chat with Copilot in Outlook","related":["outlook-summary-by-copilot","outlook-coaching-by-copilot","outlook-prioritize-my-inbox"]},{"id":"copilot-in-sharepoint","name":"Copilot in SharePoint","aliases":["SharePoint","SharePoint Copilot","SharePoint agents","Copilot for SharePoint"],"difficulty":"Hard","category":"Microsoft 365 Apps","tags":["files","knowledge","agents"],"packs":["core"],"hints":["I don\u0027t just fetch things; I can build whole rooms from a plain-English request.","I find content, answer questions about it and help you catch up.","Type /cost and I\u0027ll show credits used and the monthly limit remaining.","Microsoft announced at Ignite 2024 that every site I work on now has an agent.","My OneDrive cousin shares my licence, but my home is SharePoint."],"description":"Copilot in SharePoint works with your files, pages, lists and libraries to answer questions, find content and catch you up. It can also create sites, pages, lists, libraries, interactive reports and Office files from plain-English instructions.","why":"Teams keep their knowledge in sites, libraries and lists that nobody has time to trawl. Copilot finds, summarises and builds from that content in plain English, so people spend less time hunting and more time doing.","useCases":[{"title":"Catch up on a project","text":"A programme manager back from leave asks Copilot to catch them up on the project site\u0027s pages, lists and libraries."},{"title":"Build a tracking list","text":"An HR coordinator describes a new-starter checklist in plain English and asks Copilot to create a list to track it."},{"title":"Ask the site\u0027s agent","text":"A council employee asks the policy site\u0027s agent where the leave procedure lives, rather than searching library by library."}],"prompt":"Catch me up on what\u0027s changed in this site since last week: summarise the key updates across its pages and libraries, and list any open items that need my attention.","learnMore":"https://learn.microsoft.com/en-us/sharepoint/copilot-in-sharepoint-get-started","learnLabel":"Microsoft Learn: Copilot in SharePoint","related":["copilot-in-onedrive"]},{"id":"copilot-in-stream-clipchamp","name":"Copilot in Clipchamp Video Player","aliases":["Copilot in Stream","Stream Copilot","Clipchamp video player","Copilot in Microsoft Stream","Copilot in the Clipchamp player"],"difficulty":"Hard","category":"Microsoft 365 Apps","tags":["files","learning"],"packs":["core"],"daily":false,"hints":["No script, no story: I only have something to say when the words were written down.","I\u0027m the colleague who sat through it so you don\u0027t have to.","My answers carry timestamps, so you can jump straight to the moment that matters.","I live in the successor to a Microsoft video service whose classic version is deprecated.","Open a video in the Clipchamp player and I appear on the right, ready to summarise it."],"description":"Copilot appears on the right of a video in the Clipchamp player (the successor to Stream) to summarise it or answer questions, with timestamps you can jump to. It needs the video\u0027s transcript to work and can\u0027t generate or edit video.","why":"Nobody has time to watch every recorded briefing or training clip from start to finish. Copilot gives you the gist and points you to the exact moment that matters.","useCases":[{"title":"Onboarding video Q\u0026A","text":"A new starter opens a recorded onboarding session, asks Copilot where leave policy was covered and jumps straight to that timestamp."},{"title":"Town hall catch-up","text":"An executive who missed the quarterly town hall asks Copilot to summarise the recording, then checks the timestamp for the budget announcement."},{"title":"Training refresher","text":"A nurse manager asks Copilot what a recorded safety training said about incident reporting, using the timestamp to rewatch just that section."}],"prompt":"Summarise this video in five bullet points, then tell me where the presenter explains the new expenses policy, with the timestamp.","learnMore":"https://support.microsoft.com/en-us/clipchamp/stream-pages/ask-questions-get-summaries-of-any-video-with-microsoft-copilot-in-the-clipchamp-player","learnLabel":"Microsoft Support: Copilot in the Clipchamp player"},{"id":"copilot-in-teams-chats-channels","name":"Copilot in Teams","aliases":["Teams Copilot","Copilot in Teams chat","Copilot in Teams channels","Copilot in Teams chats and channels","Copilot Chat in Teams"],"difficulty":"Easy","category":"Teams \u0026 Meetings","tags":["meetings","teams","chat","essentials"],"packs":["core"],"hints":["I\u0027m the colleague who skimmed every message while you were on holiday.","I pull the takeaways, action items and decisions out of a long, noisy conversation.","Unless you name a time frame, I only look back about a month.","I live in written conversations: one-to-one chats, group chats and channel threads.","Click \u0027Open Copilot\u0027 in the top-right corner of a chat and I appear."],"description":"A Copilot pane for Teams chats, meeting chats and channel posts. Open it to summarise what you\u0027ve missed, pull out action items and decisions, and ask questions about the conversation, with sources that link back to the original messages.","why":"Teams threads pile up fast. Instead of scrolling for an hour, you ask what you missed and get the key points, decisions and next steps, with links back to the messages they came from.","useCases":[{"title":"What did I miss?","text":"A ward manager back from two weeks off asks Copilot in the team\u0027s group chat what she missed, then clicks a source to check the rota change."},{"title":"Summarise a channel thread","text":"A marketing lead opens a long campaign-launch thread in a channel and selects Summarize thread to see the decisions and action items before the review."},{"title":"Scope to last month","text":"A council project officer asks in the team\u0027s group chat, \u0027What did we agree last month about delivery dates?\u0027, so Copilot reads just that time frame."}],"prompt":"Summarise what I\u0027ve missed in this chat over the last two weeks: key decisions, action items with owners, and any links people shared.","learnMore":"https://support.microsoft.com/en-us/teams/copilot/how-to-use-microsoft-365-copilot-in-teams-chats-and-channels","learnLabel":"Microsoft Support: Copilot in Teams chats and channels","related":["copilot-in-teams-meetings"]},{"id":"copilot-in-teams-meetings","name":"Copilot in Teams Meetings","aliases":["Copilot in meetings","Teams meeting Copilot","Microsoft Copilot in Teams meetings","Copilot and other AI"],"difficulty":"Medium","category":"Teams \u0026 Meetings","tags":["meetings","teams","chat"],"packs":["core"],"hints":["I\u0027m the whisper at your shoulder; nobody else in the room hears what we say.","I\u0027ll point out where people disagree and suggest questions that might move things forward.","Turn up well after the start and I may offer to catch you up.","Don\u0027t mix me up with my chat-and-channel cousin: I work from what\u0027s said aloud.","Find my button in a live meeting\u0027s controls; I\u0027m the pane that opens."],"description":"A private Copilot pane inside a live or finished Teams meeting. It summarises what was said, who said it, where people disagree and what to do next, working from the transcript or speech-to-text plus the meeting chat.","why":"Late to the call, or lost in a long discussion? You can quietly ask what\u0027s been said, where people disagree and what to do next, without interrupting anyone or exposing your question.","useCases":[{"title":"Late-join catch-up","text":"An operations manager joins a project meeting ten minutes late, accepts Copilot\u0027s offer to catch up, and joins the discussion without asking anyone to repeat themselves."},{"title":"Find the disagreements","text":"A product manager in a heated roadmap discussion privately asks Copilot where the team disagrees and what questions could move things forward, then steers the group."},{"title":"Ideas into Word","text":"A school principal asks Copilot in the meeting chat to list the ideas and feedback from the transcript and chat, then exports the long answer to Word."}],"prompt":"Where do we disagree on this topic? List each side\u0027s main points, then suggest three questions I could ask to move the meeting forward.","learnMore":"https://support.microsoft.com/en-us/teams/copilot/catch-up-on-meetings-with-microsoft-365-copilot-in-teams","learnLabel":"Microsoft Support: Copilot in Teams meetings","related":["copilot-in-teams-chats-channels","intelligent-recap","teams-meeting-recap"]},{"id":"copilot-in-teams-phone","name":"Copilot in Teams Phone","aliases":["Teams Phone Copilot","AI call summaries","Call recap","Copilot in Teams calls","Intelligent call recap"],"difficulty":"Hard","category":"Teams \u0026 Meetings","tags":["meetings","teams","voice"],"packs":["core"],"hints":["I\u0027m the note-taker for conversations that begin with a ring, not a calendar invite.","While you\u0027re still talking, I can list action items and suggest follow-up questions.","Transfer a call and I\u0027ll draft a briefing, so your colleague doesn\u0027t need the story repeated.","Find me in Calls history: hover over a transcribed call, then pick \u0027View summary\u0027 and \u0027View recap\u0027.","Whether it\u0027s VoIP, PSTN or a desk phone, I\u0027m the AI sidekick for the call."],"description":"Copilot for Teams calls, including phone-network (PSTN) calls and calls on desk phones. It can list action items and suggest follow-up questions mid-call, and for transcribed or recorded calls it can draft transfer notes and show a summary and recap.","why":"Calls are over in a click, and the details go with them. Copilot captures the next steps and briefs whoever you hand a call to, so nobody has to explain it all again.","useCases":[{"title":"Smooth call transfers","text":"Transfer a transcribed customer call to a specialist and Copilot drafts the transfer notes, so the customer isn\u0027t asked to repeat the whole problem."},{"title":"Candidate screening call","text":"A recruiter selects Copilot mid-call to get suggested follow-up questions and a list of action items before the candidate hangs up."},{"title":"Find the unresolved questions","text":"A council service officer opens a call recap and asks \u0027What questions were asked, answered, and unresolved?\u0027 to plan the callback without replaying the whole call."}],"prompt":"What questions were asked, answered, and unresolved on this call? List the action items, and tell me what the mood of the call was.","learnMore":"https://support.microsoft.com/en-us/teams/copilot/get-started-with-microsoft-365-copilot-in-teams-phone","learnLabel":"Microsoft Support: Copilot in Teams Phone","related":["copilot-without-transcript"]},{"id":"copilot-in-whiteboard","name":"Copilot in Whiteboard","aliases":["Whiteboard","Copilot in Microsoft Whiteboard","Whiteboard Copilot"],"difficulty":"Medium","category":"Microsoft 365 Apps","tags":["collaboration","creation"],"packs":["core"],"hints":["I\u0027m the colleague with one more idea when the room goes quiet.","I help a brainstorm along, then make sense of the pile.","I have exactly three tricks: Suggest, Categorize and Summarize.","My summaries land in a Loop component, but I\u0027m not the Copilot that lives in Loop.","Find me in Microsoft Whiteboard: a button beside the toolbar that adds, sorts and summarises sticky notes."],"description":"Copilot offers three tools for brainstorming with sticky notes. Suggest turns a prompt into ideas to add, Categorize groups notes into coloured clusters with headings, and Summarize writes them up in an editable Loop component.","why":"Workshops stall when ideas dry up or sticky notes pile up. Copilot gets ideas flowing, sorts the mess into themes and produces a summary you can edit and share.","useCases":[{"title":"Retro theme sorting","text":"After a sprint retro, the team adds sticky notes and Copilot groups them into coloured clusters with headings, so everyone can vote on the themes."},{"title":"Class brainstorm kick-start","text":"A teacher enters a prompt, inserts the best suggested ideas as sticky notes and uses Generate more when the class needs fresh angles."},{"title":"Campaign workshop recap","text":"A marketing manager summarises a campaign brainstorm\u0027s sticky notes into an editable Loop component and shares it with the wider team."}],"prompt":"Ideas for reducing meeting overload across our team, from quick wins to bigger changes.","learnMore":"https://support.microsoft.com/en-us/whiteboard/welcome-to-copilot-in-whiteboard","learnLabel":"Microsoft Support: Copilot in Whiteboard"},{"id":"copilot-memory","name":"Copilot Memory","aliases":["Memory","Personalization","Personalisation","Custom instructions","Enhanced personalization"],"difficulty":"Medium","category":"Copilot Chat","tags":["memory","prompting"],"packs":["core","wave-2"],"introduced":"2025-04","daily":false,"hints":["I\u0027m the reason Copilot isn\u0027t a goldfish.","I help Copilot\u0027s answers feel tailored to you instead of one-size-fits-all.","Ask \u0027What do you know about me?\u0027 and I\u0027ll show you what Copilot has been using.","My controls live in Copilot Chat\u0027s settings, beside a chat history toggle.","I\u0027m the memory that lets Copilot recall saved facts and lessons from past chats."],"description":"Copilot can save facts from your chats, learn from past conversations and follow instructions you write, so its answers feel tailored to you. You can review and manage it all in Settings, or start a temporary chat that skips it.","why":"Stop re-explaining your role, tone and preferences every time you open a chat. Copilot can carry that context forward, and you stay in control of what it keeps.","useCases":[{"title":"Standing writing preferences","text":"A finance analyst writes custom instructions once: lead with the headline number, use Australian spelling, keep commentary brief. Copilot applies them to later answers."},{"title":"Context that sticks","text":"A hospital recruiter mentions the nursing roles they hire for; Copilot can save that detail so later job-ad drafts start with the right context."},{"title":"Temporary chat for tough topics","text":"A manager rehearses a difficult performance conversation in a temporary chat, so Copilot neither uses nor updates its saved memories."}],"prompt":"What do you know about me and my preferences? List what you\u0027re using from my saved memories, custom instructions and chat history, then tell me how I can edit or remove anything that\u0027s out of date.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-personalization-memory","learnLabel":"Microsoft Learn: Copilot personalization and memory","related":["copilot-notebooks","copilot-prompt-gallery"]},{"id":"copilot-mobile-app","name":"Copilot Mobile","aliases":["Microsoft Copilot mobile app","Microsoft 365 Copilot app on iOS and Android","Microsoft 365 Copilot mobile app"],"difficulty":"Medium","category":"Devices \u0026 Mobile","tags":["mobile"],"packs":["core"],"hints":["I\u0027m Copilot\u0027s carry-on luggage.","I put Copilot conversations in your hand, wherever you happen to be.","Talk to me hands-free, or share your camera with Vision.","I\u0027m a whole app of my own, not Copilot tucked inside Outlook or Edge.","I\u0027m the mobile edition of the Copilot app, for iOS and Android."],"description":"The Microsoft Copilot app for iOS and Android. Chat with Copilot, have hands-free voice conversations, share your camera with Vision and open Search, Library, Create, Agents or Notebooks, depending on your licence.","why":"Copilot goes where you go, so questions, voice chats and a quick look through your camera aren\u0027t tied to a desk. On iOS there are even Siri, widget and CarPlay integrations.","useCases":[{"title":"Hands-free on site","text":"A facilities technician on site shares their camera with Vision and talks to Copilot hands-free about the equipment in front of them."},{"title":"Capture client conversations","text":"A consultant uses Record, with the client\u0027s permission, to capture an in-person meeting, then reads the transcript and summary in Chat."},{"title":"Voice chat between visits","text":"A regional sales manager holds a hands-free voice conversation with Copilot to prepare for the next client visit while walking in from the car."}],"prompt":"I\u0027m walking into a meeting with a regional water utility in five minutes. Give me a two-minute spoken-style briefing: what they do, recent news and three smart questions I could ask.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-the-microsoft-365-copilot-mobile-app","learnLabel":"Microsoft Support: Copilot mobile app","related":["copilot-chat","copilot-create"]},{"id":"copilot-notebooks","name":"Copilot Notebooks","aliases":["Notebooks","Copilot Notebook","Microsoft 365 Copilot Notebooks","Microsoft Copilot Notebooks"],"difficulty":"Medium","category":"Copilot Chat","tags":["knowledge","files","creation"],"packs":["core","wave-2"],"introduced":"2025-04","hints":["I\u0027m a briefcase whose contents stay live: when a source changes, my answers follow.","I take in chats, files, meetings and links, then find themes and draft from them.","I can turn what\u0027s inside me into a podcast-style audio overview.","I have a lightweight view in the Copilot app and a fuller one inside OneNote.","Picture a notebook built around one project, where every source you add is a \u0027reference\u0027."],"description":"An AI project workspace where you gather chats, files, meetings, pages and links as references, then ask Copilot questions, find themes or draft new content based only on them. It can also produce an audio overview, mind maps and infographics.","why":"Project knowledge is usually scattered across emails, files and meetings. A notebook keeps it in one place, so you can ask questions, spot themes and share the same sources with your team.","useCases":[{"title":"Project knowledge hub","text":"A programme manager adds the project\u0027s plans, meeting notes and key emails as references, then asks for open risks and who owns each."},{"title":"Tender response prep","text":"A bid writer adds the tender documents and past proposals, then asks Copilot to list requirements, spot gaps and draft first answers."},{"title":"Audio briefing","text":"A policy officer adds the new regulations as references and plays the audio overview to grasp the key points before briefing her director."}],"prompt":"Using only the references in this notebook, summarise the five biggest risks to the Q4 launch, say which source each comes from, and list who owns the mitigation for each.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-microsoft-365-copilot-notebooks","learnLabel":"Microsoft Support: Copilot Notebooks","related":["copilot-pages"]},{"id":"copilot-pages","name":"Copilot Pages","aliases":["Pages","Copilot Page","Microsoft 365 Copilot Pages"],"difficulty":"Medium","category":"Copilot Chat","tags":["collaboration","creation"],"packs":["core","wave-2"],"introduced":"2024-09","hints":["I collect ideas, but I\u0027m not OneNote.","I help preserve AI-generated work.","Conversations can become collaborative artefacts.","I turn chat responses into something your team can edit.","My name suggests somewhere information can live."],"description":"A shareable, editable canvas beside Copilot Chat where you pin the best bits of an AI answer, keep refining them and co-edit with colleagues in real time. It can hold tables and charts, and convert to Word, PowerPoint or PDF.","why":"Good AI answers stop vanishing into chat history. Pages turns them into living documents your whole team can build on.","useCases":[{"title":"Kick-off brief","text":"Pin Copilot\u0027s draft project brief to a Page, then invite the team to refine scope and owners together."},{"title":"Vendor comparison","text":"Ask Copilot to compare shortlisted suppliers on cost, support and risk, then keep the table on a Page where procurement and finance can edit it together."},{"title":"Meeting follow-up","text":"A team lead turns action items from a meeting summary into a shared Page the whole team can update."}],"prompt":"Create a page that compares the three vendors we shortlisted last week on cost, support and security, with a simple table and a short recommendation the team can edit.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-microsoft-365-copilot-pages","learnLabel":"Microsoft Support: Copilot Pages","related":["copilot-notebooks"]},{"id":"copilot-prompt-gallery","name":"Prompt Gallery","aliases":["Copilot Prompt Gallery","Copilot Lab","Prompt library","Saved prompts"],"difficulty":"Easy","category":"Copilot Chat","tags":["prompting","learning","essentials"],"packs":["core"],"hints":["I\u0027m a cookbook, not a kitchen.","I offer ready-made starting points, with tips for making each one your own.","Hover over one of my entries to save it, share it with a team or schedule it.","You\u0027ll find me in Copilot Chat, with side doors in Teams and Outlook.","Picture an art gallery, but the exhibits are things you ask Copilot."],"description":"A built-in library of ready-made prompts from Microsoft, your team and your own saved favourites, with tips for tailoring each one. Try one, then save it, share it to a Teams team or schedule it.","why":"Nobody has to invent the perfect request from scratch. Borrow what works, keep your own favourites and share the best ones so the whole team benefits.","useCases":[{"title":"Reusable weekly update","text":"A project manager tweaks a Suggested prompt into a weekly status update and saves it to reuse every Friday."},{"title":"Share the winner","text":"A sales lead shares their best follow-up email prompt to the sales team in Teams, so everyone starts from the same proven wording."},{"title":"Company-wide starters","text":"An IT admin publishes organisational prompts for common onboarding questions, so everyone in the company sees them."}],"prompt":"Draft a weekly status update on our website relaunch for the leadership team, using my emails and meetings from this week. Keep it to five bullets: progress, risks, decisions needed and next steps. Use a plain, confident tone.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-prompt-gallery","learnLabel":"Microsoft Learn: Copilot Prompt Gallery","related":["copilot-memory"]},{"id":"copilot-search","name":"Copilot Search","aliases":["Microsoft Copilot Search","Microsoft 365 Copilot Search","M365 Copilot Search","Search"],"difficulty":"Medium","category":"Copilot Chat","tags":["search","knowledge"],"packs":["core","wave-2"],"introduced":"2025-04","hints":["Microsoft calls me the \u0027organising layer\u0027; my sibling is where the work gets done.","Type plain words or keywords and I\u0027ll look through emails, files, chats, meetings and connected third-party sources.","For some questions I put a short AI answer on top, then offer to carry on in conversation.","I\u0027m a dedicated tab in the Copilot app\u0027s left navigation, not a separate app.","The docs call me an AI-powered, universal search experience for your organisation."],"description":"An AI-powered universal search tab in the Copilot app: ask in plain words or keywords and it finds emails, files, chats, meetings and connected third-party content, sometimes with a short Copilot Answer on top. Formerly Microsoft 365 Copilot Search.","why":"Work lives in inboxes, chat threads, files and other apps. One search across all of them, sometimes with a quick AI answer on top, means less time hunting and more time doing.","useCases":[{"title":"Find that proposal","text":"A sales rep searches for \u0027Contoso renewal\u0027 and finds the email thread, the proposal file and the Teams chat in one results page."},{"title":"Decode company jargon","text":"A new starter searches for an unfamiliar acronym and can get an admin-curated answer, instead of asking around the team."},{"title":"Search beyond Microsoft 365","text":"A support lead searches once across SharePoint files and a connected third-party knowledge base, then continues in Chat to draft a reply."}],"prompt":"Where is the latest version of the Fabrikam renewal proposal, and who emailed or messaged about pricing changes in the last month?","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-search-overview","learnLabel":"Microsoft Learn: Copilot Search","related":["copilot-chat"]},{"id":"copilot-success-kit","name":"Copilot Success Kit","aliases":["Microsoft Copilot Success Kit","Microsoft 365 Copilot Success Kit","Success Kit"],"difficulty":"Hard","category":"Adoption \u0026 Learning","tags":["adoption","learning"],"packs":["core"],"hints":["I\u0027m a bundle, not a button: nothing to switch on, plenty to download.","I help organisations roll out AI at work, with separate guides for leaders, IT and user enablement.","Inside me you\u0027ll find a planning checklist, a licence allocation guide, worksheets and even digital swag.","I live on Microsoft\u0027s Adoption site, and I have two siblings: one for chat, one for agents.","My name promises a good outcome, and I come as a kit for rolling out Copilot."],"description":"Microsoft\u0027s free, downloadable rollout resources for Copilot: leader, user-enablement and technical-readiness guides, plus checklists, worksheets and digital swag. Download the parts your role needs to roll Copilot out across your organisation.","why":"A good rollout needs more than licences: leaders, IT and trainers all need to pull the same way. The kit gives each group guides and checklists, so nobody starts from a blank page.","useCases":[{"title":"IT readiness planning","text":"An IT lead at a council works through the Technical Readiness Guide, then uses the licence allocation guide to decide who gets Copilot first."},{"title":"User enablement kick-off","text":"A retail learning manager sends the ready-to-send onboarding emails and runs a Prompt-a-thon from the engagement tools, so store managers start trying Copilot."},{"title":"Executive sponsor briefing","text":"A hospital\u0027s chief operating officer reads the Implementation Summary Guide for Leaders to understand what a Copilot rollout involves before backing the programme."}],"prompt":"I\u0027m rolling out Copilot to about 400 staff. Using Microsoft\u0027s Copilot Success Kit as a guide, outline what leaders, IT and user enablement each need to do in the first 30 days, then draft a short onboarding email.","learnMore":"https://adoption.microsoft.com/en-us/copilot/success-kit/","learnLabel":"Microsoft Adoption: Copilot Success Kit","related":["champion-community","copilot-academy","copilot-prompt-gallery"]},{"id":"copilot-usage-reports","name":"Copilot Usage Reports","aliases":["Copilot usage report","Copilot adoption report","Microsoft Copilot usage report","Microsoft 365 Copilot usage report","Copilot Chat usage report"],"difficulty":"Hard","category":"Security \u0026 Admin","tags":["analytics","admin","adoption"],"packs":["core"],"hints":["I\u0027m the scoreboard, not the game: I only count who\u0027s playing with AI at work.","Admins visit me to learn who\u0027s picked AI up, who keeps coming back and in which apps.","I come as a pair: one for licensed Copilot users, one for Chat users without a licence.","I live in the Microsoft 365 admin center; the richer Copilot Dashboard lives over in Viva Insights.","I tally active people, prompts and trends for Copilot; \u0027usage\u0027 is my middle name."],"description":"Two reports in the Microsoft 365 admin center that show how people adopt Copilot: one for licensed users, one for Copilot Chat use by people without a licence. Pick a timeframe from a week to roughly six months and compare trends.","why":"Rolling out Copilot is only half the job. These reports show admins who\u0027s actually trying it and in which apps, so they can spot gaps and decide where to encourage people next.","useCases":[{"title":"Licence value check","text":"A hospital IT admin checks the active users rate for licensed staff over recent weeks, then plans extra training if few people are trying Copilot."},{"title":"Launch momentum tracking","text":"A retailer\u0027s change manager runs a Copilot awareness month, then uses the trend view to see whether daily activity rises across apps."},{"title":"Chat-only rollout check","text":"A council\u0027s digital team checks how many unlicensed staff use Copilot Chat, then follows the recommendation card\u0027s tip to pin Copilot in apps like Teams and Outlook."}],"prompt":"Help me plan a monthly Copilot adoption review. Walk me through which numbers to look at in the Microsoft 365 admin center\u0027s Copilot and Copilot Chat usage reports (enabled users, active users, prompts), and what actions to take if adoption is low.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/microsoft-365-copilot-usage?view=o365-worldwide","learnLabel":"Microsoft Learn: Copilot usage report","related":["copilot-dashboard","purview-for-copilot"]},{"id":"copilot-without-transcript","name":"Copilot Without a Transcript","aliases":["Copilot without transcript","Only during the meeting","Meetings without transcripts","Copilot-only mode","Copilot without transcribing or recording"],"difficulty":"Hard","category":"Teams \u0026 Meetings","tags":["meetings","teams","privacy"],"packs":["core"],"hints":["I\u0027m built for hush-hush talks where nobody wants a word-for-word record.","I still let people ask the AI for notes and tasks, using live speech-to-text.","I wait for a volunteer to switch me on, and then I can\u0027t be switched off.","Organisers find me in a meeting\u0027s Options, under \u0027Copilot and other AI\u0027.","Copilot is on hand in the meeting controls, but no transcript starts automatically."],"description":"Lets Copilot work live in a Teams meeting or call without turning on transcription or recording. The organiser picks \u0027Only during the meeting\u0027 (calls need an admin-enabled Copilot-only mode), then participants start Copilot from the controls for notes and tasks.","why":"Confidential discussions don\u0027t have to go without AI help. You can still get live notes and tasks without a transcript or recording being started.","useCases":[{"title":"Confidential HR meeting","text":"An HR partner sets the meeting to \u0027Only during the meeting\u0027, then starts Copilot for notes and tasks on a sensitive case without a transcript or recording."},{"title":"Contract strategy huddle","text":"Finance leads choose \u0027Only during the meeting\u0027 for an internal contract-strategy huddle, so Copilot can list tasks live while nothing is transcribed automatically."},{"title":"Clinical incident review","text":"A hospital quality team reviewing an incident starts Copilot partway through to capture notes and tasks, without a transcript or recording being started."}],"prompt":"Give me a short list of the key points and action items from this meeting so far, with an owner next to each one.","learnMore":"https://support.microsoft.com/en-us/teams/copilot/use-copilot-without-transcribing-or-recording-a-teams-meeting-or-call","learnLabel":"Microsoft Support: Copilot without transcribing or recording","related":["copilot-in-teams-phone"]},{"id":"m365-agents-sdk","name":"Agents SDK","aliases":["Microsoft 365 Agents SDK","M365 Agents SDK","Microsoft Agents SDK"],"difficulty":"Expert","category":"Studio \u0026 Extensibility","tags":["developers","agents","extensibility"],"packs":["core","build"],"introduced":"2024-11","daily":false,"hints":["I\u0027m plumbing, not a brain: not an AI model, not an orchestrator, not a no-code builder.","Coders use me to build conversational assistants, with whichever AI service they prefer.","I turn every incoming message into an \u0027Activity\u0027 and handle conversations one \u0027turn\u0027 at a time.","One codebase can reach Teams, websites, Slack and Facebook Messenger through me.","I\u0027m the SDK Microsoft pitched as \u0027the evolution of the Bot Framework\u0027, for C#, JavaScript and Python."],"description":"A code-first framework for building conversational agents in C#, JavaScript or Python. It handles channels, state and authentication, so one agent can serve Teams, Microsoft Copilot or a website, using any AI service you choose.","why":"Build a conversational assistant once and reach people in Teams, on a website or inside Microsoft 365 Copilot, using the AI service you prefer, instead of rebuilding it for every channel.","useCases":[{"title":"HR policy assistant","text":"An HR developer builds one policy-answering assistant on the company\u0027s chosen AI service and publishes it to Teams and the intranet website from the same code."},{"title":"Support bot across channels","text":"A retailer\u0027s developers build one support assistant and serve it on the website, in Slack and in Teams, keeping conversation state in the SDK\u0027s built-in storage."},{"title":"Custom engine for Copilot","text":"A hospital IT team connects its approved AI service to an assistant for staff questions, then surfaces it inside Microsoft 365 Copilot as a custom engine agent."}],"prompt":"I\u0027m a C# developer. Outline how I\u0027d use the Microsoft 365 Agents SDK to build an agent that answers HR policy questions in Teams and on our intranet, using our own AI service. Include channels, state and authentication.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/agents-sdk/agents-sdk-overview","learnLabel":"Microsoft Learn: Microsoft 365 Agents SDK","related":["agent-365","m365-copilot-apis"]},{"id":"m365-copilot-apis","name":"Copilot APIs","aliases":["Microsoft 365 Copilot APIs","M365 Copilot APIs","Copilot API","Microsoft 365 Copilot API"],"difficulty":"Expert","category":"Studio \u0026 Extensibility","tags":["developers","extensibility","data"],"packs":["core","build"],"introduced":"2025-05","daily":false,"hints":["No button, no chat window: other people\u0027s software simply calls me.","I let builders use retrieval, chat and meeting smarts inside their own apps.","One of my siblings returns relevant text chunks for grounding, never a generated answer.","I sit on Microsoft Graph, and callers only get content they could already open themselves.","Announced at Build 2025, I\u0027m the family of Graph endpoints that lets your apps tap Copilot\u0027s own capabilities."],"description":"A family of Microsoft Graph-based APIs that lets your own apps and custom engine agents use Copilot capabilities, like grounded retrieval, chat, search and meeting insights, while respecting existing permissions and keeping data inside the Microsoft 365 service boundary.","why":"Teams can build tools that answer using company content people are already allowed to see, without copying data out of Microsoft 365. Some of the APIs are still in preview.","useCases":[{"title":"Grounded policy answers","text":"A public-sector developer grounds a staff helper in SharePoint policies via the Retrieval API, so answers only use content each employee may already access."},{"title":"Compliance review of interactions","text":"A compliance team uses the Interaction Export API (preview) to bring Copilot interactions into its own review tooling for oversight."},{"title":"Usage dashboard for leadership","text":"An IT admin pulls Copilot usage reports through Microsoft Graph into a custom dashboard, so executives can track how adoption is progressing."}],"prompt":"I\u0027m a developer planning to ground our internal HR assistant in SharePoint content. Explain how the Microsoft 365 Copilot Retrieval API works, which Graph permissions I\u0027d need, and how permission trimming keeps answers limited to what each user can already access.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/copilot-apis-overview","learnLabel":"Microsoft Learn: Copilot APIs overview","related":["work-iq","m365-agents-sdk"]},{"id":"agent-365","name":"Agent 365","aliases":["Microsoft Agent 365","Agent365","Agent 365 control plane"],"difficulty":"Hard","category":"Security \u0026 Admin","tags":["governance","security","agents","admin"],"packs":["core"],"introduced":"2025-11","hints":["I\u0027m not an AI assistant; I\u0027m the supervisor who keeps an eye on all of them.","IT and security teams use me to see, govern and secure AI helpers across the organisation.","I keep one central registry of them, and I can quarantine any that nobody sanctioned.","Copilot is about what AI can do; I\u0027m about controlling what AI is allowed to do.","Ignite 2025 unveiled me as Microsoft\u0027s \u0027control plane for AI agents\u0027."],"description":"Microsoft\u0027s control plane for AI agents: a central registry of the agents in your organisation, however they were built, plus identity, observability, security and compliance controls through Entra, Defender and Purview.","why":"AI agents are multiplying fast. It gives IT one place to see them, control what they can access and respond to risks, so teams can adopt agents without losing oversight.","useCases":[{"title":"Quarantine unsanctioned agents","text":"An IT admin reviews the registry, spots an AI agent nobody approved and quarantines it."},{"title":"Single source of truth","text":"A bank\u0027s risk team uses the registry as one source of truth for its AI agents, whether built on Microsoft platforms, open-source frameworks or partner clouds."},{"title":"Onboard a Studio-built agent","text":"A maker finishes an agent in Copilot Studio and onboards it to Agent 365, so IT can govern it alongside agents built elsewhere."}],"prompt":"I\u0027m an IT admin. Help me plan a rollout of Agent 365 for our organisation: how to use the agent registry, which Entra, Defender and Purview integrations matter, and what policies to set before teams start building more agents.","learnMore":"https://learn.microsoft.com/en-us/microsoft-agent-365/overview","learnLabel":"Microsoft Learn: Agent 365 overview","related":["entra-agent-id","m365-agents-sdk"]},{"id":"entra-agent-id","name":"Entra Agent ID","aliases":["Microsoft Entra Agent ID","Agent ID","Agent identity"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["security","governance","agents","developers"],"packs":["core","build"],"introduced":"2025-05","hints":["Staff carry badges to get through the door. I\u0027m the badge office for their AI colleagues.","Protections built for people, like Conditional Access and audit logs, now reach AI workers too.","My identities are children of blueprints, so one template keeps policies consistent across a whole fleet.","Make a new assistant in Copilot Studio and one of me is created for it automatically.","Announced at Build 2025: an Entra framework giving AI colleagues their own governed identities."],"description":"An identity and security framework in Microsoft Entra that gives AI agents their own governed identities. Agent identities are created from reusable blueprints and can authenticate with standard protocols such as OAuth 2.0, MCP and A2A, on Microsoft or non-Microsoft platforms.","why":"AI agents acting in your systems need an accountable identity, like staff do. Every agent identity can have a human sponsor, and Entra\u0027s access and audit controls can be extended to it with Agent 365.","useCases":[{"title":"Blueprint once, govern many","text":"An identity admin defines one blueprint so every agent identity created from it gets consistent security policies across the whole fleet."},{"title":"Sponsor leaves, ownership moves","text":"A hospital\u0027s governance lead relies on a Lifecycle Workflow to transfer sponsorship automatically when an agent\u0027s sponsor leaves, so no agent identity is left unowned."},{"title":"Bring a third-party agent","text":"A developer integrates an n8n or AWS Bedrock agent using the Entra ID Auth SDK sidecar or workload identity federation, so it gets a governed identity too."}],"prompt":"I\u0027m an identity architect. Explain how Microsoft Entra Agent ID uses agent identity blueprints, sponsors and Conditional Access to govern AI agents, and draft a checklist for onboarding our Copilot Studio agents and a third-party agent to it.","learnMore":"https://learn.microsoft.com/en-us/entra/agent-id/what-is-microsoft-entra-agent-id","learnLabel":"Microsoft Learn: What is Microsoft Entra Agent ID?","related":["agent-365"]},{"id":"work-iq","name":"Work IQ","aliases":["WorkIQ","Microsoft Work IQ","Work IQ APIs"],"difficulty":"Hard","category":"Studio \u0026 Extensibility","tags":["extensibility","agents","data","developers"],"packs":["core","build"],"introduced":"2026-06","daily":false,"hints":["I sound like a test result, but I\u0027m not a score; I\u0027m a layer.","I let AI helpers reason over organisational data, context and tools, always respecting permissions.","My MCP server collapses hundreds of operations into just ten generic tools.","Microsoft 365 Copilot is powered by me, and developers can now call me from their own agents.","Alongside Fabric IQ, Foundry IQ and Web IQ, I\u0027m the family member focused on the workplace."],"description":"Microsoft\u0027s workplace intelligence layer, which continuously builds a semantic understanding across Microsoft 365 and external systems. It powers Microsoft 365 Copilot, and developers can call it from their own agents through A2A, a remote MCP server or a REST API.","why":"Your own AI helpers can draw on the same workplace understanding that powers Microsoft 365 Copilot, without each team building its own data pipeline, and a policy engine checks every request.","useCases":[{"title":"Sales prep without plumbing","text":"A sales team\u0027s custom agent pulls context from mail, meetings, chats and files through Work IQ, with no retrieval pipeline to build."},{"title":"Auditable internal assistant","text":"An IT team builds an internal assistant on the Work IQ MCP server; a policy engine checks every request and every tool call is logged."},{"title":"Working storage for long tasks","text":"A consultancy\u0027s research agent keeps its working files in a Work IQ workspace (SharePoint Embedded), giving a long-running task proper working storage."}],"prompt":"I\u0027m building a custom AI helper for our sales team. Explain how Work IQ fits in: its chat, context, tools and workspaces building blocks, how it differs from Microsoft Graph and the Retrieval API, and what governance and billing questions I should raise with IT first.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/work-iq/","learnLabel":"Microsoft Learn: Work IQ
