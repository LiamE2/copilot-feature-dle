bank limits its deal-team site to one Microsoft 365 group, so colleagues with stray permissions can\u0027t open it or see its files in Copilot."}],"prompt":"I manage SharePoint for a law firm. Explain how Restricted Access Control works, then give me a step-by-step plan to enable it for the organisation and apply it to one client-matter site, including which groups to use and how delegation to site admins works.","learnMore":"https://learn.microsoft.com/en-us/sharepoint/restricted-access-control","learnLabel":"Microsoft Learn: Restricted Access Control","related":["restricted-content-discovery","restricted-sharepoint-search"]},{"id":"restricted-content-discovery","name":"Restricted Content Discovery","aliases":["RCD","Restrict content from Microsoft Copilot","Restrict discovery of SharePoint sites and content","Restricted content discoverability"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["security","governance","admin","search"],"packs":["core"],"hints":["I draw the curtains, but I never change who holds the keys.","I\u0027m a temporary measure that keeps risky sites out of Copilot answers while permissions get reviewed.","On sites I cover, the Copilot button and \u0027Create pages with AI\u0027 disappear.","On a site\u0027s Settings tab, my toggle\u0027s label mentions Microsoft Copilot, not my own name.","Admins flip me on, site by site, to curb discovery in organisation-wide search and Copilot answers."],"description":"A SharePoint Advanced Management setting that hides a site\u0027s content from organisation-wide search and Microsoft Copilot responses, and removes AI entry points on that site. Permissions don\u0027t change, so people with access can still open files directly.","why":"Oversharing worries shouldn\u0027t stall your Copilot rollout. Admins can pull risky sites out of Copilot answers while owners review permissions, and nobody loses access to their files.","useCases":[{"title":"Pause Finance and HR sites","text":"Before a Copilot rollout, an IT admin restricts the Finance and HR sites so Copilot and organisation-wide search skip them while owners review permissions."},{"title":"Phased Copilot rollout","text":"A university IT team rolls Copilot out in phases, restricting sites it hasn\u0027t reviewed yet so staff don\u0027t see their files surface in Copilot answers."},{"title":"Delegated site admin","text":"Once IT delegates the setting, a council department\u0027s site admin restricts their own site and must give a justification when they change it."}],"prompt":"I\u0027m a SharePoint admin preparing a phased Copilot rollout. Draft a plan for using Restricted Content Discovery on our Finance and HR sites: what it hides, what stays the same for people with access, and how I\u0027d report on which sites have it turned on.","learnMore":"https://learn.microsoft.com/en-us/sharepoint/restricted-content-discovery","learnLabel":"Microsoft Learn: Restricted Content Discovery","related":["restricted-access-control","restricted-sharepoint-search"]},{"id":"restricted-sharepoint-search","name":"Restricted SharePoint Search","aliases":["RSS","Restricted SharePoint Search allow list","Restricted search"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["governance","admin","search"],"packs":["core"],"daily":false,"hints":["I was more of a \u0027please use this entrance\u0027 sign than a locked door.","I was a short-term fix, meant only to buy admins time to audit site permissions.","My list topped out at 100 sites; a hub site counted as just one.","Microsoft has announced my retirement and pointed admins to a per-site setting instead.","I was the tenant setting that scoped organisation-wide search and Copilot to an allow list of chosen sites."],"description":"A short-term tenant setting that limited organisation-wide search and Copilot to an allow list of up to 100 SharePoint sites. Microsoft has announced its retirement: new enablement has been blocked since 31 July 2026, and Restricted Content Discovery is the recommended alternative.","why":"It was a stopgap for pointing Copilot at reviewed sites, never a security lock, and Microsoft says its 100-site cap doesn\u0027t scale. Knowing that helps you choose the right controls today.","useCases":[{"title":"Stopgap during permission audit","text":"A manufacturer\u0027s admin allow-listed its reviewed sites, so Copilot and organisation-wide search mostly drew on vetted sites while the remaining permissions were audited."},{"title":"Planning the replacement","text":"An IT lead whose tenant already uses the allow list plans a switch to site-level Restricted Content Discovery for the sites that need hiding."},{"title":"Briefing leadership on limits","text":"A consultant explains to a council\u0027s leadership why recently accessed sites, and sites shared in Teams or Outlook, could still appear despite the allow list."}],"prompt":"Our tenant already has a Restricted SharePoint Search allow list. Explain why Microsoft announced its retirement and what it never guaranteed, then draft a plan to move to Restricted Content Discovery for our sensitive sites, including how I\u0027d review what\u0027s on the list today.","learnMore":"https://learn.microsoft.com/en-us/sharepoint/restricted-sharepoint-search","learnLabel":"Microsoft Learn: Restricted SharePoint Search","related":["restricted-content-discovery","restricted-access-control"]},{"id":"scenario-library","name":"Scenario Library","aliases":["Copilot Scenario Library","Microsoft Scenario Library"],"difficulty":"Hard","category":"Adoption \u0026 Learning","tags":["adoption","learning","prompting"],"packs":["core"],"daily":false,"hints":["I\u0027m a menu of \u0027what could AI do for us?\u0027 ideas, not a tool you switch on.","Teams unsure where to start with AI come to me to find their own corner of the business.","I\u0027m sorted two ways: by what your team does, and by the industry you work in.","I live on Microsoft\u0027s Adoption site; my old name wore a Copilot badge, but I\u0027m no longer Copilot-only.","My downloads include scenario kits and day-in-the-life guides, and my name suggests a bookshelf."],"description":"The Microsoft Scenario Library, formerly the Copilot Scenario Library, is a Microsoft Adoption website that organises AI scenarios by business function and industry, with downloadable scenario kits, scenario guides and day-in-the-life guides. Anyone can browse it, no licence needed.","why":"Starting with AI is easier when you can see what it could do in your own role or industry. The library turns \u0027where do we begin?\u0027 into ideas and guides you can download.","useCases":[{"title":"Find HR quick wins","text":"An HR lead opens the Human Resources function, browses the AI scenarios and downloads a scenario guide to pick two quick wins for their team."},{"title":"Brief the board","text":"A nonprofit\u0027s fundraising manager browses Nonprofit scenarios and picks a day-in-the-life guide to show the board what practical AI help looks like."},{"title":"Plan a team workshop","text":"An adoption champion filters to Agents scenarios, then downloads a functional scenario kit to run a workshop for the finance team."}],"prompt":"I lead finance operations at a mid-size manufacturer and we\u0027re new to AI. Using Microsoft\u0027s Scenario Library as inspiration, suggest five Copilot scenarios for my team, what each would save us, and which one to pilot first.","learnMore":"https://adoption.microsoft.com/en-us/scenario-library/","learnLabel":"Microsoft Adoption: Scenario Library","related":["copilot-success-kit","copilot-prompt-gallery"]},{"id":"semantic-index","name":"Semantic Index","aliases":["Semantic Index for Copilot","Semantic indexing","Semantic indexing for Microsoft Copilot","Microsoft Graph semantic index"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["knowledge","search","admin"],"packs":["core"],"hints":["No admin switches me on, and no admin can switch me off.","I help Copilot find conceptually related content, even when your exact words don\u0027t appear in it.","Hand me the word \u0027praise\u0027 and I\u0027ll widen it to elated, excited and amazed.","My organisation-wide version is generated from text-based SharePoint Online files.","I\u0027m the \u0027semantic\u0027 counterpart to Microsoft Graph\u0027s lexical, keyword-based matching."],"description":"A vector-based index that sits alongside Microsoft Graph\u0027s keyword (lexical) index, helping Copilot find conceptually related content across your organisation. It understands synonyms and intent, only surfaces what a user can already access, and Microsoft switches it on automatically.","why":"Searching by meaning means Copilot can find the right file even when you don\u0027t remember its exact words. Because it only shows content you can already open, better answers don\u0027t mean looser access.","useCases":[{"title":"Same idea, different words","text":"A marketing manager asks Copilot for USA launch plans and also gets documents saying \u0027United States\u0027 or \u0027U.S.A\u0027, provided she can open them."},{"title":"Keep a site out","text":"An IT admin sets a confidential SharePoint site to not appear in search results, which also removes it from the semantic index."},{"title":"Searching a contracts library","text":"A paralegal attaches a SharePoint contracts library in Copilot on the web; its column metadata gives Copilot extra signals for finding the right documents."}],"prompt":"I\u0027m a Microsoft 365 admin. Explain how semantic indexing helps Copilot find relevant files, what I can and can\u0027t control (like the SharePoint \u0027Allow this site to appear in search results\u0027 setting), and how permissions limit what each user sees.","learnMore":"https://learn.microsoft.com/en-us/microsoftsearch/semantic-index-for-copilot","learnLabel":"Microsoft Learn: Semantic indexing for Microsoft Copilot"},{"id":"sharepoint-advanced-management","name":"SharePoint Advanced Management","aliases":["SAM","SharePoint Advanced Management for Copilot","SharePoint Advanced Management Plan 1","SharePoint Advanced Management standalone"],"difficulty":"Hard","category":"Security \u0026 Admin","tags":["admin","governance","security","files"],"packs":["core"],"hints":["I\u0027m a caretaker\u0027s keyring: lots of keys, one job, keeping the whole estate in order.","I help admins keep things tidy and tightly governed, so Copilot draws on the right content.","My tools tackle three worries: sprawl, lifecycle and oversharing, with inactive sites included.","Restricted access control and restricted content discovery both shelter under me; I\u0027m the umbrella.","Say my acronym aloud and you get a friendly first name; \u0027Advanced\u0027 is in my full name."],"description":"A bundle of SharePoint admin center governance tools for taming content sprawl, managing the content lifecycle and preventing oversharing. It helps admins keep sites tidy and tightly governed so Copilot draws on the right content.","why":"Employees get Copilot answers from the right content, with less chance of stumbling over files that were never meant for them. IT gets one toolkit to tidy and tighten sites.","useCases":[{"title":"Copilot rollout prep","text":"A state government IT team works through the oversharing tools and tidies stale sites before switching Copilot on for thousands of staff."},{"title":"Tackle abandoned sites","text":"A university IT team applies an inactive sites policy to abandoned course and project sites so staff and Copilot aren\u0027t wading through stale content."},{"title":"Spot and fix oversharing","text":"A healthcare IT lead spots a clinic site shared with all internal users in a governance report, then sends its owners a site access review."}],"prompt":"I\u0027m a SharePoint admin preparing for a Microsoft 365 Copilot rollout. Using SharePoint Advanced Management, draft a phased plan covering content sprawl, content lifecycle and oversharing, naming the SharePoint admin center area to visit for each step and who should own it.","learnMore":"https://learn.microsoft.com/en-us/sharepoint/advanced-management","learnLabel":"Microsoft Learn: SharePoint Advanced Management","related":["data-access-governance-reports","site-access-review"]},{"id":"site-access-review","name":"Site Access Review","aliases":["Site access reviews","SharePoint site access review","Initiate site access review","Data access governance site access review"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["security","governance","admin","files"],"packs":["core"],"hints":["I\u0027m IT handing the clipboard to whoever actually knows what\u0027s in each room.","I exist because compliance reasons stop IT admins seeing file-level detail inside a site.","I send each site\u0027s owner an email tailored to the problem, in words the admin can tweak.","I\u0027m not Entra\u0027s group-and-app checkup: I start inside a report about overshared sites.","In the SharePoint admin center, admins follow my progress on a tab called \u0027My review requests\u0027."],"description":"Lets admins hand an oversharing check to the owners of the affected SharePoint sites. From a data access governance report, an admin selects sites and sends each owner a tailored email; owners then review and update access themselves.","why":"Compliance reasons stop IT seeing file-level detail, but site owners know their own content. Asking owners to check and tighten sharing puts the fix with the people best placed to make it.","useCases":[{"title":"Anyone links clean-up","text":"A retail IT admin spots a campaign site with many Anyone links and emails its owner a tailored request to tidy up sharing."},{"title":"Tighten internal-wide sharing","text":"A school\u0027s IT coordinator picks staff sites shared with \u0027Everyone except external users\u0027 and asks each owner to check who really needs access."},{"title":"Customised owner guidance","text":"A consulting firm\u0027s admin starts from the oversharing baseline report and sends client-site owners a customised message linking to a SharePoint page of sharing guidance."}],"prompt":"I\u0027m a SharePoint admin starting site access reviews from a data access governance report because several sites are shared with \u0027Everyone except external users\u0027. Draft the email to site owners: why IT can\u0027t check their files, what to review, and a clear deadline.","learnMore":"https://learn.microsoft.com/en-us/sharepoint/site-access-review","learnLabel":"Microsoft Learn: Site access review","related":["data-access-governance-reports","sharepoint-advanced-management"]},{"id":"teams-meeting-recap","name":"Teams Meeting Recap","aliases":["Meeting Recap","Recap in Teams","Recap tab","Teams event recap","Recap in Microsoft Teams"],"difficulty":"Easy","category":"Teams \u0026 Meetings","tags":["meetings","teams","email","essentials"],"packs":["core"],"hints":["I\u0027m the goodie bag at the end of the party, not the party itself.","I let absentees catch up without juggling a pile of different apps.","Recording, transcript, shared files, agenda and follow-up tasks all end up together inside me.","I\u0027m the box, not the brains: AI notes are just one thing I can hold.","Click \u0027View recap\u0027 on an event\u0027s thumbnail and I open."],"description":"The tab that appears in a Teams event\u0027s chat and calendar details once it has been recorded or transcribed. It gathers the recording, transcript, shared files, notes, agenda and follow-up tasks in one place, plus an AI summary where your licence includes it.","why":"Missed the meeting, or can\u0027t remember what was agreed? Everything from the event sits in one place, so you can catch up quickly and find the bit that matters without chasing files or people.","useCases":[{"title":"Back from leave","text":"A project manager back from leave opens last week\u0027s recap to watch the recording, skim the notes and open shared files, rather than asking for a rundown."},{"title":"Town hall catch-up","text":"A retail store manager who missed the live town hall opens its recap later, watching the recording and reading the transcript for the roster announcement."},{"title":"Email the summary","text":"After a customer workshop, a sales lead shares the AI summary to email from the recap, edits the drafted Outlook message and sends it to the team."}],"prompt":"I missed Tuesday\u0027s project review. Using its transcript and notes, list the decisions made, the follow-up tasks and who owns them, and flag anything that affects my team\u0027s deadlines.","learnMore":"https://support.microsoft.com/en-us/teams/meetings/recap-in-microsoft-teams","learnLabel":"Microsoft Support: Recap in Microsoft Teams","related":["intelligent-recap","copilot-in-teams-meetings"]},{"id":"teams-phone-agent","name":"Teams Phone Agent","aliases":["Teams Phone Agents","Phone Agent","Microsoft Teams Phone Agent","AI auto attendant"],"difficulty":"Hard","category":"Teams \u0026 Meetings","tags":["teams","agents","voice","admin"],"packs":["core"],"introduced":"2026-06","hints":["I\u0027m what you get when \u0027press 1 for sales\u0027 becomes an actual conversation.","I screen callers, answer common questions and book appointments, then route people where they need to go.","Unless an admin changes it, I introduce myself to callers as a virtual assistant.","I answer calls made to a resource account, not to one person\u0027s own line.","I\u0027m the phone-answering AI that lives where auto attendants live: Voice, in the Teams admin center."],"description":"An AI-driven extension of Teams auto attendants that answers incoming calls to a resource account in human-like conversation. It screens callers, answers questions from approved sources, books appointments and routes calls to people, queues or Copilot Studio agents, without fixed menus.","why":"Callers talk naturally instead of pressing through menus, and routine questions and bookings are handled without tying up staff, so people can focus on the calls that need them.","useCases":[{"title":"Clinic bookings","text":"A clinic lets the agent answer opening-hours questions, book appointments through Microsoft Bookings and route anyone who needs a person to the front desk."},{"title":"Order status calls","text":"A retailer\u0027s support line hands callers asking about their orders to a Copilot Studio agent that checks order status, leaving staff free for trickier requests."},{"title":"Council enquiries","text":"A council\u0027s customer-service line lets the agent answer rates and bin-collection questions from approved web pages and route complex queries to the right call queue."}],"prompt":"I\u0027m a Teams admin setting up a Teams Phone Agent for our front desk. List what I need before I start (resource account, licences, greeting, Q\u0026A sources) and draft a friendly greeting plus five common questions it should answer.","learnMore":"https://learn.microsoft.com/en-us/microsoftteams/aa-cq-setup-teams-phone-agent","learnLabel":"Microsoft Learn: Teams Phone Agent","related":["intelligent-call-delegation","copilot-in-teams-phone"]},{"id":"teams-rooms-intelligent-speaker","name":"Copilot in Teams Rooms","aliases":["Intelligent Speaker","Teams Rooms Copilot","AI in Teams Rooms","Speaker recognition","Speaker attribution"],"difficulty":"Hard","category":"Teams \u0026 Meetings","tags":["meetings","teams","voice"],"packs":["core"],"daily":false,"hints":["I put names to voices, and faces too, but only for people who opt in.","Thanks to me, meeting summaries and recaps can credit comments to the right person.","Switch me on under Settings, then Recognition; I typically learn your voice within a couple of meetings.","I\u0027m easy to confuse with a recap\u0027s after-the-fact timeline, but I identify people live.","I\u0027m what lets Teams Rooms devices tell a transcript who\u0027s who."],"description":"The AI side of Teams Rooms devices, centred on Intelligent Speaker. It uses opt-in voice and face profiles to identify who in the room is talking, so transcripts, recaps and Copilot can name who said what.","why":"When people meet together around one device, knowing who said what makes summaries and recaps more useful. Comments can be credited to the right person by name.","useCases":[{"title":"Weekly sales meeting","text":"After staff opt in under Recognition, a weekly sales meeting\u0027s transcript can name who spoke in the room, so follow-ups trace back to who said what."},{"title":"Admin rollout checklist","text":"An IT admin assigns a Teams Rooms Pro licence to the room\u0027s resource account and manages voice and face enrolment with the CsTeamsAIPolicy PowerShell policy."},{"title":"Answering profile privacy questions","text":"A council privacy officer notes Microsoft says voice and face profiles aren\u0027t used to train models and are removed on unenrol, or after a year unused."}],"prompt":"I manage Teams Rooms devices. Draft a rollout checklist for Intelligent Speaker: what licence each room\u0027s resource account needs, how users opt in under Recognition, and what the CsTeamsAIPolicy settings control.","learnMore":"https://learn.microsoft.com/en-us/microsoftteams/rooms/copilot-admin-mtr","learnLabel":"Microsoft Learn: Admin guide to Copilot in Teams","related":["copilot-in-teams-phone"]}]};
/* Copilot Feature-dle · core helpers
   Classic scripts on a shared FD namespace so the game also runs from file:// (no ES-module CORS issues). */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});

  /* ---------- escaping + tiny templating ---------- */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  class Safe {
    constructor(s) { this.s = s; }
    toString() { return this.s; }
  }
  const raw = (s) => new Safe(String(s));
  const flat = (v) => {
    if (v == null || v === false || v === true) return '';
    if (v instanceof Safe) return v.s;
    if (Array.isArray(v)) return v.map(flat).join('');
    return esc(v);
  };
  /* html`<p>${userText}</p>` escapes interpolations unless they are html`` / raw() results */

/* Copilot Feature-dle · feature library loader, schema normaliser and pack handling
   The library lives in data/features.json (see README for the schema). */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});
  const { slug, hash } = FD.u;

  const DIFF_ORDER = { Easy: 0, Medium: 1, Hard: 2, Expert: 3 };
  const BRAND_KEYS = ['blue', 'red', 'purple', 'orange', 'green', 'yellow', 'pink', 'navy'];
  const MAX_COMMUNITY_FEATURES = 200;

  const lib = (FD.lib = {
    ready: false, features: [], byId: {}, categories: [], catByName: {}, packs: [], packById: {}, themes: [], schedule: {}, meta: {}
  });

  const str = (v) => (v == null ? '' : String(v).trim());
  const strList = (v) => (Array.isArray(v) ? v.map(str).filter(Boolean) : []);
  /* only plain https links are ever rendered as hrefs (blocks javascript: and data: URLs from imported packs) */
  const safeLink = (v) => { const s = str(v); return /^https:\/\/[^\s"'<>\\]+$/i.test(s) ? s : ''; };

  /* ---------- hint helpers: authors give 3-5 hints, the game pads to a full ladder of 5 ---------- */
  function buildHints(f) {
    const max = FD.config.maxAttempts;
    const hints = f.hints.slice(0, max);
    const words = f.name.split(/\s+/).filter(Boolean);
    const fillers = [
      `It lives in the "${f.category}" family.`,
      `Its name is ${words.length} word${words.length === 1 ? '' : 's'} long.`,
      `It starts with "${f.name.charAt(0).toUpperCase()}".`,
      `The last word of its name starts with "${words[words.length - 1].charAt(0).toUpperCase()}".`
    ];
    let i = 0;
    while (hints.length < max && i < fillers.length) hints.push(fillers[i++]);
    return hints;
  }

  /* name "shape" for the progressive reveal (letters hidden until hint 4 / 5) */
  function nameShape(name) {
    return name.split(/\s+/).filter(Boolean).map((w) => Array.from(w).map((c) => ({ c, alnum: /[\p{L}\p{N}]/u.test(c) })));
  }
  FD.hints = {
    build: buildHints,
    shape: nameShape,
    /* what the "extras" panel reveals at a given number of visible hints */
    level: (n) => ({ category: n >= 3, count: n >= 3, lengths: n >= 4, first: n >= 5 })
  };

  /* ---------- normalise one feature ---------- */
  function normFeature(f, packId, opts = {}) {
    const name = str(f.name);
    const d = String(f.difficulty || 'Medium').toLowerCase();
    const difficulty = ['Easy', 'Medium', 'Hard', 'Expert'].find((x) => x.toLowerCase() === d) || 'Medium';
    const base = slug(name) || 'feature';
    const id = str(f.id) || (opts.prefix ? `${opts.prefix}--${base}` : base);
    const useCases = (Array.isArray(f.useCases) ? f.useCases : [])
      .map((u) => (typeof u === 'string' ? { title: '', text: str(u) } : { title: str(u && u.title), text: str(u && u.text) }))
      .filter((u) => u.text);
    const out = {
      id, name,
      aliases: Array.from(new Set(strList(f.aliases))),
      difficulty,
      category: str(f.category) || 'Community',
      tags: strList(f.tags).map((t) => t.toLowerCase()),
      packs: strList(f.packs).length ? strList(f.packs) : [packId || 'core'],
      hints: strList(f.hints),
      description: str(f.description),
      why: str(f.why),
      useCases,
      prompt: str(f.prompt),
      learnMore: safeLink(f.learnMore),
      learnLabel: str(f.learnLabel) || 'Read more on Microsoft Learn',
      introduced: str(f.introduced),
      related: strList(f.related),
      daily: f.daily !== false,

    out.diffRank = DIFF_ORDER[out.difficulty];

  /* ---------- community / AI-generated pack validation (friendly errors for the import screen) ---------- */
  function validatePack(json) {

    if (!data || typeof data !== 'object' || !Array.isArray(data.features)) {

    }
    if (!data.features.length) errors.push('The "features" list is empty.');
    if (data.features.length > MAX_COMMUNITY_FEATURES) errors.push(`That is a big pack! Please keep it to ${MAX_COMMUNITY_FEATURES} features or fewer.`);

    data.features.slice(0, MAX_COMMUNITY_FEATURES).forEach((f, i) => {
      const label = `Feature ${i + 1}${f && f.name ? ` ("${str(f.name)}")` : ''}`;

      const hints = strList(f.hints);
      if (hints.length < 3) { errors.push(`${label}: needs at least 3 hints (5 is ideal).`); return; }
      if (hints.length > 5) warnings.push(`${label}: only the first 5 hints are used.`);
      if (hints.length < 5) warnings.push(`${label}: has ${hints.length} hints, so the game will add a couple of simple ones at the end.`);
      if (f.difficulty && !['easy', 'medium', 'hard', 'expert'].includes(String(f.difficulty).toLowerCase())) warnings.push(`${label}: difficulty should be Easy, Medium, Hard or Expert (using Medium).`);
      if (f.learnMore && !safeLink(f.learnMore)) warnings.push(`${label}: "learnMore" should be a full https:// link (it will be ignored).`);
      const key = str(f.name).toLowerCase();
      if (seen.has(key)) { warnings.push(`${label}: duplicate name, skipped.`); return; }
      seen.add(key);
      features.push(f);
    });
    if (!features.length && !errors.length) errors.push('No usable features found.');
    const pack = {
      id: 'community-' + (slug(str(data.name) || 'my-pack') || 'my-pack'),
      name: str(data.name) || 'My community pack',
      description: str(data.description) || 'A pack created by the community.',

  /* ---------- build the live library from raw JSON (+ any community packs) ---------- */
  function build(raw, community) {

      (Array.isArray(cp.features) ? cp.features : []).forEach((f) => {

    const cats = [];
    (raw.categories || []).forEach((c) => cats.push({ blurb: '', icon: 'sparkle', color: 'blue', ...c }));
    lib.features.forEach((f) => {
      if (!cats.find((c) => c.name === f.category)) cats.push({ name: f.category, color: BRAND_KEYS[hash(f.category) % BRAND_KEYS.length], icon: 'sparkle', blurb: '' });

  /* ---------- loading: embedded data -> fetch JSON -> script mirror (file:// fallback) ---------- */
  function injectScript(src) {

  const catMeta = (name) => lib.catByName[name] || { name, color: 'blue', icon: 'sparkle', blurb: '' };
  const catColor = (name) => catMeta(name).color;
  function pool(o = {}) {
    return lib.features.filter((f) => {
      if (o.difficulty && o.difficulty !== 'all' && f.difficulty !== o.difficulty) return false;
      if (o.category && o.category !== 'all' && f.category !== o.category) return false;
      if (o.pack && o.pack !== 'all' && !f.packs.includes(o.pack)) return false;
      if (o.tag && !f.tags.includes(o.tag)) return false;
      if (o.exclude && o.exclude.includes(f.id)) return false;

  const packFeatures = (id) => lib.features.filter((f) => f.packs.includes(id));
  const coreFeatures = () => lib.features.filter((f) => f.packs.includes('core') && !f.community);

  FD.data = { load, build, validatePack, normFeature, pool, packFeatures, coreFeatures, catMeta, catColor, DIFF_ORDER, BRAND_KEYS };
})();

/* Copilot Feature-dle · guess matching
   Full names, aliases, brand-prefix variants ("Pages" = "Copilot Pages"), plurals, typos and missing spaces. */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});

  /* words that do not help identify a feature on their own */
  const WEAK = new Set(['microsoft', 'ms', '365', 'm365', 'office', 'copilot', 'in', 'the', 'a', 'an', 'for', 'of', 'with', 'and', 'to', 'app', 'apps', 'my', 'your']);
  const NOISE = new Set(['microsoft', 'ms', '365', 'm365', 'the', 'a', 'an', 'my', 'your']);

  function norm(s) {
    return String(s == null ? '' : s)
      .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/&/g, ' and ').replace(/\+/g, ' plus ')
      .replace(/['\u2019`]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
  }
  const stem = (t) => (t.length > 3 && t.endsWith('s') && !t.endsWith('ss') ? t.slice(0, -1) : t);
  function strongOf(n) {
    const toks = n ? n.split(' ').map(stem) : [];
    const strong = toks.filter((t) => !WEAK.has(t));
    return strong.length ? strong : toks.filter((t) => !NOISE.has(t));
  }
  const mkForm = (raw) => { const n = norm(raw); return { raw, n, strong: strongOf(n), squash: n.replace(/ /g, '') }; };

  /* Optimal-string-alignment distance with early exit */
  function dl(a, b, max) {
    const al = a.length, bl = b.length;
    if (Math.abs(al - bl) > max) return max + 1;
    let prev2 = null, prev = Array.from({ length: bl + 1 }, (_, j) => j), cur = new Array(bl + 1);
    for (let i = 1; i <= al; i++) {
      cur[0] = i; let rowMin = i;
      for (let j = 1; j <= bl; j++) {
        const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
        let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        if (i > 1 && j > 1 && a.charCodeAt(i - 1) === b.charCodeAt(j - 2) && a.charCodeAt(i - 2) === b.charCodeAt(j - 1)) v = Math.min(v, prev2[j - 2] + 1);
        cur[j] = v; if (v < rowMin) rowMin = v;
      }
      if (rowMin > max) return max + 1;
      prev2 = prev; prev = cur; cur = new Array(bl + 1);
    }
    return prev[bl];
  }
  const maxEdits = (len) => (len <= 3 ? 0 : len <= 7 ? 1 : len <= 13 ? 2 : 3);

  function tokEq(a, b) {
    if (a === b) return true;
    const m = maxEdits(Math.min(a.length, b.length));
    if (!m) return false;
    if (Math.abs(a.length - b.length) > m) {
      const s = a.length < b.length ? a : b, l = a.length < b.length ? b : a;
      return s.length >= 5 && l.startsWith(s) && s.length / l.length >= 0.75; /* "research" ~ "researcher" */
    }
    return dl(a, b, m) <= m;
  }

  /* 0 = no match; otherwise { s: confidence, kind: exact | alias | fuzzy } */
  function scoreForm(g, c, isName) {
    if (!g.n || !c.n) return { s: 0, kind: 'none' };
    if (g.n === c.n) return { s: 1, kind: isName ? 'exact' : 'alias' };
    if (g.strong.length && g.strong.length === c.strong.length) {
      const used = new Array(c.strong.length).fill(false);
      let ok = true, fuzzy = false;
      for (const gt of g.strong) {
        let found = -1;
        for (let i = 0; i < c.strong.length; i++) if (!used[i] && gt === c.strong[i]) { found = i; break; }
        if (found < 0) for (let i = 0; i < c.strong.length; i++) if (!used[i] && tokEq(gt, c.strong[i])) { found = i; fuzzy = true; break; }
        if (found < 0) { ok = false; break; }
        used[found] = true;
      }
      if (ok) return { s: fuzzy ? 0.9 : 0.97, kind: fuzzy ? 'fuzzy' : 'alias' };
    }
    const a = g.squash, b = c.squash;
    const m = maxEdits(Math.min(a.length, b.length));
    if (m && Math.abs(a.length - b.length) <= m) {
      const d = dl(a, b, m);
      if (d <= m) return { s: 0.85 - d * 0.05, kind: 'fuzzy' };
    }
    return { s: 0, kind: 'none' };
  }

  const formsOf = (f) => f._forms || (f._forms = [{ ...mkForm(f.name), isName: true }].concat(f.aliases.map((a) => ({ ...mkForm(a), isName: false }))));

  /* Find the library feature the player most likely means.
     If several different features tie on a non-exact match ("Wave"), the result is flagged `ambiguous` so the game can ask for more detail. */
  function resolve(text, features, preferId) {
    const g = mkForm(text);
    if (!g.n) return null;
    const hits = [];
    for (const f of features) {
      let top = null;
      for (const c of formsOf(f)) {
        const r = scoreForm(g, c, c.isName);
        if (r.s > 0 && (!top || r.s > top.s)) top = { feature: f, s: r.s, kind: r.kind };
      }
      if (top) hits.push(top);
    }
    if (!hits.length) return null;
    const max = Math.max(...hits.map((h) => h.s));
    const tied = hits.filter((h) => h.s === max);
    const best = tied.find((h) => h.feature.id === preferId) || tied[0];
    return tied.length > 1 && max < 1 ? { ...best, ambiguous: true, options: tied.map((h) => h.feature) } : best;
  }

  /* autocomplete: prefix > word-prefix > multi-word prefix > substring > fuzzy */
  function suggest(text, features, limit = 7, skipIds = []) {
    const q = norm(text);
    if (!q) return [];
    const qt = q.split(' ');
    const qForm = { n: q, strong: strongOf(q), squash: q.replace(/ /g, '') };
    const out = [];
    for (const f of features) {
      if (skipIds.includes(f.id)) continue;
      let best = 0;
      for (const c of formsOf(f)) {
        const words = c.n.split(' ');
        let s = 0;
        if (c.n.startsWith(q)) s = 100 - Math.min(40, c.n.length - q.length);
        else if (words.some((t) => t.startsWith(q))) s = 80;
        else if (qt.length > 1 && qt.every((t) => words.some((ct) => ct.startsWith(t)))) s = 70;
        else if (q.length >= 3 && c.n.includes(q)) s = 60;
        else { const r = scoreForm(qForm, c, c.isName); if (r.s > 0) s = 50 + r.s * 10; }
        if (s > best) best = s;
      }
      if (best) out.push({ feature: f, score: best });
    }
    out.sort((a, b) => b.score - a.score || a.feature.name.localeCompare(b.feature.name));
    return out.slice(0, limit).map((o) => o.feature);
  }

  /* feedback for a wrong guess: how "warm" is it, and is the answer easier or harder? */
  function temperature(g, target) {
    if (g.id === target.id) return 'correct';
    const shared = g.tags.some((t) => target.tags.includes(t)) || (target.related || []).includes(g.id) || (g.related || []).includes(target.id);
    const sameCat = g.category === target.category;
    if ((sameCat && shared) || (target.related || []).includes(g.id) || (g.related || []).includes(target.id)) return 'hot';
    if (sameCat || shared) return 'warm';
    return 'cold';
  }
  const direction = (g, target) => (target.diffRank > g.diffRank ? 'up' : target.diffRank < g.diffRank ? 'down' : 'same');

  FD.match = { norm, resolve, suggest, temperature, direction, dl };
})();

(function () {

  const FD = (window.FD = window.FD || {});
  const cfg = FD.config;
  const { slug } = FD.u;

  /* ---------- points ---------- */
  const base = (hints) => cfg.points[Math.min(cfg.points.length, Math.max(1, hints)) - 1];
  function speed(ms, relaxed) {
    if (relaxed || ms == null) return 0;
    for (const t of cfg.speedBonus) if (ms <= t.maxMs) return t.pts;
    return 0;
  }
  const multiplier = (streakBefore) => Math.round((1 + cfg.streakStep * Math.min(Math.max(0, streakBefore), cfg.streakCap)) * 100) / 100;
  function compute({ hints, ms, streakBefore, relaxed }) {
    const b = base(hints), s = speed(ms, relaxed), m = multiplier(streakBefore);
    return { base: b, speed: s, multiplier: m, subtotal: b + s, total: Math.round((b + s) * m) };
  }
  /* what the score would be right now if the player nailed it (for the live score panel) */
  const potential = (hintsShown, ms, streakBefore, relaxed) => compute({ hints: hintsShown, ms, streakBefore, relaxed });

  /* ---------- ranks ---------- */
  function rank(xp) {
    const r = cfg.ranks;
    let i = 0;
    for (let k = 0; k < r.length; k++) if (xp >= r[k].xp) i = k;
    const cur = r[i], next = r[i + 1] || null;
    const pct = next ? Math.min(100, Math.round(((xp - cur.xp) / (next.xp - cur.xp)) * 100)) : 100;
    return { index: i, rank: cur, next, pct, toNext: next ? next.xp - xp : 0 };
  }

})();

  function fresh() {

  }
  function load() {
    try { const raw = storage.get(KEY); state = raw ? JSON.parse(raw) : fresh(); } catch (e) { state = fresh(); }
    if (!state || typeof state !== 'object') state = fresh();
    state.settings = Object.assign(defaultSettings(), state.settings || {});
    state.community = Array.isArray(state.community) ? state.community : [];
    state.meta = state.meta || {};
    if (!state.profiles || !Object.keys(state.profiles).length) { const f = fresh(); state.profiles = f.profiles; state.activeProfile = f.activeProfile; }
    Object.values(state.profiles).forEach(ensureProfile);
    if (!state.profiles[state.activeProfile]) state.activeProfile = Object.keys(state.profiles)[0];

  }

  const save = debounce(saveNow, 200);
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

  const profile = () => state.profiles[state.activeProfile];
  const settings = () => state.settings;
  const changed = () => { save(); bus.emit('change'); };

  /* ---------- settings -> DOM ---------- */
  function applySettings() {
    const s = state.settings, root = document.documentElement;

  /* ---------- profiles ---------- */
  const COLORS = ['blue', 'red', 'purple', 'orange', 'green', 'pink', 'yellow', 'navy'];
  function createProfile(name, color) {
    const p = newProfile((name || '').trim().slice(0, 24) || 'Player', color || COLORS[Object.keys(state.profiles).length % COLORS.length]);

  /* ---------- in-progress games ---------- */

  function dailyStreak(p = profile(), today = dateKey()) {

  /* ---------- the big one: record a finished game ---------- */
  function recordGame(r) {
    const p = profile(), s = p.stats, f = r.feature, relaxed = state.settings.relaxed;
    const rankBefore = FD.scoring.rank(p.xp).index;
    const out = { won: !!r.won, feature: f, hints: r.hintsUsed, timeMs: r.timeMs, breakdown: null, xp: 0, levelUp: null, newBadges: [], firstTime: false, dailyStreak: null, bonusXp: [] };
    const entry = p.collection[f.id] || (p.collection[f.id] = { solved: 0, seen: 0, bestHints: null, first: null });
    s.played++;

    if (r.won) {
      const b = FD.scoring.compute({ hints: r.hintsUsed, ms: r.timeMs, streakBefore: s.winStreak, relaxed });
      out.breakdown = b;
      s.won++; s.winStreak++; s.maxWinStreak = Math.max(s.maxWinStreak, s.winStreak);
      s.totalScore += b.total; s.bestScore = Math.max(s.bestScore, b.total);
      s.hist[Math.min(4, Math.max(0, r.hintsUsed - 1))]++;
      if (r.timeMs != null) { s.totalTimeMs += r.timeMs; s.fastestMs = s.fastestMs == null ? r.timeMs : Math.min(s.fastestMs, r.timeMs); }

      if (r.won) { d.streak = d.last === addDays(r.dateKey, -1) ? d.streak + 1 : (d.last === r.dateKey ? d.streak : 1); d.max = Math.max(d.max, d.streak); }

    }

    /* XP */
    let xp = r.won ? out.breakdown.total + (cfg.difficultyXp[f.difficulty] || 0) : cfg.lossXp;
    if (r.won && out.firstTime) { xp += cfg.newFeatureXp; out.bonusXp.push(['New feature collected', cfg.newFeatureXp]); }
    if (r.won && r.mode === 'daily') {
      const streakXp = Math.min(cfg.dailyStreakXpCap, Math.max(0, p.daily.streak - 1) * cfg.dailyStreakXp);
      xp += cfg.dailyBonusXp + streakXp;
      out.bonusXp.push(['Daily Challenge bonus', cfg.dailyBonusXp]);
      if (streakXp) out.bonusXp.push([`${p.daily.streak}-day streak`, streakXp]);
    }
    if (r.won && (cfg.difficultyXp[f.difficulty] || 0)) out.bonusXp.unshift([`${f.difficulty} difficulty`, cfg.difficultyXp[f.difficulty]]);
    out.xp = xp; p.xp += xp;
    if (r.mode === 'daily' && r.dateKey && p.daily.results[r.dateKey]) {
      Object.assign(p.daily.results[r.dateKey], { breakdown: out.breakdown, xp, bonusXp: out.bonusXp, guesses: r.guesses || [] });
    }
    const rankAfter = FD.scoring.rank(p.xp);
    if (rankAfter.index > rankBefore) out.levelUp = rankAfter.rank;

    p.history.unshift({ t: Date.now(), mode: r.mode, id: f.id, name: f.name, won: !!r.won, hints: r.hintsUsed, score: out.breakdown ? out.breakdown.total : 0, timeMs: r.timeMs });
    if (p.history.length > 60) p.history.length = 60;

    out.newBadges = FD.badges.evaluate(p, { won: !!r.won, hintsUsed: r.hintsUsed, timeMs: r.timeMs, typo: !!r.typo, mode: r.mode, feature: f, relaxed }, FD.lib);
    changed();
    if (FD.board && FD.board.submit) FD.board.submit(r, out);
    return out;
  }

  /* counters for engagement badges (shares, prompt copies, doc opens...) */
  function bump(name, n = 1, max) {
    const p = profile();
    p.counters[name] = max ? Math.max(p.counters[name] || 0, n) : (p.counters[name] || 0) + n;

  }

  /* ---------- community packs ---------- */
  function rebuildLibrary() { if (FD.rawLib) FD.data.build(FD.rawLib, state.community); }
  function addCommunityPack(pack) {

  /* ---------- backup / restore ---------- */
  function exportJSON() { return JSON.stringify({ app: 'copilot-feature-dle', version: 1, exported: new Date().toISOString(), data: state }, null, 1); }
  function importJSON(text) {
    let j;
    try { j = JSON.parse(text); } catch (e) { return { ok: false, error: 'That does not look like a Feature-dle backup (not valid JSON).' }; }

    });
    if (!players) return { ok: false, error: 'That backup does not contain any players.' };
    (Array.isArray(j.data.community) ? j.data.community : []).forEach((c) => {
      if (c && typeof c.id === 'string' && Array.isArray(c.features) && !state.community.find((x) => x.id === c.id)) {
        state.community.push({ id: c.id, name: String(c.name || 'Community pack').slice(0, 80), description: String(c.description || '').slice(0, 300), author: String(c.author || '').slice(0, 80), added: Number(c.added) || Date.now(), features: c.features });
      }

  }

  FD.store = {
    load, save, saveNow, on: bus.on, emit: () => bus.emit('change'),
    key: KEY,
    get state() { return state; },
    profile, settings, setSetting, applySettings, profiles: () => Object.values(state.profiles),
    createProfile, switchProfile, renameProfile, removeProfile, resetProfile, resetAll,
    getActive, setActive, clearActive, dailyStreak, dailyResult, recordGame, bump,
    addCommunityPack, removeCommunityPack, community: () => state.community,
    exportJSON, importJSON, onboarded, setOnboarded, COLORS
  };
})();

/* Copilot Feature-dle · leaderboards
   Default = everyone who has played on THIS device (great for a shared laptop at a workshop) plus clearly-labelled sample players.
   Optional = a shared event board via a tiny HTTP endpoint (config.leaderboard.endpoint, see README). */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});
  const { dateKey, seeded } = FD.u;

  const SAMPLE = [
    ['Aroha T.', 'green'], ['Priya S.', 'purple'], ['Jordan M.', 'orange'], ['Mei L.', 'pink'], ['Tariq H.', 'blue'],
    ['Chloe B.', 'red'], ['Luca R.', 'yellow'], ['Sam W.', 'navy'], ['Ngozi A.', 'green'], ['Ben K.', 'blue']
  ];

  function samplePlayers(today) {
    return SAMPLE.map(([name, color], i) => {
      const r = seeded('sample|' + name);
      const played = 14 + Math.floor(r() * 120);
      const rd = seeded('sample-day|' + name + '|' + today);
      const playedToday = rd() < 0.75;
      const hints = 1 + Math.floor(rd() * 4);
      const mult = 1 + Math.floor(rd() * 4) * 0.1;
      return {
        id: 'sample-' + i, sample: true, name, color, played,
        maxStreak: 2 + Math.floor(r() * 24), bestScore: 120 + Math.floor(r() * 110), totalScore: Math.round(played * (55 + r() * 35)),
        today: playedToday ? { score: Math.round(FD.config.points[hints - 1] * mult) + (rd() < 0.4 ? 10 : 0), hints, timeMs: 9000 + Math.floor(rd() * 70000), won: true } : null
      };
    });
  }

  function localPlayers(today) {
    const me = FD.store.profile().id;
    return FD.store.profiles().map((p) => {
      const t = p.daily.results[today];
      return {
        id: p.id, sample: false, you: p.id === me, name: p.name, color: p.color, played: p.stats.played,
        maxStreak: p.daily.max, bestScore: p.stats.bestScore, totalScore: p.stats.totalScore,
        today: t ? { score: t.score, hints: t.hints, timeMs: t.timeMs, won: t.won } : null
      };
    });
  }

  function rank(players) {
    const byDaily = players.filter((p) => p.today).sort((a, b) => b.today.score - a.today.score || (a.today.timeMs || 0) - (b.today.timeMs || 0));
    return {
      daily: byDaily,
      streak: players.filter((p) => p.maxStreak > 0).sort((a, b) => b.maxStreak - a.maxStreak || b.totalScore - a.totalScore),
      score: players.filter((p) => p.totalScore > 0).sort((a, b) => b.totalScore - a.totalScore),
      games: players.filter((p) => p.played > 0).sort((a, b) => b.played - a.played),
      players
    };
  }
  function local() {
    const today = dateKey();
    const players = localPlayers(today).concat(FD.store.settings().sampleBoard ? samplePlayers(today) : []);
    return rank(players);
  }

  /* ---------- optional shared event board ---------- */
  const lb = () => FD.config.leaderboard || {};
  const remoteEnabled = () => !!lb().endpoint;

  async function fetchRemote() {
    const u = new URL(lb().endpoint, location.href);
    u.searchParams.set('eventCode', lb().eventCode || '');
    u.searchParams.set('date', dateKey());
    const r = await fetch(u.toString(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const me = FD.store.profile().id;
    const BRAND = ['blue', 'red', 'purple', 'orange', 'green', 'pink', 'yellow', 'navy'];
    const players = (Array.isArray(j.players) ? j.players : []).filter((p) => p && typeof p === 'object').slice(0, 500).map((p) => ({
      id: String(p.playerId || p.name || ''), sample: false, live: true, you: String(p.playerId || '') === me, name: String(p.name || 'Player').slice(0, 24), color: BRAND.includes(p.color) ? p.color : 'blue',
      played: +p.played || 0, maxStreak: +p.maxStreak || 0, bestScore: +p.bestScore || 0, totalScore: +p.totalScore || 0,
      today: p.today ? { score: +p.today.score || 0, hints: +p.today.hints || 0, timeMs: +p.today.timeMs || 0, won: p.today.won !== false } : null
    }));
    return rank(players);
  }

  /* fire-and-forget: never block or break gameplay if the endpoint is down */
  function submit(r, out) {
    if (!remoteEnabled() || r.mode !== 'daily') return;
    const p = FD.store.profile();
    const body = {
      eventCode: lb().eventCode || '', date: r.dateKey, playerId: p.id, name: p.name, color: p.color,
      today: { score: out.breakdown ? out.breakdown.total : 0, hints: r.hintsUsed, timeMs: r.timeMs, won: !!r.won },
      maxStreak: p.daily.max, totalScore: p.stats.totalScore, bestScore: p.stats.bestScore, played: p.stats.played
    };
    try { fetch(lb().endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true }).catch(() => {}); } catch (e) { /* ignore */ }
  }

  FD.board = { local, fetchRemote, remoteEnabled, submit };
})();

/* Copilot Feature-dle · Daily Challenge selection
   Same feature for everyone on a given (local) date. A weekday plan ramps difficulty, a seeded shuffle guarantees no repeats
   within a cycle, and data/features.json "schedule" can pin any date to any feature (events, launches...). */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});
  const cfg = FD.config;
  const { keyToDay, dayToKey, weekdayOfKey, dateKey, shuffle, seeded, msToMidnight } = FD.u;
  const ORDER = ['Easy', 'Medium', 'Hard', 'Expert'];

  const number = (key) => keyToDay(key) - keyToDay(cfg.dailyEpoch) + 1;
  const plannedDifficulty = (key) => cfg.weekdayPlan[weekdayOfKey(key)];

  function pick(key = dateKey()) {
    const lib = FD.lib;
    const pinned = lib.schedule || {};
    if (pinned[key] && lib.byId[pinned[key]]) return lib.byId[pinned[key]];

    const pinnedIds = new Set(Object.values(pinned));
    const feats = lib.features.filter((f) => !f.community && f.daily && f.packs.includes('core') && !pinnedIds.has(f.id));
    const planned = plannedDifficulty(key);
    const byDiff = (d) => feats.filter((f) => f.difficulty === d).sort((a, b) => (a.id < b.id ? -1 : 1));

    let bucket = byDiff(planned);
    if (!bucket.length) {
      const idx = ORDER.indexOf(planned);
      for (let delta = 1; delta < 4 && !bucket.length; delta++) {
        for (const j of [idx - delta, idx + delta]) if (!bucket.length && j >= 0 && j < 4) bucket = byDiff(ORDER[j]);
      }
    }
    if (!bucket.length) return null;

    /* which occurrence of this weekday-difficulty slot is it since launch? */
    const start = keyToDay(cfg.dailyEpoch), day = keyToDay(key);
    let n = 0;
    for (let t = start; t < day; t++) if (plannedDifficulty(dayToKey(t)) === planned) n++;
    const cycle = Math.floor(n / bucket.length), pos = n % bucket.length;
    const order = shuffle(bucket.map((f) => f.id), seeded(`fd|${planned}|${cycle}`));
    return lib.byId[order[pos]];
  }

  function info(key = dateKey()) {
    const feature = pick(key);
    return { key, number: number(key), planned: plannedDifficulty(key), difficulty: feature ? feature.difficulty : plannedDifficulty(key), feature };
  }

  FD.daily = { pick, info, number, plannedDifficulty, msUntilNext: () => msToMidnight() };
})();

/* Copilot Feature-dle · game engine (no DOM): one puzzle = one Game */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});

  class Game {
    constructor(feature, o = {}) {
      this.f = feature;
      this.mode = o.mode || 'free';
      this.key = o.key || null;
      this.max = FD.config.maxAttempts;
      this.hints = FD.hints.build(feature);
      this.guesses = [];
      this.status = 'playing'; /* playing | won | lost */
      this.activeMs = o.activeMs || 0;
      this.typo = false;
    }
    get hintsShown() { return Math.min(this.guesses.length + 1, this.max); }
    get attemptsLeft() { return this.max - this.guesses.length; }
    get over() { return this.status !== 'playing'; }
    get won() { return this.status === 'won'; }
    /* hints the player saw when they finished (this is what scoring uses) */
    get hintsUsed() { return this.status === 'won' ? this.guesses.length : this.max; }
    get grid() { return this.guesses.map((g) => g.temp); }
    guessedIds() { return this.guesses.filter((g) => g.id).map((g) => g.id); }

    /* returns { ok, reason?, correct?, lost?, guess?, kind? } - invalid input never costs an attempt */
    submit(text) {
      if (this.over) return { ok: false, reason: 'over' };
      const t = String(text || '').trim();
      if (!t) return { ok: false, reason: 'empty' };
      const m = FD.match.resolve(t, FD.lib.features, this.f.id);
      if (!m) return { ok: false, reason: 'unknown' };
      if (m.ambiguous) return { ok: false, reason: 'ambiguous', options: m.options };
      const g = m.feature;
      if (this.guessedIds().includes(g.id)) return { ok: false, reason: 'duplicate', feature: g };
      const correct = g.id === this.f.id;
      const entry = { k: 'g', t, id: g.id, name: g.name, temp: correct ? 'correct' : FD.match.temperature(g, this.f), dir: FD.match.direction(g, this.f), sameCat: g.category === this.f.category, cat: g.category, diff: g.difficulty };
      this.guesses.push(entry);
      if (correct) { this.status = 'won'; this.typo = m.kind === 'fuzzy'; return { ok: true, correct: true, kind: m.kind, guess: entry }; }
      if (this.guesses.length >= this.max) this.status = 'lost';
      return { ok: true, correct: false, lost: this.status === 'lost', guess: entry, kind: m.kind };
    }

    /* "Need a nudge?" - reveal the next hint at the cost of an attempt */
    nudge() {
      if (this.over) return { ok: false };
      const entry = { k: 's', t: '', id: null, name: '', temp: 'skip', dir: null, sameCat: false };
      this.guesses.push(entry);
      if (this.guesses.length >= this.max) this.status = 'lost';
      return { ok: true, lost: this.status === 'lost', guess: entry };
    }
    giveUp() { if (!this.over) this.status = 'lost'; }

    serialize() {
      return { fid: this.f.id, mode: this.mode, key: this.key, guesses: this.guesses.map((g) => ({ ...g })), status: this.status, activeMs: Math.round(this.activeMs), typo: this.typo };
    }
    static restore(d) {
      const f = d && FD.lib.byId[d.fid];
      if (!f) return null;
      const g = new Game(f, { mode: d.mode, key: d.key, activeMs: d.activeMs });
      g.guesses = Array.isArray(d.guesses) ? d.guesses : [];
      g.status = d.status || 'playing'; g.typo = !!d.typo;
      return g;
    }
  }

  /* ---------- Free Play picker ---------- */
  const freeplay = {
    unlocked() { return FD.scoring.unlocks(FD.store.profile(), FD.lib, FD.store.settings()); },
    pool(filters = {}) {
      const un = freeplay.unlocked();
      return FD.data.pool({ difficulty: filters.difficulty, category: filters.category, pack: filters.pack, tag: filters.tag })
        .filter((f) => f.community || un[f.difficulty].unlocked);
    },
    pick(filters = {}, o = {}) {
      const p = FD.store.profile();
      let pool = freeplay.pool(filters);
      if (!pool.length) return null;
      const recent = p.history.slice(0, 5).map((h) => h.id).concat(o.exclude || []);
      const fresh = pool.filter((f) => !recent.includes(f.id));
      if (fresh.length) pool = fresh;
      if (filters.prioritise !== false) {
        const uncollected = pool.filter((f) => !FD.scoring.collected(p, f));
        if (uncollected.length) pool = uncollected;
      }
      return FD.u.pick(pool);
    }
  };

  FD.Game = Game;
  FD.freeplay = freeplay;
})();

/* Copilot Feature-dle · spoiler-free sharing: emoji text, brand-styled PNG card, Web Share, challenge links */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});
  const B = FD.brand;

  const EMOJI = { correct: '\uD83D\uDFE9', hot: '\uD83D\uDFE7', warm: '\uD83D\uDFE8', cold: '\uD83D\uDFE6', skip: '\u2B1C' };
  const baseUrl = () => FD.config.shareUrl || (/^https?:$/.test(location.protocol) ? location.origin + location.pathname : '');

    }

    /* ---------- suggestions (ARIA combobox) ---------- */
    function closeList() { list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); sugIdx = -1; }
    function openList() {
      const v = input.value.trim();
      sugList = v.length ? FD.match.suggest(v, FD.lib.features, 6, game.guessedIds()) : [];
      if (!sugList.length) { closeList(); return; }
      list.innerHTML = flat(sugList.map((s, i) => html`<li role="option" id="sg-${i}" data-i="${i}" aria-selected="false"><span class="sg-name">${s.name}</span><span class="sg-meta">${s.category}</span></li>`));
      list.hidden = false; input.setAttribute('aria-expanded', 'true'); sugIdx = -1;
      const vv = window.visualViewport, room = (vv ? vv.height + vv.offsetTop : innerHeight) - input.getBoundingClientRect().bottom;
      list.classList.toggle('up', room < 250);
    }
    function highlight(i) {
      $$('#suggest li', container).forEach((li, k) => li.setAttribute('aria-selected', String(k === i)));
      if (i >= 0) { input.setAttribute('aria-activedescendant', 'sg-' + i); const li = q('#sg-' + i); if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest' }); } else input.removeAttribute('aria-activedescendant');
      sugIdx = i;

    function pickSuggestion(i) { const s = sugList[i]; if (!s) return; input.value = s.name; closeList(); input.focus(); }

    input.addEventListener('input', openList);
    input.addEventListener('focus', () => { if (input.value.trim()) openList(); });
    input.addEventListener('blur', () => setTimeout(closeList, 120));

      const open = !list.hidden;
      if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) openList(); if (sugList.length) highlight((sugIdx + 1) % sugList.length); }
      else if (e.key === 'ArrowUp') { if (open) { e.preventDefault(); highlight((sugIdx - 1 + sugList.length) % sugList.length); } }
      else if (e.key === 'Enter' && open && sugIdx >= 0) { e.preventDefault(); pickSuggestion(sugIdx); }
      else if (e.key === 'Escape' && open) { e.preventDefault(); closeList(); }

    function shake() { if (FD.u.reduceMotion()) return; input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); }

    /* ---------- submit ---------- */
    function submit() {
      if (game.over || paused) return;
      const res = game.submit(input.value);
      if (!res.ok) {
        if (res.reason === 'empty') say('Type a feature name first.', 'warn');
        else if (res.reason === 'duplicate') say(`You've already tried ${res.feature.name}. Pick something new!`, 'warn');
        else if (res.reason === 'ambiguous') say(`That could be ${res.options.slice(0, 3).map((o) => o.name).join(' or ')}. Be a little more specific!`, 'warn');

    function afterStep() {

    function persist() { if (opts.persistKey) FD.store.setActive(opts.persistKey, game.serialize()); }

    form.addEventListener('click', async (e) => {

        if (game.over) finish(); else afterStep();
      } else if (b.dataset.act === 'giveup') {
        const ok = await ui.confirm('Give up on this one?', 'No worries! We\u2019ll reveal the answer so you can learn it. It counts as a miss.', 'Show me the answer');
        if (ok) { game.giveUp(); persist(); finish(); }

    /* ---------- timer ---------- */

      game.activeMs += dt;

    }
    if (!isFinishedView && !game.over) timerId = setInterval(tick, 1000);

    /* ---------- finish ---------- */
    function summaryFor(out) {
      const rk = FD.scoring.rank(FD.store.profile().xp);
      return {
        mode: opts.mode, number: opts.number, won: game.won, hintsUsed: game.hintsUsed, score: out && out.breakdown ? out.breakdown.total : (opts.finished && opts.finished.score) || 0,
        grid: game.grid, streak: FD.store.dailyStreak(), rank: rk.rank.name, difficulty: f.difficulty
      };
    }
    function finish() {
      if (destroyed) return;
      clearInterval(timerId);
      const data = { feature: f, won: game.won, hintsUsed: game.hintsUsed, timeMs: Math.round(game.activeMs), grid: game.grid, guesses: game.guesses, mode: opts.mode, number: opts.number, dateKey: opts.dateKey, challenge: opts.challenge };
      let out = null;
      if (opts.record !== false) {
        out = FD.store.recordGame({ mode: opts.mode, dateKey: opts.dateKey, feature: f, won: game.won, hintsUsed: game.hintsUsed, timeMs: data.timeMs, grid: game.grid, guesses: game.guesses, typo: game.typo });
        Object.assign(data, out);
      }
      if (opts.persistKey && opts.mode !== 'daily') FD.store.clearActive(opts.persistKey);
      FD.fx.play(game.won ? 'win' : 'lose'); FD.fx.haptic(game.won ? [30, 40, 60] : 120);

      announce(game.won ? `Correct! The answer was ${f.name}.` : `Out of guesses. The answer was ${f.name}.`);
      drawAll(false);
      if (opts.onFinish) opts.onFinish(game, data);
      if (opts.compact) { if (opts.onRoundEnd) opts.onRoundEnd(game, data); return; }
      showResult(data, out);
    }
    function showResult(data, out) {
      data.share = summaryFor(out);
      FD.share.prepare(data.share);
      FD.result.render(q('#result-host'), data, { actions: opts.actions });
      if (out) ui.celebrate(out);
      const host = q('#result-host');
      setTimeout(() => { host.scrollIntoView({ behavior: FD.u.reduceMotion() ? 'auto' : 'smooth', block: 'start' }); host.focus({ preventScroll: true }); }, 450);
    }

    /* ---------- boot ---------- */
    if (isFinishedView) {
      drawAll(false);
      const r = opts.finished;
      const rk = FD.scoring.rank(FD.store.profile().xp);
      const data = { feature: f, won: r.won, hintsUsed: r.hints, timeMs: r.timeMs, grid: r.grid, guesses: game.guesses, mode: opts.mode, number: opts.number, dateKey: opts.dateKey, breakdown: r.breakdown || null, xp: r.xp || 0, bonusXp: r.bonusXp || [], firstTime: false, dailyStreak: FD.store.dailyStreak() };
      data.share = { mode: opts.mode, number: opts.number, won: r.won, hintsUsed: r.hints, score: r.score || 0, grid: r.grid || [], streak: FD.store.dailyStreak(), rank: rk.rank.name, difficulty: f.difficulty };
      FD.share.prepare(data.share);
      FD.result.render(q('#result-host'), data, { actions: opts.actions });

    }

      game,

      pause() { paused = true; container.classList.add('is-paused'); },
      resume() { paused = false; lastTick = performance.now(); container.classList.remove('is-paused'); input.focus(); },
      destroy() { destroyed = true; clearInterval(timerId); },

  }

  FD.play = { mount: mountPlay, hintColor };
})();

      <ul class="review-list">${speed.items.map((it) => html`<li><details><summary><span class="rv-dot ${it.won ? 'won' : 'lost'}" aria-hidden="true"></span><span class="rv-name">${it.f.name}</span>${it.won ? html`<span class="chip chip-solid c-green">+${it.points}</span>` : html`<span class="chip">Missed</span>`}</summary>${FD.result.learn(it.f)}</details></li>`)}</ul>
      <div class="btn-row"><button class="btn btn-primary" type="button" data-action="speed-again">${FD.icon('refresh', { size: 20 })}Go again</button><a class="btn btn-ghost" href="#/free">${FD.icon('shuffle', { size: 20 })}Free play</a><a class="btn btn-ghost" href="#/stats">${FD.icon('chart', { size: 20 })}My stats</a></div>
    </section></div>`);
    window.scrollTo(0, 0); const h = $('#ss-h'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  ui.actions['speed-again'] = () => speedStart();

  FD.views.speed = { title: 'Speed round', render(main) { speed.main = main; speedSetup(main); return speedCleanup; } };

  /* ======================================================================== TEAM BATTLE */
  const TEAM_COLORS = ['blue', 'pink', 'green', 'orange', 'purple', 'red'];
  const TEAM_NAMES = ['Team Blue', 'Team Pink', 'Team Green', 'Team Orange', 'Team Purple', 'Team Red'];
  const team = { main: null, ctl: null, cfg: { n: 3, rounds: 5, difficulty: 'all', names: TEAM_NAMES.slice() }, s: null };

  function teamSetup(main) {
    const c = team.cfg;
    main.innerHTML = flat(html`<div class="container hub">
      <header class="hub-head"><p class="eyebrow">Workshops, lunch-and-learns &amp; team socials</p><h1>Team battle</h1><p class="lede">Teams take turns guessing the same feature. Each wrong guess unlocks an easier hint and passes the turn. Project it on the big screen!</p></header>
      ${seg('team')}
      <form class="card setup" id="team-form">
        <fieldset class="field"><legend>How many teams?</legend><div class="pill-radios">${[2, 3, 4, 5, 6].map((n) => html`<label class="pill-radio"><input type="radio" name="n" value="${n}"${attrs({ checked: c.n === n })}><span>${n} teams</span></label>`)}</div></fieldset>
        <div class="field"><span class="label">Team names</span><div class="team-names" id="team-names">${TEAM_COLORS.slice(0, c.n).map((col, i) => html`<label class="team-name c-${col}"><span class="sr-only">Team ${i + 1} name</span><span class="tn-dot" aria-hidden="true"></span><input class="input" maxlength="20" value="${c.names[i]}" data-i="${i}"></label>`)}</div></div>
        <fieldset class="field"><legend>Rounds</legend><div class="pill-radios">${[5, 8, 10].map((n) => html`<label class="pill-radio"><input type="radio" name="rounds" value="${n}"${attrs({ checked: c.rounds === n })}><span>${n} rounds</span></label>`)}</div></fieldset>
        <fieldset class="field"><legend>Difficulty</legend>${diffPills('difficulty', c.difficulty)}</fieldset>
        <div class="btn-row"><button class="btn btn-primary btn-lg" type="submit">${FD.icon('play', { size: 22 })}Start the battle</button></div>
      </form></div>`);
    const form = $('#team-form', main);
    const names = () => $$('#team-names input', form).forEach((i) => { c.names[+i.dataset.i] = i.value.trim() || TEAM_NAMES[+i.dataset.i]; });
    form.addEventListener('change', (e) => {
      names();
      if (e.target.name === 'n') { c.n = +e.target.value; teamSetup(main); const r = $('input[name="n"]:checked', main); if (r) r.focus(); }
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault(); names();
      c.rounds = +form.querySelector('input[name="rounds"]:checked').value;
      c.difficulty = (form.querySelector('input[name="difficulty"]:checked') || { value: 'all' }).value;
      teamStart();
    });
  }

  function teamStart() {
    const c = team.cfg;
    team.s = { teams: c.names.slice(0, c.n).map((name, i) => ({ name, color: TEAM_COLORS[i], score: 0, wins: 0 })), round: 0, used: [] };
    teamRound();
  }
  function teamBar() {
    const s = team.s;
    const active = team.game && !team.game.over ? (s.round - 1 + team.game.guesses.length) % s.teams.length : -1;
    return html`<div class="team-bar" role="group" aria-label="Scoreboard"><span class="tb-round">Round <strong>${s.round}</strong> of ${team.cfg.rounds}</span>${s.teams.map((t, i) => html`<span class="tb-team c-${t.color} ${i === active ? 'is-active' : ''}"><span class="tb-name">${t.name}</span><strong>${t.score}</strong></span>`)}</div>`;
  }
  function teamRound() {
    const s = team.s;
    if (s.round >= team.cfg.rounds) { teamEnd(); return; }
    s.round++;
    const f = FD.freeplay.pick({ difficulty: team.cfg.difficulty, prioritise: false }, { exclude: s.used });
    if (!f) { teamEnd(); return; }
    s.used.push(f.id);
    if (team.ctl) team.ctl.destroy();
    team.game = new FD.Game(f, { mode: 'team' });
    const starter = (s.round - 1) % s.teams.length;
    team.main.innerHTML = flat(html`<div class="container play-wrap"><div id="team-bar-host">${teamBar()}</div><div id="team-play"></div></div>`);
    team.ctl = FD.play.mount($('#team-play'), team.game, {
      mode: 'team', title: `Team battle \u00B7 round ${s.round}`, compact: true, record: false, hideTimer: true,
      turn: () => { const t = s.teams[(starter + team.game.guesses.length) % s.teams.length]; return { label: `${t.name}, it\u2019s your guess!`, color: t.color }; },
      onStep: () => { mount($('#team-bar-host'), teamBar()); },
      onRoundEnd: (g, data) => {
        let who = null, points = null;
        if (g.won) { const t = s.teams[(starter + g.guesses.length - 1) % s.teams.length]; points = FD.scoring.base(g.hintsUsed); t.score += points; t.wins++; who = t.name; }
        mount($('#team-bar-host'), teamBar());
        const last = s.round >= team.cfg.rounds;
        FD.result.compact($('#result-host', $('#team-play')), { ...data, who, points }, {
          learn: true,
          footer: html`<div class="btn-row"><button class="btn btn-primary" type="button" data-action="team-next">${last ? 'See the final scores' : 'Next round'} ${FD.icon('right', { size: 18 })}</button></div>`
        });
        const nb = $('[data-action="team-next"]'); if (nb) nb.focus({ preventScroll: true });
      }
    });
  }
  ui.actions['team-next'] = () => teamRound();

  function teamEnd() {
    const s = team.s;
    if (team.ctl) team.ctl.destroy(); team.ctl = null; team.game = null;
    const ranked = s.teams.slice().sort((a, b) => b.score - a.score || b.wins - a.wins);
    const top = ranked[0].score;
    const winners = ranked.filter((t) => t.score === top);
    const earned = FD.store.bump('teamBattles');
    ui.celebrate({ newBadges: earned }); FD.fx.play('win'); FD.fx.confetti({ count: 220 });
    team.main.innerHTML = flat(html`<div class="container hub"><section class="card podium-card" aria-labelledby="pod-h">
      <div class="ss-top">${FD.pip('cheer', { size: 130 })}<div><p class="eyebrow">Team battle complete</p><h1 id="pod-h">${winners.length > 1 ? 'It\u2019s a tie!' : `${winners[0].name} wins!`}</h1><p class="lede">${winners.length > 1 ? winners.map((w) => w.name).join(' & ') + ' share the crown.' : 'Brilliant effort from every team \u2013 and everyone learned a few new Copilot features.'}</p></div></div>
      <ol class="podium">${ranked.map((t, i) => html`<li class="c-${t.color} ${t.score === top ? 'is-top' : ''}"><span class="pod-rank">${i + 1}</span><span class="pod-name">${t.name}</span><span class="pod-wins">${FD.u.plural(t.wins, 'round')} won</span><strong class="pod-score">${t.score}</strong></li>`)}</ol>
      <div class="btn-row"><button class="btn btn-primary" type="button" data-action="team-again">${FD.icon('refresh', { size: 20 })}Rematch</button><button class="btn btn-ghost" type="button" data-action="team-setup">${FD.icon('sliders', { size: 20 })}Change setup</button><a class="btn btn-ghost" href="#/">${FD.icon('home', { size: 20 })}Home</a></div>
    </section></div>`);
    window.scrollTo(0, 0); const h = $('#pod-h'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  ui.actions['team-again'] = () => teamStart();
  ui.actions['team-setup'] = () => teamSetup(team.main);

  FD.views.team = { title: 'Team battle', render(main) { team.main = main; teamSetup(main); return () => { if (team.ctl) team.ctl.destroy(); team.ctl = null; }; } };
})();

/* Copilot Feature-dle · Feature Book (collection) */
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});
  const { html, flat, $, $$, mount, attrs } = FD.u;
  const ui = FD.ui;

  function statusOf(p, f, reveal) {
    const e = p.collection[f.id];
    if (e && e.solved > 0) return 'collected';
    if (e && e.seen > 0) return 'spotted';
    return reveal ? 'revealed' : 'locked';
  }

  function cardHtml(p, f, reveal) {
    const st = statusOf(p, f, reveal), e = p.collection[f.id], cat = FD.data.catMeta(f.category);
    const open = st !== 'locked';
    return html`<li><button class="fcard is-${st} c-${cat.color}" type="button" data-fid="${f.id}">
      <span class="fcard-ic" aria-hidden="true">${FD.icon(open ? cat.icon || 'sparkle' : 'lock', { size: 28 })}</span>
      <span class="fcard-name">${open ? f.name : 'Mystery feature'}</span>
      <span class="fcard-meta">${ui.diffChip(f.difficulty)}</span>
      <span class="fcard-foot">${st === 'collected' ? ui.stars(ui.mastery(e)) : st === 'spotted' ? html`<small>Spotted \u2013 solve it to collect</small>` : st === 'revealed' ? html`<small>Not played yet</small>` : html`<small>${f.category}</small>`}</span>
      <span class="sr-only">${st === 'collected' ? 'Collected' : st === 'spotted' ? 'Spotted' : open ? 'Not played yet' : 'Locked'}. ${f.difficulty}.</span>
    </button></li>`;
  }

  function detail(f, reveal) {
    const p = FD.store.profile(), st = statusOf(p, f, reveal), e = p.collection[f.id];
    const open = st !== 'locked';
    const hints = FD.hints.build(f);
    const body = open
      ? html`<div class="detail-chips">${ui.diffChip(f.difficulty)}${ui.catChip(f.category)}${st === 'collected' ? ui.stars(ui.mastery(e)) : ''}${f.introduced ? html`<span class="chip">Introduced ${f.introduced}</span>` : ''}</div>
          ${FD.result.learn(f)}
          <h3 class="mini-h">The hints we use for this one</h3>
          <ol class="earlier-list">${hints.map((h, i) => html`<li class="c-${FD.play.hintColor(i + 1)}"><span class="e-n" aria-hidden="true">${i + 1}</span><span class="e-t">${h}</span></li>`)}</ol>`
      : html`<div class="detail-mystery">${FD.pip('think', { size: 110 })}<div><div class="detail-chips">${ui.diffChip(f.difficulty)}${ui.catChip(f.category)}</div><p>You haven\u2019t met this one yet. Here\u2019s a teaser:</p><blockquote class="teaser">${hints[0]}</blockquote></div></div>`;
    const d = ui.dialog({
      title: open ? f.name : 'Mystery feature', cls: 'dlg-wide', body,
      actions: [{ id: 'close', label: 'Close' }, { id: 'play', label: st === 'collected' ? 'Practise again' : 'Play this one', cls: 'btn-primary' }],
      onClose: (v) => { if (v === 'play') ui.go('/play/' + f.id); else if (location.hash.startsWith('#/book/')) history.replaceState(null, '', '#/book'); }
    });
    return d;
  }

  FD.views.book = {
    title: 'Feature Book',
    render(main, ctx) {
      const lib = FD.lib, p = FD.store.profile(), reveal = FD.store.settings().unlockAll;
      const official = lib.features.filter((f) => !f.community);
      const have = official.filter((f) => FD.scoring.collected(p, f)).length;
      const spotted = official.filter((f) => !FD.scoring.collected(p, f) && p.collection[f.id] && p.collection[f.id].seen > 0).length;
      const master = FD.badges.masterStatus(p, lib);
      const f = { q: '', cat: 'all', diff: 'all', status: 'all' };

      main.innerHTML = flat(html`<div class="container hub">
        <header class="hub-head book-head">
          <div><p class="eyebrow">Your collection</p><h1>Feature Book</h1>
            <p class="lede">Every feature you solve lands here with what it does, why it matters and a prompt to try. ${reveal ? 'Facilitator mode is on, so the whole book is open.' : ''}</p></div>
          <div class="book-ring">${ui.ring(official.length ? (have / official.length) * 100 : 0, { size: 112, stroke: 12, color: 'green', label: `${have}/${official.length}`, sub: 'collected' })}</div>
        </header>
        <section class="card master-card" aria-labelledby="mast-h">
          <h2 id="mast-h">Feature Master status <small>${master.mastered} of ${master.total} categories mastered</small></h2>
          <ul class="master-list">${master.rows.map((r) => html`<li class="c-${r.category.color} ${r.master ? 'is-master' : ''}"><span class="m-ic" aria-hidden="true">${FD.icon(r.master ? 'crown' : r.category.icon || 'sparkle', { size: 20 })}</span><span class="m-name">${r.category.name}</span><span class="m-count">${r.have}/${r.total}</span>${ui.bar((r.have / r.total) * 100, r.category.color, r.category.name + ' progress')}</li>`)}</ul>
        </section>
        <form class="book-filters" role="search" aria-label="Filter the Feature Book">
          <div class="field grow"><label for="bk-q">Search</label><div class="search"><span aria-hidden="true">${FD.icon('search', { size: 18 })}</span><input id="bk-q" class="input" type="search" placeholder="Search collected features\u2026" autocomplete="off"></div></div>
          <div class="field"><label for="bk-cat">Category</label><select id="bk-cat" class="select"><option value="all">All</option>${lib.categories.filter((c) => lib.features.some((x) => x.category === c.name)).map((c) => html`<option>${c.name}</option>`)}</select></div>
          <div class="field"><label for="bk-diff">Difficulty</label><select id="bk-diff" class="select"><option value="all">All</option>${FD.config.difficulties.map((d) => html`<option>${d}</option>`)}</select></div>
          <div class="field"><label for="bk-st">Show</label><select id="bk-st" class="select"><option value="all">Everything</option><option value="collected">Collected</option><option value="spotted">Spotted</option><option value="locked">Not yet met</option></select></div>
        </form>
        <p class="muted" id="bk-count" aria-live="polite"></p>
        <ul class="fgrid" id="bk-grid"></ul>
      </div>`);

      const grid = $('#bk-grid', main);
      function draw() {
        const q = FD.match.norm(f.q);
        const list = lib.features.filter((x) => {
          if (f.cat !== 'all' && x.category !== f.cat) return false;
          if (f.diff !== 'all' && x.difficulty !== f.diff) return false;
          const st = statusOf(p, x, reveal);
          if (f.status === 'collected' && st !== 'collected') return false;
          if (f.status === 'spotted' && st !== 'spotted') return false;
          if (f.status === 'locked' && (st === 'collected' || st === 'spotted')) return false;
          if (q) { if (st === 'locked') return false; if (!FD.match.norm(x.name).includes(q) && !x.aliases.some((a) => FD.match.norm(a).includes(q))) return false; }
          return true;
        });
        mount(grid, list.map((x) => cardHtml(p, x, reveal)));
        $('#bk-count', main).textContent = `Showing ${list.length} of ${lib.features.length} features` + (spotted ? ` \u00B7 ${spotted} spotted` : '');
      }
      draw();
      $('.book-filters', main).addEventListener('submit', (e) => e.preventDefault());
      $('#bk-q', main).addEventListener('input', (e) => { f.q = e.target.value; draw(); });
      $('#bk-cat', main).addEventListener('change', (e) => { f.cat = e.target.value; draw(); });
      $('#bk-diff', main).addEventListener('change', (e) => { f.diff = e.target.value; draw(); });
      $('#bk-st', main).addEventListener('change', (e) => { f.status = e.target.value; draw(); });
      grid.addEventListener('click', (e) => { const b = e.target.closest('[data-fid]'); if (b) detail(lib.byId[b.dataset.fid], reveal); });
      if (ctx.params.id && lib.byId[ctx.params.id]) detail(lib.byId[ctx.params.id], reveal);
    }
  };
})();

(function () {

      metric: (p) => html`<strong>${p.maxStreak}</strong><small>${p.maxStreak === 1 ? 'day' : 'days'}</small>`, sub: (p) => `${p.totalScore} pts overall` },

      metric: (p) => html`<strong>${p.totalScore}</strong><small>pts</small>`, sub: (p) => `Best game: ${p.bestScore}` },
