","related":["m365-copilot-apis","agent-365"]},{"id":"data-access-governance-reports","name":"Data Access Governance Reports","aliases":["DAG reports","Data access governance","Oversharing reports","DAG"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["security","governance","files","admin"],"packs":["core"],"hints":["I\u0027m a torch, not a broom: I light up the mess rather than sweeping it.","I help admins find sites shared too widely, ideally before Copilot shows that content to more people.","Some of me are snapshots of one moment; others track the last 28 days of activity.","Admins can start a review from me by emailing site owners; I\u0027m the starting line, not the review.","In the SharePoint admin center\u0027s reporting menu, look for the entry with \u0027governance\u0027 in its name."],"description":"Reports in the SharePoint admin center that show which sites are shared widely or hold labelled content. Snapshots cover permissions and sensitivity labels; activity reports track sharing links and \u0027Everyone except external users\u0027 sharing over the last 28 days.","why":"Fixing oversharing before Copilot surfaces content to more people protects colleagues\u0027 private files. These reports show IT where sharing is too broad, so problems get sorted before a rollout, not after.","useCases":[{"title":"Pre-rollout oversharing sweep","text":"A council IT team runs the site permissions snapshot before a Copilot pilot to find sites with external guests or \u0027Everyone except external users\u0027 permissions."},{"title":"Check one person\u0027s reach","text":"A law firm\u0027s security analyst lists every site a departing contractor can reach, directly or through groups, before wrapping up their offboarding."},{"title":"Monthly sharing-links check","text":"A bank\u0027s compliance lead reviews the sharing links activity report each month to see which sites recently created the most Anyone links."}],"prompt":"I\u0027m a SharePoint admin planning a Copilot rollout. Explain how to use data access governance reports to find overshared sites, which snapshot and activity reports to run first and how often, and how to work through the results with site owners.","learnMore":"https://learn.microsoft.com/en-us/sharepoint/data-access-governance-reports","learnLabel":"Microsoft Learn: Data access governance reports","related":["site-access-review","sharepoint-advanced-management"]},{"id":"dspm-for-ai","name":"Data Security Posture Management","aliases":["DSPM","DSPM for AI","Purview DSPM","Data Security Posture Management for AI"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["security","governance"],"packs":["core"],"daily":false,"hints":["I\u0027m more of a health check for your data than a lock on it.","I show security teams where sensitive data lives, who can reach it and how well it\u0027s protected.","My objectives appear as selectable cards, each with a guided workflow and one-click policies.","My AI-only predecessor is now called \u0027classic\u0027; I cover the wider data estate too.","People shorten me to four letters, and the P stands for something a physio nags you about."],"description":"A Microsoft Purview solution where security teams see where sensitive data lives, who can access it and how well it\u0027s protected, including data used by Copilot and agents. It replaces \u0027DSPM for AI\u0027, which is now called classic.","why":"Before AI can be rolled out safely, security teams need to know where sensitive data sits and who can reach it. A guided, one-click workflow turns that insight into action.","useCases":[{"title":"Preventing exposure in Copilot","text":"A hospital security analyst picks the objective to prevent data exposure in Copilot interactions, then follows its guided workflow and one-click policies."},{"title":"Automating oversharing fixes","text":"A university IT security lead uses the oversharing objective to spot risky sharing and automate fixes such as removing public sharing links."},{"title":"Watching agent behaviour","text":"A bank\u0027s risk team uses the AI observability dashboards to watch agent activity for oversharing, exfiltration and unusual access patterns."}],"prompt":"I\u0027m a Microsoft 365 security admin planning our AI rollout. Using Microsoft Purview Data Security Posture Management, suggest which data security objectives to start with, what first-time setup to expect, and a weekly routine for reviewing oversharing and Copilot data-exposure risks.","learnMore":"https://learn.microsoft.com/en-us/purview/data-security-posture-management-learn-about","learnLabel":"Microsoft Learn: Data Security Posture Management","related":["purview-for-copilot","copilot-dashboard"]},{"id":"autonomous-agents-triggers","name":"Event Triggers","aliases":["Autonomous agents","Triggers","Autonomous triggers","Agentic triggers","Copilot Studio triggers"],"difficulty":"Expert","category":"Studio \u0026 Extensibility","tags":["automation","agents","studio"],"packs":["core","build"],"daily":false,"hints":["I\u0027m the doorbell that rings itself, so an agent never waits for a visitor.","I wake an agent when something happens, like a new SharePoint item or a finished Planner task.","My payload arrives as JSON or plain text, and the agent reads it like a message.","Don\u0027t confuse me with the phrases users type to launch a topic; I need no human input.","Add me from the Triggers section of an agent\u0027s Overview page in Copilot Studio."],"description":"A Copilot Studio capability that lets an agent start work by itself when something happens, such as a new SharePoint item, a completed Planner task or a timer, instead of waiting for someone to type. It needs generative orchestration turned on.","why":"Agents can go beyond answering chat questions and start handling routine work on their own, reacting to new items, files or schedules while people focus on other things.","useCases":[{"title":"Order intake","text":"When an order record changes in Dataverse, the agent checks the details, drafts a customer confirmation and flags anything unusual for the fulfilment team."},{"title":"New starter setup","text":"When HR adds a new starter to a SharePoint list, the agent creates onboarding tasks in Planner and drafts a welcome email for their manager."},{"title":"Recurring finance check","text":"A timer wakes the agent on a schedule to find overdue invoices and email the finance team a short summary of what still needs chasing."}],"prompt":"I\u0027m building a Copilot Studio agent that should start by itself when a new item is added to our SharePoint \u0027Support Requests\u0027 list. Help me plan the trigger, what instructions to put in the payload, and which actions the agent should call.","learnMore":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-triggers-about","learnLabel":"Microsoft Learn: Event triggers overview","related":["agent-flows","autopilot-scout","copilot-studio-github-copilot-harness"]},{"id":"copilot-studio-knowledge-sources","name":"Knowledge Sources","aliases":["Knowledge","Agent knowledge","Copilot Studio knowledge","Generative answers","Knowledge source"],"difficulty":"Hard","category":"Studio \u0026 Extensibility","tags":["knowledge","studio","builders"],"packs":["core","build"],"daily":false,"hints":["I\u0027m the bookshelf an agent checks before it answers.","I let makers ground an agent\u0027s replies in company data and chosen websites.","My authenticated kinds only surface what the person asking is allowed to see.","I include public websites, uploaded documents, SharePoint, Dataverse and content from Copilot connectors.","In Copilot Studio, an agent\u0027s \u0027Knowledge\u0027 page is where makers add me."],"description":"The enterprise data and websites a Copilot Studio agent searches to ground its answers, including public sites, uploaded documents, SharePoint, Dataverse and Copilot connectors. Authenticated sources only return content the person asking is allowed to access.","why":"Answers come from material your team picks, and signed-in users only see what they\u0027re already allowed to access, so agents stay useful without oversharing.","useCases":[{"title":"Policy answers","text":"An HR agent answers leave and expenses questions from policy documents on SharePoint, so staff get consistent answers without emailing the People team."},{"title":"Approved websites only","text":"A support agent searches only the company\u0027s own help-centre pages, so customers get answers from approved public sites rather than the whole web."},{"title":"Equipment lookup","text":"A field-service agent answers technicians\u0027 questions using equipment records stored in Dataverse, so they don\u0027t have to call the back office."}],"prompt":"I\u0027m building an HR agent in Copilot Studio. Which knowledge sources should I add so it answers only from our SharePoint policies and approved public websites, and how do I make sure each person\u0027s permissions are respected?","learnMore":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-copilot-studio","learnLabel":"Microsoft Learn: Knowledge sources summary","related":["copilot-connectors","agent-builder","microsoft-iq"]},{"id":"frontier-program","name":"Frontier Program","aliases":["Frontier","Microsoft Frontier","Microsoft Frontier Program","Copilot Frontier","Frontier programme"],"difficulty":"Hard","category":"Adoption \u0026 Learning","tags":["adoption","learning"],"packs":["core"],"introduced":"2025-03","daily":false,"hints":["I\u0027m not a feature you use, but a door your IT team chooses to open.","I give organisations early looks at new Microsoft 365 and Copilot capabilities, before general availability.","I\u0027m one of three release audiences, alongside Standard release and Deferred release.","My admin switch defaults to \u0027No access\u0027 and can target everyone or specific users and groups.","Agents I preview carry \u0027(Frontier)\u0027 after their names in the Agent Store."],"description":"Microsoft\u0027s opt-in early-access programme that lets organisations try new Microsoft 365 and Copilot capabilities, including experimental agents, as previews before general availability. IT admins choose which users get which features and agents.","why":"Teams can try emerging features early and plan ahead, while IT stays in control of who gets what and everyone else carries on as normal.","useCases":[{"title":"Pilot group trial","text":"An IT admin switches access on for a small pilot group only, so selected colleagues can test new agents while everyone else carries on as usual."},{"title":"Champions go first","text":"An adoption lead asks IT to enrol Copilot champions, who try preview agents from the Agent Store and report back on what works before a wider rollout."},{"title":"Review before enabling","text":"A security officer reads the preview terms first and notes that AI providers are never switched on automatically: each model needs separate approval in the admin centre."}],"prompt":"We\u0027re planning a pilot of Microsoft\u0027s Frontier early-access features. Draft a one-page plan for our IT admin covering who should be in the pilot group, what to tell them about preview terms and support, and how we\u0027ll decide whether to widen access.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/get-started-frontier?view=o365-worldwide","learnLabel":"Microsoft Learn: Frontier program","related":["agent-store","copilot-cowork","autopilot-scout"]},{"id":"copilot-cowork","name":"Copilot Cowork","aliases":["Cowork","Microsoft Copilot Cowork","Cowork mode","Co-work"],"difficulty":"Medium","category":"Agents","tags":["agents","automation","wave"],"packs":["core","wave-3"],"introduced":"2026-03","hints":["I\u0027m not for quick questions: I\u0027m the colleague you hand a whole task to.","Describe the outcome you want and I turn it into a plan, then work through the steps.","I pause for your go-ahead before important actions, like sending an email.","I\u0027m not Anthropic\u0027s own product, though Microsoft brought the technology behind it into Copilot.","Pick \u0027Cowork\u0027 in the Copilot app; my sessions are listed under Tasks."],"description":"An agentic mode of Microsoft Copilot that takes an outcome you describe, plans it and carries out the multi-step work across Microsoft 365, such as emails, meetings, documents and Teams posts, pausing for your approval before sensitive actions.","why":"You can hand off time-consuming, multi-step admin and stay in control: watch each step, pause or cancel, and approve important actions before they happen.","useCases":[{"title":"Client meeting prep","text":"Before a client call, it gathers recent emails, meetings and files, then drafts a one-page Word brief saved to OneDrive."},{"title":"Interview scheduling","text":"A recruiter asks it to find slots for three interviews and draft the invitations, then approves the emails before anything is sent."},{"title":"Scheduled weekly report","text":"Every Friday, a scheduled prompt compiles the week\u0027s project updates from emails and Teams into a short report for the leadership team."}],"prompt":"Prepare me for tomorrow\u0027s 10am call with Contoso: summarise our recent emails and meetings, list open actions, and save a one-page brief in Word to OneDrive. Then draft an email to the team asking for any last updates, and check with me before sending.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/cowork/","learnLabel":"Microsoft Learn: Copilot Cowork","related":["autopilot-scout","researcher","copilot-studio"]},{"id":"autopilot-scout","name":"Autopilot","aliases":["Microsoft Scout","Scout","Autopilots","Autopilot agent"],"difficulty":"Hard","category":"Agents","tags":["agents","automation","build"],"packs":["core","build"],"introduced":"2026-06","daily":false,"hints":["I\u0027m the teammate who never clocks off and never needs a nudge.","Give me a name, role and goal and I\u0027ll watch channels and follow up on threads.","I work under my own governed Entra identity, not a shared, anonymous service account.","Colleagues can @mention me in Teams and Outlook, just as they would a person.","Microsoft unveiled me at Build 2026 as \u0027Scout\u0027; I\u0027ve since been renamed."],"description":"Microsoft\u0027s always-on \u0027digital teammate\u0027 agent for Microsoft 365, previously called Scout. You give it a name, a role and a goal, and it works in the background under its own governed identity. Currently in preview.","why":"Routine follow-ups, monitoring and recurring tasks can carry on in the background without someone prompting each step, while sensitive actions can still require human sign-off.","useCases":[{"title":"Channel follow-ups","text":"It keeps an eye on a project channel and follows up on unanswered threads, so questions don\u0027t stall while the team is busy."},{"title":"Morning inbox sweep","text":"Each morning it reviews a shared Outlook inbox for new supplier queries and posts a short summary of what needs attention to the finance team\u0027s Teams channel."},{"title":"Ask it in Teams","text":"A sales manager @mentions it in Teams with a request; it works under its own governed identity and can ask for sign-off on sensitive actions."}],"prompt":"Your name is Riley, a project coordinator agent. Your goal is to keep the Apollo launch on track: watch the project channel, follow up on unanswered questions, and send me a short summary each morning. Ask me before sending anything externally.","learnMore":"https://learn.microsoft.com/en-us/microsoft-scout/overview","learnLabel":"Microsoft Learn: Microsoft Scout (Frontier) overview","related":["copilot-cowork","autonomous-agents-triggers"]},{"id":"copilot-studio-github-copilot-harness","name":"GitHub Copilot Harness","aliases":["Harness","Copilot harness","Copilot Studio harness","Harnesses in Copilot Studio","Agents powered by the GitHub Copilot harness"],"difficulty":"Expert","category":"Studio \u0026 Extensibility","tags":["studio","agents","builders"],"packs":["core","build"],"daily":false,"hints":["I\u0027m the reins, not the horse: I steer a model without being one.","Give me a goal and I break it into steps, calling tools and adjusting when one fails.","I natively create and edit Word, Excel, PowerPoint and PDF files as part of the work.","Copilot Studio has three of my kind; the other two are Customer Conversation and standard.","I\u0027m the Copilot Studio runtime that shares underlying technology with GitHub Copilot."],"description":"A Copilot Studio runtime for reasoning-heavy agents and workflows. It takes a goal, plans the steps, calls tools across connectors, knowledge and MCP servers, creates Word, Excel, PowerPoint and PDF files, and runs each task in a secure sandbox.","why":"Makers can build agents that handle multi-step business work, like reading invoices, matching purchase orders and routing exceptions for approval, without scripting every step.","useCases":[{"title":"Invoice processing","text":"An agent reads supplier invoices, matches them to purchase orders and routes any exceptions to an approver, adjusting when a step fails."},{"title":"Weekly report pack","text":"A maker\u0027s agent gathers sales figures from connected systems and creates an Excel workbook and a PowerPoint summary ready for Monday\u0027s leadership meeting."},{"title":"Shared team skills","text":"A compliance team packages its contract-review checklist as a skill and adds it to several agents, so each one follows the same instructions."}],"prompt":"I\u0027m a Copilot Studio maker. Help me decide whether my accounts payable agent should run on the GitHub Copilot harness or the standard harness, and list the tools, skills and approval steps I\u0027d set up for invoice matching.","learnMore":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/harnesses-overview","learnLabel":"Microsoft Learn: Harnesses in Copilot Studio","related":["copilot-studio","agent-flows","autonomous-agents-triggers"]},{"id":"microsoft-iq","name":"Microsoft IQ","aliases":["IQ","Microsoft IQ family","IQ platform","IQ family"],"difficulty":"Hard","category":"Studio \u0026 Extensibility","tags":["knowledge","data","developers","build"],"packs":["core","build"],"introduced":"2026-06","daily":false,"hints":["I\u0027m a family whose members all share one surname.","I\u0027m a shared foundation of organisational context that agents can reuse wherever they run.","My four layers cover how people work, live business state, curated know-how and fresh web.","Developers can reuse me across GitHub Copilot, Microsoft Foundry and Copilot Studio agents.","The \u0027IQ\u0027 in my name is branding for context layers, not a score or a model."],"description":"Microsoft\u0027s umbrella for the shared intelligence layer behind its agents. It brings together Work IQ (how people work), Fabric IQ (the live state of the business), Foundry IQ (curated knowledge) and Web IQ (fresh web grounding).","why":"Developers can build agents once and reuse the same trusted company context wherever those agents run, instead of wiring up data and knowledge separately every time.","useCases":[{"title":"Build once, reuse","text":"A developer reuses the same organisational context across agents built for GitHub Copilot, Microsoft Foundry and Copilot Studio, rather than rebuilding it for each."},{"title":"Grounded business answers","text":"A retail manager asks Copilot about store performance, and the answer can be grounded in the company\u0027s own Power BI semantic models through Fabric IQ."},{"title":"Shared policy library","text":"A compliance team shares one curated knowledge base of policies across several agents, honouring sensitivity labels and running queries under each caller\u0027s identity."}],"prompt":"I\u0027m designing an agent for our finance team. Explain how the four Microsoft IQ layers (Work IQ, Fabric IQ, Foundry IQ and Web IQ) could each ground its answers, and which ones we\u0027d need first for a pilot.","learnMore":"https://learn.microsoft.com/en-us/microsoft-iq/","learnLabel":"Microsoft Learn: Microsoft IQ documentation","related":["work-iq","copilot-connectors","copilot-studio-knowledge-sources"]},{"id":"enterprise-data-protection","name":"Enterprise Data Protection","aliases":["EDP","Copilot data protection","Commercial Data Protection","Enterprise Data Protection for Copilot Chat"],"difficulty":"Hard","category":"Security \u0026 Admin","tags":["privacy","security","essentials"],"packs":["core"],"hints":["I\u0027m a promise, not a switch, so there\u0027s no button to hunt for.","I make sure your prompts and Copilot\u0027s replies aren\u0027t used to train foundation models.","I give prompts and replies the same contract terms customers trust for Exchange email and SharePoint files.","I\u0027m not Purview, though I say Copilot inherits sensitivity labels and applies retention policies.","My short form is three letters, and the last one stands for \u0027protection\u0027."],"description":"Microsoft\u0027s name for the controls and contractual commitments covering prompts, responses and Microsoft Graph data when organisations use Copilot or Copilot Chat. Microsoft acts as data processor, and that content isn\u0027t used to train foundation models.","why":"Colleagues can use Copilot on real work knowing their prompts and answers aren\u0027t used to train AI models. IT and legal teams get a clear, contract-backed answer to \u0027is this okay to use?\u0027","useCases":[{"title":"Board paper polish","text":"A finance manager asks Copilot Chat to tighten a draft board paper, knowing prompts and replies aren\u0027t used to train models."},{"title":"Hospital privacy review","text":"A hospital privacy officer confirms HIPAA support applies to properly configured Copilot use, and warns staff that web search queries fall outside that coverage."},{"title":"Vendor risk review","text":"A council\u0027s IT security lead gathers evidence for a vendor risk review: encryption, tenant isolation, and named commitments such as GDPR and ISO/IEC 27018."}],"prompt":"Draft a one-page staff briefing on enterprise data protection for Copilot Chat: what the Data Protection Addendum covers, how web search queries are handled differently, and what people should still be careful about typing in.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/enterprise-data-protection","learnLabel":"Microsoft Learn: Enterprise data protection"},{"id":"copilot-actions","name":"Copilot Actions","aliases":["Actions","Copilot Action","Microsoft 365 Copilot Actions","M365 Copilot Actions"],"difficulty":"Hard","category":"Copilot Chat","tags":["automation","chat"],"packs":["core"],"introduced":"2024-11","daily":false,"hints":["I\u0027m the slow cooker of prompts: fill in the blanks, then walk away.","I was made for repeat jobs rather than one-off questions.","My showcase jobs: a daily to-do summary, weekly newsletter input, recurring customer-meeting prep.","I was announced at Ignite in November 2024, in private preview, for Microsoft 365 Copilot.","My name ends in \u0027Actions\u0027; Scheduled prompts and Cowork now cover similar ground."],"description":"Announced in private preview at Microsoft Ignite in November 2024 for Microsoft 365 Copilot at work: set-and-forget prompts with blanks to fill in, like a daily summary of action items. Scheduled prompts and Cowork now cover similar ground.","why":"Recurring chores shouldn\u0027t mean retyping the same prompt. Scheduled prompts, today\u0027s nearest equivalent, run your saved prompts on a schedule and drop the results into Chats.","useCases":[{"title":"Daily to-do round-up","text":"A project manager sets up a daily summary of open action items, so the team starts each morning knowing who owes what."},{"title":"Newsletter input gathering","text":"A council communications officer sets up a repeating prompt that gathers team inputs for the weekly staff newsletter, instead of chasing everyone by hand."},{"title":"Customer-meeting prep","text":"An account manager reuses one fill-in-the-blank prompt to prepare for each recurring customer meeting, swapping in just the customer\u0027s name."}],"prompt":"Summarise the action items assigned to me across yesterday\u0027s meetings, chats and email, group them by due date and flag anything overdue.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/schedule-your-most-used-copilot-prompts","learnLabel":"Microsoft Support: Scheduled prompts (closest today)","related":["copilot-cowork"]},{"id":"copilot-vision","name":"Copilot Vision","aliases":["Vision","Vision in Microsoft Copilot","Vision in Microsoft 365 Copilot","Microsoft Copilot Vision","M365 Copilot Vision"],"difficulty":"Medium","category":"Devices \u0026 Mobile","tags":["vision","mobile","windows"],"packs":["core"],"hints":["I\u0027m not Recall: every session starts fresh, with only what you show me right now.","I\u0027m a second pair of eyes that talks you through whatever you show me.","I may highlight things on screen, but I never click, type or scroll for you.","I only switch on while you\u0027re talking out loud with Copilot.","Share your screen or phone camera and ask what Copilot sees: I\u0027m its sense of sight."],"description":"Lets Copilot see what you share during a voice conversation: your desktop screen or your phone\u0027s camera. It explains what it sees and guides you step by step, but never clicks, types or scrolls for you.","why":"Instead of typing out a long description of a tricky screen or object, you show Copilot and get step-by-step help in the moment.","useCases":[{"title":"Demystify a dashboard","text":"A finance analyst shares a dense dashboard on screen and asks Copilot to explain what each chart shows and which figures to check first."},{"title":"New-starter walk-through","text":"A new starter shares their screen and asks Copilot to talk them through submitting an expense claim, one step at a time."},{"title":"Point your phone camera","text":"A facilities technician points a phone camera at an unfamiliar control panel and asks Copilot what each label and switch is for."}],"prompt":"Look at the expense claim form on my screen and talk me through each section, one step at a time. Tell me if anything looks like it\u0027s missing.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-vision-microsoft-365-copilot","learnLabel":"Microsoft Support: Get started with Vision","related":["copilot-voice","copilot-mobile-app"]},{"id":"copilot-voice","name":"Copilot Voice","aliases":["Voice","Voice chat","Voice in Microsoft Copilot","Microsoft Copilot Voice","Chat with Copilot using your voice"],"difficulty":"Medium","category":"Devices \u0026 Mobile","tags":["voice","mobile"],"packs":["core"],"hints":["I\u0027m the chat you can have with your hands full.","I\u0027m handy for brainstorming, preparing for the day or a bit of coaching.","When we finish, a text transcript of our conversation is waiting.","Dictation and read aloud are my siblings, but only I hold a two-way conversation.","Select the voice icon in the message box, allow your microphone, and Copilot greets you out loud."],"description":"A real-time spoken conversation with Copilot: you talk, it answers out loud, hands free. It sits alongside dictation (speak instead of typing) and read aloud, and leaves a text transcript when the conversation ends.","why":"Sometimes talking is faster than typing. You can brainstorm, prepare for the day or get coaching hands free, and still have a written transcript afterwards.","useCases":[{"title":"Prepare for the day","text":"A sales manager talks through the day\u0027s priorities and gets Copilot to suggest, out loud, what to tackle first and what to delegate."},{"title":"Brainstorm hands free","text":"A teacher brainstorms lesson activities with Copilot out loud while setting up the classroom, then skims the text transcript afterwards."},{"title":"Rehearse a pitch","text":"A graduate analyst rehearses a client pitch aloud, gets spoken coaching from Copilot, and interrupts to try a different angle."}],"prompt":"Help me plan my day. I have a team meeting at ten, a client call at two and a report due by five. Ask me questions, then suggest an order for my tasks.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-voice-features-in-microsoft-365-copilot","learnLabel":"Microsoft Support: Voice features in Microsoft 365 Copilot","related":["copilot-vision","copilot-mobile-app"]},{"id":"copilot-app","name":"Microsoft Copilot App","aliases":["Microsoft 365 Copilot app","Copilot app","M365 Copilot app","Office app","Microsoft 365 app"],"difficulty":"Easy","category":"Copilot Chat","tags":["chat","essentials"],"packs":["core"],"daily":false,"hints":["I\u0027m a front door, not a room.","One place to chat, search, create and delegate bigger jobs.","A waffle menu in my navigation launches Outlook, Word, Excel, PowerPoint and Teams.","My name recently lost its \u0027365\u0027.","Install me on Windows, Mac, iOS or Android, or open me on the web: Copilot\u0027s own app."],"description":"Microsoft\u0027s unified front door to Copilot on Windows, Mac, web, iOS and Android, formerly the Microsoft 365 Copilot app. Sign in with a work or personal account to chat, search, use agents, create files and delegate multistep jobs to Cowork.","why":"One familiar starting point for Copilot, whether you\u0027re signed in for work or at home. Your chats, creations and agents live in one place, and work and personal accounts stay separate.","useCases":[{"title":"New hire\u0027s starting point","text":"A new hire signs in with their work account and finds chat, search, agents and a launcher for Word, Excel and PowerPoint all in one place."},{"title":"Delegate multistep jobs","text":"A project coordinator hands a multistep job to Cowork from the navigation pane, then returns later to review the finished to-dos."},{"title":"Work versus personal","text":"A consultant using both a work and a personal account checks the Work or Personal label beside their profile, knowing the two stay separate."}],"prompt":"Summarise what changed on the Contoso renewal this week from my emails and meetings, then create a one-page Word briefing I can share with my team.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/what-is-microsoft-copilot-app","learnLabel":"Microsoft Support: What is the Microsoft Copilot app?","related":["copilot-chat","copilot-in-edge","copilot-mobile-app"]},{"id":"copilot-in-word","name":"Copilot in Word","aliases":["Word Copilot","Copilot Word","Word","Copilot for Word","Microsoft Word Copilot"],"difficulty":"Easy","category":"Microsoft 365 Apps","tags":["creation","essentials"],"packs":["core","wave-3"],"introduced":"2023-03","hints":["I turn \u0027where do I even start?\u0027 into a first draft.","I can start from files you already have: type a slash and pick one.","Select text, pick Copilot on the mini toolbar, and Auto Rewrite offers Replace, Insert below or Regenerate.","I open as a pane from a Copilot button at the bottom-right of the window.","I\u0027m Copilot, inside the app named for what sentences are made of."],"description":"Copilot built into Word: describe a document and it drafts it, reuse your existing files, rewrite selected text, or ask it to edit the document in place. It can add citations, turn text into tables, and respects sensitivity labels.","why":"The blank page is the slowest part of writing. Copilot gives you a first draft built from files you already have, so you spend your time refining and checking rather than starting from scratch.","useCases":[{"title":"Invoice from a PO","text":"An accounts officer points Copilot at a purchase-order PDF and asks it to fill in an invoice, then checks the figures before sending."},{"title":"Update a regulatory package","text":"A compliance analyst asks Copilot to update last year\u0027s regulatory package using this year\u0027s source files, then reviews each change it makes."},{"title":"Polish a policy draft","text":"An HR manager selects a dense paragraph in a draft policy and uses Auto Rewrite to make it clearer, choosing whether to replace or insert below."}],"prompt":"Draft a two-page onboarding guide for new customer-support staff. Reuse the structure and headings of our existing support handbook, add a first-week checklist and keep the tone friendly.","learnMore":"https://support.microsoft.com/en-us/word/copilot/draft-and-add-content-with-copilot-in-word","learnLabel":"Microsoft Support: Draft and add content with Copilot in Word","related":["agent-mode-office-agent","copilot-pages"]},{"id":"copilot-in-powerpoint","name":"Copilot in PowerPoint","aliases":["PowerPoint Copilot","Copilot PowerPoint","PowerPoint","PPT Copilot","Copilot for PowerPoint"],"difficulty":"Easy","category":"Microsoft 365 Apps","tags":["creation","essentials"],"packs":["core","wave-3"],"introduced":"2023-03","hints":["Hand me a prompt or a document and I\u0027ll hand back a first draft deck.","I add slides, rewrite text, generate images and summarise what\u0027s already there.","Choose a brand and I\u0027ll keep new slides on-brand.","I open as a chat from an icon at the bottom-right of the window.","I\u0027m Copilot in the slide-deck app with \u0027Power\u0027 in its name."],"description":"Copilot inside PowerPoint: ask it to create a presentation from a prompt or file, add slides, rewrite text, generate images or summarise. It can use your Brand Kit to stay on brand and may ask clarifying questions before it builds.","why":"Building a deck from scratch takes time. Copilot drafts a first version from your prompt or documents and keeps it on-brand, leaving you to shape the story.","useCases":[{"title":"Proposal to client deck","text":"A consultant points Copilot at a Word proposal and asks for a ten-slide client deck, then edits the first draft rather than starting blank."},{"title":"Stay on brand","text":"A marketing coordinator selects the company brand so Copilot builds slides that stay on brand, instead of fixing each one by hand."},{"title":"Summarise an inherited deck","text":"A training lead asks Copilot to summarise an inherited 60-slide deck into its key messages before updating it for the new cohort."}],"prompt":"Create a presentation from my Q3 sales summary document: ten slides for our quarterly business review, in our company brand, opening with a one-slide headline. Ask me anything you need before you start.","learnMore":"https://support.microsoft.com/en-us/powerpoint/edit-with-copilot-in-powerpoint","learnLabel":"Microsoft Support: Edit with Copilot in PowerPoint","related":["powerpoint-narrative-builder","agent-mode-office-agent","copilot-create"]},{"id":"powerpoint-narrative-builder","name":"Narrative Builder","aliases":["Narrative builder in PowerPoint","PowerPoint Narrative Builder","Copilot Narrative Builder","Narrative builder in Microsoft PowerPoint"],"difficulty":"Hard","category":"Microsoft 365 Apps","tags":["creation"],"packs":["core","wave-2"],"introduced":"2024-09","hints":["I was the sketch you could scribble on before a single slide got drawn.","My launch post said no one goes from an idea to a polished presentation in one prompt.","I showed an outline of topics to edit and refine before the first draft existed.","I was announced in September 2024 as generally available, alongside a companion called Brand manager.","I was PowerPoint\u0027s outline-first idea, and my name starts with \u0027Narrative\u0027."],"description":"Announced as generally available in Copilot in PowerPoint in September 2024: type a prompt, edit and refine an outline of topics, then Copilot drafts the first deck. Today\u0027s PowerPoint help talks about creating from a prompt or file instead.","why":"Great decks start with a clear storyline. Agreeing the outline first meant you steered the structure early, instead of untangling a finished first draft afterwards.","useCases":[{"title":"Outline before slides","text":"A sales director typed a prompt for a client pitch, then reordered and trimmed the proposed topics before Copilot drafted any slides."},{"title":"Refine the storyline","text":"A programme manager refined the topic outline until the storyline felt right, then let Copilot draft the first version of the deck."},{"title":"On-brand first draft","text":"A communications lead used the companion Brand manager so the first draft followed the company\u0027s branded template, rather than a generic theme."}],"prompt":"Create a presentation on our new customer onboarding process for the leadership team. Start with an outline of the main topics so I can edit and reorder them before you draft any slides.","learnMore":"https://www.microsoft.com/en-us/copilot/blog/2024/09/16/microsoft-365-copilot-wave-2-pages-python-in-excel-and-agents/","learnLabel":"Microsoft Copilot blog: Wave 2 (Sept 2024)","related":["copilot-in-powerpoint","copilot-create"]},{"id":"copilot-in-excel","name":"Copilot in Excel","aliases":["Excel Copilot","Copilot Excel","Excel","Copilot for Excel","Microsoft Excel Copilot"],"difficulty":"Easy","category":"Microsoft 365 Apps","tags":["data","analysis","essentials"],"packs":["core","wave-2","wave-3"],"introduced":"2023-03","hints":["I borrow the tools you already use, so what I leave behind stays editable.","Describe what you want and I\u0027ll add formulas, charts and PivotTables.","I have three modes: edit while you watch, plan first, or just chat without touching anything.","I\u0027m a pane you open from the lower-right corner, not a formula you type into a cell.","I\u0027m Copilot, inside the spreadsheet app named for being exceptionally good at something."],"description":"Copilot inside Excel builds and edits workbooks from plain-English requests, using tables, charts, PivotTables and formulas. Edit mode works on the sheet while you watch, plan mode shows a plan first, and chat mode only analyses.","why":"Not everyone is a spreadsheet expert. Copilot turns a plain request into formulas, charts and PivotTables that stay fully editable, so you can analyse data quickly and still check the workings.","useCases":[{"title":"Tidy a messy export","text":"A finance analyst asks Copilot to tidy a messy ledger export and add a variance column, then reviews the changes it made."},{"title":"PivotTable on request","text":"A sales manager asks for a PivotTable and chart of revenue by region and quarter, and Copilot builds both with links back to the source data."},{"title":"Plan before it edits","text":"An HR analyst uses plan mode on a headcount workbook, reads Copilot\u0027s proposed steps and approves them before anything in the file changes."}],"prompt":"Using the Sales table, create a PivotTable showing revenue by region and quarter, add a column chart beside it, and highlight any region that fell more than 10% quarter on quarter.","learnMore":"https://support.microsoft.com/en-us/excel/copilot/get-started-with-copilot-in-excel","learnLabel":"Microsoft Support: Get started with Copilot in Excel","related":["agent-mode-office-agent"]},{"id":"agent-mode-office-agent","name":"Edit with Copilot","aliases":["Agent Mode","Office Agent","Vibe working","Word, Excel and PowerPoint Agents","Excel Agent"],"difficulty":"Medium","category":"Microsoft 365 Apps","tags":["creation","agents"],"packs":["core","wave-3"],"introduced":"2025-09","daily":false,"hints":["My launch slogan nodded to a trend that had already transformed software development.","Give me a simple prompt and I\u0027ll handle the multi-step work while you steer.","In Excel I use tables, charts, PivotTables and formulas, and I keep checking until the outcome is verified.","Microsoft retired my preview name because, it said, I\u0027m not a separate mode at all.","My chat cousins create new files; I\u0027m the one that will edit the file you already have open."],"description":"Copilot makes multi-step changes inside your open Word, Excel or PowerPoint file and lets you review what changed; in chat, its Word, Excel and PowerPoint Agents ask questions, then build and save a new file to OneDrive. Formerly Agent Mode and Office Agent.","why":"Describe the result you want and let Copilot do the fiddly formatting, formulas and layout work, so you spend your time steering and checking instead of building every step by hand.","useCases":[{"title":"Variance workbook","text":"A finance analyst asks Copilot to turn raw ledger data into a table, PivotTable and chart of budget versus actual, then reviews what changed."},{"title":"Policy refresh","text":"An HR advisor opens last year\u0027s leave policy in Word and asks Copilot to restructure it into plain-English sections, then reads the summary of changes."},{"title":"Pitch deck from chat","text":"A sales lead asks the PowerPoint Agent in chat for a customer pitch deck; it asks clarifying questions, builds the file and saves it to OneDrive."}],"prompt":"In this workbook, turn the raw sales data on the Data sheet into a table, add a PivotTable of revenue by region and month, chart the top five regions, and summarise what you changed so I can review it.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/wordexcelppt-agents","learnLabel":"Microsoft Learn: Word, Excel and PowerPoint Agents","related":["copilot-wave-3"]},{"id":"copilot-wave-2","name":"Copilot Wave 2","aliases":["Wave 2","Microsoft 365 Copilot Wave 2","M365 Copilot Wave 2"],"difficulty":"Hard","category":"Adoption \u0026 Learning","tags":["wave","learning"],"packs":["core","wave-2"],"introduced":"2024-09","hints":["I\u0027m a label, not a product: nothing to install and nothing to switch on.","My opening line framed \u0027web + work + Pages\u0027 as a new design system for knowledge work.","My announcement post carried a banner: Business Chat is now Microsoft 365 Copilot Chat.","A spring 2025 follow-up shared my label, so it\u0027s easy to confuse us.","Announced 16 September 2024 as \u0027Pages, Python in Excel, and agents\u0027, I\u0027m the one numbered two."],"description":"Microsoft\u0027s 16 September 2024 bundle of Copilot announcements: Copilot Pages, upgrades across the Microsoft 365 apps (such as Copilot in Excel going generally available) and Copilot agents with an agent builder. The theme was web + work + Pages.","why":"Pages, agent building and the Copilot Chat name were all announced here, so knowing it helps champions explain where many Copilot features came from.","useCases":[{"title":"Champion kickoff briefing","text":"A Copilot champion revisits the September 2024 announcement to explain to new staff where Pages, agents and Copilot Chat came from, in plain English."},{"title":"Release-history review","text":"An IT lead builds a timeline of what shipped when, separating generally available items from previews announced alongside, such as Python in Excel and Prioritize my inbox."},{"title":"Learning path refresh","text":"A trainer turns the announcement\u0027s Excel, PowerPoint and Outlook upgrades into short practice exercises and adds them to the team\u0027s Copilot learning path."}],"prompt":"Summarise what Microsoft announced for Microsoft 365 Copilot on 16 September 2024 (Wave 2): Pages, Excel and PowerPoint upgrades, Outlook and agents. Then build a one-page briefing for our champions on what each item means for our teams today.","learnMore":"https://www.microsoft.com/en-us/copilot/blog/2024/09/16/microsoft-365-copilot-wave-2-pages-python-in-excel-and-agents/","learnLabel":"Microsoft Copilot blog: Wave 2 announcement","related":["wave-2-spring-release","copilot-wave-3"]},{"id":"wave-2-spring-release","name":"Wave 2 Spring Release","aliases":["Spring release","Copilot spring release 2025","Wave 2 spring","Microsoft 365 Copilot Wave 2 spring release"],"difficulty":"Expert","category":"Adoption \u0026 Learning","tags":["wave","learning"],"packs":["core","wave-2"],"introduced":"2025-04","hints":["I\u0027m the sequel that never earned a new number.","I came with an updated app \u0027designed to power the next era of human-agent collaboration\u0027.","One of my features turns your notes, documents and meeting recordings into a two-host podcast-style audio overview.","I rebuilt Microsoft\u0027s Copilot app around Search, Create, Notebooks and an Agent Store.","My name has \u0027spring\u0027 in it, and Researcher and Analyst began early access with me in April 2025."],"description":"Microsoft\u0027s 23 April 2025 bundle of Copilot announcements, mostly rolling out from late May: an updated Copilot app built around Search, Create, Notebooks and an Agent Store, with Researcher and Analyst reasoning agents, memory and personalisation, and the Skills agent.","why":"Search, Create, Notebooks, the Agent Store and the Researcher and Analyst agents were all announced here, so knowing this release helps champions explain where features came from and avoid mixing it up with Wave 2.","useCases":[{"title":"Champion explainer session","text":"A Copilot champion explains what the April 2025 announcement promised: Search, Create, Notebooks and the Agent Store, so staff stop confusing it with the 2024 one."},{"title":"Trace the rollout path","text":"An IT lead reviews the April 2025 announcement to trace how Researcher and Analyst moved from the Frontier program to general availability for licensed users."},{"title":"Curriculum update","text":"A trainer rebuilds the Copilot curriculum around the app\u0027s four areas, Search, Create, Notebooks and agents, and adds a module on memory and personalisation."}],"prompt":"Summarise what Microsoft announced in the Microsoft 365 Copilot \u0027Wave 2 spring release\u0027 on 23 April 2025: Search, Create, Notebooks, the Agent Store, Researcher and Analyst. Then draft a short plan for teaching each one to our team.","learnMore":"https://www.microsoft.com/en-us/copilot/blog/2025/04/23/microsoft-365-copilot-built-for-the-era-of-human-agent-collaboration/","learnLabel":"Microsoft Copilot blog: Wave 2 spring release","related":["copilot-wave-2","copilot-wave-3"]},{"id":"copilot-wave-3","name":"Copilot Wave 3","aliases":["Wave 3","Microsoft 365 Copilot Wave 3","Frontier Transformation"],"difficulty":"Hard","category":"Adoption \u0026 Learning","tags":["wave","learning"],"packs":["core","wave-3"],"introduced":"2026-03","daily":false,"hints":["I\u0027m the moment Microsoft said it was moving \u0027beyond assistance\u0027.","I made chat \u0027the entry point for chat-first creation and execution\u0027.","Excel and Word came first; PowerPoint and Outlook were promised \u0027over the coming months\u0027.","One of my new arrivals can work for \u0027minutes or hours\u0027 and was built closely with Anthropic.","Announced 9 March 2026 alongside a Frontier Transformation event, I\u0027m the one numbered three."],"description":"Microsoft\u0027s 9 March 2026 bundle of Copilot announcements, moving beyond assistance to AI that acts inside your apps: Copilot Cowork, agentic Word, Excel, PowerPoint and Outlook, agents in chat, Claude alongside OpenAI models, plus Agent 365 and Microsoft 365 E7.","why":"Knowing what Wave 3 brought helps champions and IT leads plan training, governance and licensing for AI that does tasks for people, and makes sense of the names and features appearing since.","useCases":[{"title":"Rollout plan refresh","text":"A Copilot champion rebuilds the rollout plan around Cowork, agents in chat and in-app agentic editing, deciding which teams to pilot first."},{"title":"Release notes review","text":"An IT lead reads the March 2026 announcement and later release notes to see what needs admin attention, from Frontier access to Agent 365 and licensing."},{"title":"Training plan update","text":"A learning and development trainer updates the Copilot curriculum so staff learn Cowork, chat-first file creation and agent-assisted Word, Excel and PowerPoint, not just prompting basics."}],"prompt":"Summarise what Microsoft announced for Microsoft 365 Copilot on 9 March 2026 (Wave 3): Cowork, agentic Word, Excel, PowerPoint and Outlook, agents in chat, Claude and Agent 365. Then suggest how a champion should plan a phased rollout, in a table by audience.","learnMore":"https://www.microsoft.com/en-us/copilot/blog/2026/03/09/powering-frontier-transformation-with-copilot-and-agents/","learnLabel":"Microsoft Copilot blog: Wave 3 announcement","related":["copilot-wave-2","wave-2-spring-release","agent-mode-office-agent"]},{"id":"intelligent-call-delegation","name":"Intelligent Call Delegation","aliases":["Copilot Call Delegation","Call Delegation","Teams Call Delegation","Intelligent Call Delegation in Microsoft Teams"],"difficulty":"Hard","category":"Teams \u0026 Meetings","tags":["teams","agents","voice"],"packs":["core"],"daily":false,"hints":["I\u0027m not voicemail: I talk with whoever rings you and find out what they want.","I answer for just one person, screen who\u0027s ringing and escalate the urgent ones.","Callers see an avatar and hear that they\u0027re talking to an attendant, not a person.","I\u0027m the personal cousin of Teams Phone Agent, which answers for an organisation, not one person.","Find me in Teams settings under Calls, where you can delegate your incoming calls to an AI."],"description":"A Frontier-preview AI voice agent that answers your incoming Teams calls on your behalf. It screens callers, collects their reason for calling, then schedules a follow-up or escalates urgent calls to you.","why":"Unwanted interruptions break your focus, but missed calls leave people waiting. Screening and capturing the reason for each call lets you deal with the urgent ones first and step in whenever you choose.","useCases":[{"title":"Workshop day","text":"A consultant running back-to-back client workshops lets it screen external calls, collect each caller\u0027s reason and book callbacks, then reads the summaries in Call history afterwards."},{"title":"Out-of-office cover","text":"A finance manager on leave lets it take external calls, noting each reason and booking callbacks for after she returns."},{"title":"Step in when urgent","text":"An operations manager sees the screening banner, watches a live preview of the caller\u0027s reason, and picks up from Call history when it sounds urgent."}],"prompt":"Help me plan how to use Intelligent Call Delegation during a week of back-to-back workshops: which calls to screen, whether to turn on follow-ups, and what limits to warn my team about.","learnMore":"https://support.microsoft.com/en-us/teams/copilot/use-copilot-call-delegation-in-microsoft-teams","learnLabel":"Microsoft Support: Intelligent Call Delegation","related":["teams-phone-agent","copilot-in-teams-phone"]},{"id":"intelligent-recap","name":"Intelligent Recap","aliases":["Teams Intelligent Recap","AI notes in Teams","Intelligent meeting recap"],"difficulty":"Medium","category":"Teams \u0026 Meetings","tags":["meetings","teams"],"packs":["core"],"hints":["I\u0027m no person, yet I take the notes and suggest the homework.","I help you jump straight to the moments that matter to you.","My newer options include a podcast-style audio summary and narrated video highlights.","People mistake me for the tab I live in; I\u0027m the AI that fills it.","Put \u0027intelligent\u0027 in front of the after-meeting tab\u0027s name and you\u0027ve named me."],"description":"The AI layer on top of a Teams recap. It turns the transcript of a meeting, event or call into AI notes and recommended tasks, adds personal timeline markers and chapters, and offers newer audio and video options.","why":"Nobody has time to re-watch every meeting. AI notes, suggested tasks and markers for your own mentions get you to what matters, and what to do next, quickly.","useCases":[{"title":"Jump to your mentions","text":"A sales manager, mentioned twice in a long pipeline review, jumps to those timeline markers and reads the AI-recommended tasks before replying to the team."},{"title":"Follow up a call","text":"After a Teams call with a resident, a council officer opens the call recap for AI notes and recommended tasks, then checks them against what was promised."},{"title":"Watch the highlights","text":"A training coordinator who missed a recorded onboarding session watches its narrated video highlights first, then decides which parts of the full recording are worth the time."}],"prompt":"From the transcript of this morning\u0027s pipeline review, write brief notes in five bullets, list the follow-up tasks and who should do them, and flag anywhere I was mentioned.","learnMore":"https://learn.microsoft.com/en-us/microsoftteams/intelligent-recap-calls-meetings","learnLabel":"Microsoft Learn: Intelligent recap in Teams","related":["teams-meeting-recap","copilot-in-teams-meetings"]},{"id":"copilot-plus-pc","name":"Copilot+ PC","aliases":["Copilot Plus PC","Copilot+ PCs","Copilot Plus PCs","Copilot+"],"difficulty":"Medium","category":"Devices \u0026 Mobile","tags":["windows"],"packs":["core"],"introduced":"2024-05","hints":["I arrive in a box, not as a subscription.","I\u0027m built so AI work can happen on the device itself.","My defining spec is a chip capable of more than 40 trillion operations per second.","Newer Windows features like Recall and Click to Do ask for a chip at my level.","Microsoft announced this Windows 11 hardware class in May 2024, tacking a plus sign onto its assistant\u0027s name."],"description":"A class of Windows 11 laptops and tablets built around a powerful NPU (neural processing unit) that can perform more than 40 trillion operations per second, so AI features such as Recall and Click to Do can run on the device itself.","why":"Some Windows AI features analyse your screen on the device itself, so the processing stays local. Knowing which machines qualify helps you choose the right hardware for your team.","useCases":[{"title":"Choosing laptops for a team","text":"An IT buyer confirms new laptops meet the Copilot+ PC bar (a 40+ TOPS NPU) before promising staff on-device AI features like Click to Do."},{"title":"Testing on-device AI","text":"A developer tests an on-device AI feature on a Copilot+ PC, using Task Manager to watch NPU usage and Windows ML to run the model there."},{"title":"Pilot with teachers","text":"A school IT lead pilots a handful of Copilot+ PCs with teachers before deciding whether to refresh the wider laptop fleet."}],"prompt":"Help me plan a laptop refresh: explain what makes a PC a Copilot+ PC, which Windows AI features it unlocks, and give me a checklist of questions to ask suppliers before we order.","learnMore":"https://learn.microsoft.com/en-us/windows/ai/npu-devices/","learnLabel":"Microsoft Learn: Copilot+ PCs developer guide","related":["copilot-key","windows-recall","copilot-app-windows"]},{"id":"copilot-key","name":"Copilot Key","aliases":["Copilot button","Copilot keyboard key","Copilot hardware key","Copilot keyboard button"],"difficulty":"Easy","category":"Devices \u0026 Mobile","tags":["windows"],"packs":["core"],"introduced":"2024-01","hints":["I\u0027m the first significant change to the Windows PC typing layout in nearly three decades.","I\u0027m a hardware shortcut straight to Microsoft\u0027s AI assistant.","Tap me and the assistant opens; hold me down and its voice controller appears.","On some devices I took over the spot of the Right Ctrl or context-menu button.","No dedicated physical key on your keyboard? Windows key + C does the same job."],"description":"A dedicated key on many new Windows 11 keyboards that opens Microsoft Copilot with one press. A long press opens voice controls, you can change what it launches in Settings, and Windows key + C does the same on keyboards without one.","why":"It puts Copilot one press away, so a quick question or voice chat starts without hunting for an icon. And if you\u0027d rather it did something else, you can change what it launches.","useCases":[{"title":"Quick question mid-task","text":"A project manager presses the key mid-task, types a question into the smaller quick view and gets an answer without opening a browser tab."},{"title":"Voice chat while typing","text":"A support engineer holds the key to start a voice chat and talks through a troubleshooting checklist while still typing up the ticket."},{"title":"Managed laptop setup","text":"An IT admin uses the SetCopilotHardwareKey policy to choose which app the key launches on managed laptops."}],"prompt":"I just got a laptop with a Copilot key. Explain what a short press and a long press do, how I can change what the key launches in Settings, and a shortcut for keyboards without one.","learnMore":"https://support.microsoft.com/en-us/accessibility/windows/copilot/understand-updates-to-the-copilot-key-on-windows-devices","learnLabel":"Microsoft Support: Copilot key updates","related":["copilot-plus-pc","click-to-do","hey-copilot"]},{"id":"click-to-do","name":"Click to Do","aliases":["Click to Do in Recall","Click to Do in Windows","Windows Click to Do","Click-to-Do"],"difficulty":"Hard","category":"Devices \u0026 Mobile","tags":["windows"],"packs":["core"],"hints":["I only look at your screen once you invite me, and I stop when you leave.","I spot text and images on screen, then offer actions you can take on them.","My cursor turns blue and white, and changes shape to match whatever\u0027s underneath.","Recall keeps the timeline; I\u0027m the action layer that appears on top of its snapshots.","Hold the Windows key and give the screen a click; my name begins with that very action."],"description":"A Windows 11 feature on Copilot+ PCs that identifies text and images on your screen and offers actions for them, such as copy, search the web or summarise. The screen analysis always runs locally on your device.","why":"It turns whatever is on your screen into something you can act on right away, without copying between apps. The analysis itself stays on your device.","useCases":[{"title":"Message from the screen","text":"A recruiter spots a candidate\u0027s email address inside a PDF and starts a message from it, without copying it into another app first."},{"title":"Quick on-device summary","text":"A policy analyst selects a long passage in a web article and asks for a quick on-device summary before heading into a meeting."},{"title":"Quick photo clean-up","text":"A marketing coordinator spots a product image on screen and sends it to Paint to remove its background before reusing it."}],"prompt":"Explain the selected paragraph in plain English, then list any dates, owners or decisions it mentions.","learnMore":"https://support.microsoft.com/en-us/windows/ai/ai-features/click-to-do-do-more-with-what-s-on-your-screen","learnLabel":"Microsoft Support: Click to Do","related":["windows-recall","copilot-vision","copilot-key"]},{"id":"windows-recall","name":"Windows Recall","aliases":["Recall","Recall on Copilot+ PCs","Recall (preview)","Microsoft Recall"],"difficulty":"Hard","category":"Devices \u0026 Mobile","tags":["windows","privacy"],"packs":["core"],"daily":false,"hints":["I\u0027m a scrapbook of your screen, but I stay shut until you opt in.","Describe something you half-remember seeing, and I\u0027ll help you find your way back to it.","I save a snapshot every few seconds, and whenever the content of the active window changes.","I\u0027m a Windows 11 feature of Copilot+ PCs, not part of the Copilot app or Microsoft 365 Copilot.","Windows Hello must approve you before I open, and my name means to bring something back to mind."],"description":"An opt-in Windows 11 feature for Copilot+ PCs that saves encrypted snapshots of your screen on your device, so you can search a timeline by describing what you remember and jump back to it. Windows Hello must verify you first.","why":"Finding that page, chart or message you saw earlier no longer means remembering where it lived. Because it\u0027s opt-in and stays on the device, you stay in control of what\u0027s saved.","useCases":[{"title":"Find the lost chart","text":"An analyst remembers a chart in a presentation but not the file name, describes it in the search box and jumps back to that moment."},{"title":"IT policy decision","text":"An IT lead reads the Manage Recall guidance before deciding whether to allow it, since it\u0027s removed by default on managed commercial devices."},{"title":"Pause for sensitive work","text":"A consultant chooses Pause until tomorrow before reviewing confidential client files; snapshots resume automatically at midnight."}],"prompt":"Explain how Recall works on Copilot+ PCs, what it saves, how to pause it or filter apps and websites, and what an IT admin needs to know before allowing it on managed devices.","learnMore":"https://support.microsoft.com/en-us/windows/ai/ai-features/retrace-your-steps-with-recall","learnLabel":"Microsoft Support: Retrace your steps with Recall","related":["click-to-do","copilot-plus-pc","copilot-vision"]},{"id":"copilot-app-windows","name":"Copilot App for Windows","aliases":["Copilot in Windows","Windows Copilot","Microsoft Copilot app for Windows","Copilot for Windows","Copilot on Windows"],"difficulty":"Easy","category":"Devices \u0026 Mobile","tags":["windows","chat"],"packs":["core"],"daily":false,"hints":["I\u0027ve worn several name plates, but I\u0027m still the front door to an AI assistant.","Sign in with a personal account, a work or school account, or both; the data stays separate.","On a brand-new machine I\u0027m usually already installed and pinned to the taskbar or Start menu.","Press the dedicated assistant button and I open full-size or as a smaller quick view.","On Windows 11 I replaced the older sidebar experience that came before me."],"description":"The desktop app for chatting with Microsoft Copilot on Windows 11, usually pre-pinned to the taskbar or Start menu on new PCs. It replaced the older sidebar experience, and Learn says the Microsoft 365 Copilot app is now called Microsoft Copilot.","why":"One familiar place to ask questions, chat by voice, search files on your device and get help with Windows settings, whichever account you sign in with. Personal and work data stay separate.","useCases":[{"title":"Work and personal accounts","text":"A consultant uses the account switcher to move between a work account and a personal one, knowing the two sets of chats and data stay separate."},{"title":"Find a file quickly","text":"An office manager asks the app to find a budget spreadsheet on the laptop, including files synced from OneDrive, without browsing folders."},{"title":"Help with Windows settings","text":"A call-centre agent types \u0027Make my screen easier to read\u0027 and Copilot guides them to the relevant Windows setting."}],"prompt":"Make my screen easier to read. Show me which Windows settings help, and take me to the right one.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/access-microsoft-365-copilot-on-windows","learnLabel":"Microsoft Support: Access Microsoft Copilot on Windows","related":["copilot-app","copilot-key","hey-copilot"]},{"id":"hey-copilot","name":"Hey Copilot","aliases":["Hey Copilot wake word","Copilot wake word","Hey, Copilot","wake word"],"difficulty":"Medium","category":"Devices \u0026 Mobile","tags":["voice","windows"],"packs":["core"],"hints":["I only listen for one friendly greeting, and I\u0027m switched off until you say so.","Say my phrase and a hands-free voice chat with your AI assistant begins.","I detect my phrase on your PC itself, using a ten-second audio buffer that is never stored.","I work only on a Windows desktop, while the assistant\u0027s app is running; the phone version can\u0027t.","Start with a casual \u0027Hey\u0027, then name the assistant; the switch lives in Settings \u003e General."],"description":"An opt-in voice trigger: say \u0027Hey Copilot\u0027 while the Microsoft Copilot app is running on a Windows desktop and a hands-free voice chat starts. The phrase is detected on your PC, and only audio from the moment it is heard is sent on.","why":"Start a voice chat without reaching for the mouse, handy when your hands are busy or you just want to talk something through. It is off by default, so you decide whether to switch it on.","useCases":[{"title":"Hands-free calendar summary","text":"A busy manager says the phrase while making coffee and asks for a summary of today\u0027s calendar."},{"title":"Brainstorm out loud","text":"A teacher preparing a lesson says the phrase and brainstorms activity ideas out loud while tidying their desk."},{"title":"Quick translation","text":"A front-desk receptionist says the phrase and asks Copilot to translate a short message for an international guest, hands free."}],"prompt":"Hey Copilot, summarise today\u0027s calendar and tell me which meeting I should prepare for first.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/how-hey-copilot-wake-word-works-in-microsoft-365-copilot","learnLabel":"Microsoft Support: How the Hey Copilot wake word works","related":["copilot-app-windows","copilot-voice","copilot-key"]},{"id":"think-deeper","name":"Think Deeper","aliases":["Think Deeper mode","Copilot Think Deeper","Think Deeper in Copilot"],"difficulty":"Medium","category":"Copilot Chat","tags":["chat"],"packs":["core"],"introduced":"2024-10","daily":false,"hints":["I\u0027m what you pick when speed isn\u0027t the point.","I\u0027m meant for complex topics, nuanced perspectives and detailed problem-solving.","I take up to ten seconds, and share my chain of thought while I weigh your prompt.","I\u0027m a conversation mode you choose before sending, not a separate agent like Researcher.","Powered by OpenAI reasoning models, I ask Copilot to think a little longer before it answers."],"description":"A Copilot conversation mode that spends a little longer reasoning before it replies, using OpenAI reasoning models. It\u0027s meant for complex questions, nuanced perspectives and detailed problem-solving, and it shows its chain of thought while it works.","why":"For a tricky question, a few extra seconds of reasoning can mean a more detailed, thoughtful answer. You choose the mode before you submit, so quick questions can stay quick.","useCases":[{"title":"Weighing roadmap options","text":"A product manager asks for the pros, cons and hidden risks of two roadmap options, and follows the reasoning as it unfolds."},{"title":"Untangling a formula","text":"A finance analyst pastes a stubborn nested formula and asks for careful step-by-step problem-solving to find why the totals don\u0027t match."},{"title":"Exploring both perspectives","text":"A history teacher asks for a nuanced comparison of two perspectives on an event, then turns it into discussion questions."}],"prompt":"Think carefully about this: we can either hire two contractors now or wait a quarter and hire one full-time. Compare the trade-offs, flag hidden risks and recommend an option with your reasoning.","learnMore":"https://support.microsoft.com/en-us/microsoft-365-copilot/conversation-modes-in-microsoft-copilot","learnLabel":"Microsoft Support: Conversation modes in Microsoft Copilot","related":["researcher"]},{"id":"m365-admin-agent","name":"Microsoft 365 Admin Agent","aliases":["Admin agent","Microsoft 365 Admin","M365 Admin agent"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["agents","admin"],"packs":["core"],"hints":["I\u0027m the help desk\u0027s own help desk: built for the people who keep everyone else\u0027s tools running.","Ask me in plain language about users, licences, service health or Teams call quality, and I\u0027ll dig in.","I suggest changes but never make them alone: each needs a human\u0027s explicit yes first.","I\u0027m pre-installed in Copilot Chat for the people who run Microsoft 365 in your organisation.","Click Copilot at the top of the admin center and you\u0027ll find me already selected."],"description":"A built-in AI agent that lets IT admins run Microsoft 365 in plain language, from Copilot Chat or the admin center. It handles users, licences, Copilot settings, agents, service health and Teams troubleshooting, and asks before making any change.","why":"One plain-language chat covers licences, Copilot settings, agents and service health, so routine IT questions get quick answers. It follows each person\u0027s role permissions, and confirmation prompts keep every change under human control.","useCases":[{"title":"Assign a Copilot licence","text":"A university IT officer asks the agent to assign a Copilot licence to a new lecturer, reviews the proposed change and confirms it."},{"title":"Review and block agents","text":"A bank\u0027s technology risk lead asks for agents in the registry, checks their usage analytics and blocks one that shouldn\u0027t be there."},{"title":"Triage Teams call quality","text":"A contact-centre IT analyst asks the agent to analyse call and meeting quality for a team reporting choppy audio, then decides what to escalate."}],"prompt":"List everyone who holds the Global Administrator role and find any groups with no owner. Then summarise this week\u0027s message center changes that affect Teams or Copilot.","learnMore":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-ai-admin-agent","learnLabel":"Microsoft Learn: Microsoft 365 Admin agent","related":["agent-registry","copilot-chat"]},{"id":"outlook-coaching-by-copilot","name":"Coaching by Copilot","aliases":["Copilot coaching","Copilot Coach","Email coaching","Email coaching with Copilot in Outlook"],"difficulty":"Hard","category":"Microsoft 365 Apps","tags":["email","creation"],"packs":["core"],"hints":["I\u0027m the second opinion you ask before pressing send.","My goal is to help your message come across as you intended.","I look at three things: tone, clarity and how your reader might feel.","I live in a drop-down under the Copilot icon on the compose toolbar.","Think of me as a coach for your draft; I can apply all my suggestions at once."],"description":"An Outlook compose-window feature that reviews your draft email and suggests improvements to tone, clarity and reader sentiment before you send. Apply all the suggestions at once, which regenerates your text, or work through them one by one.","why":"Tricky emails are easier to get right when tone and clarity are checked before you send. You can feel confident the message says what you meant.","useCases":[{"title":"Sensitive policy update","text":"An HR advisor drafts a policy-change email and asks Copilot to review the tone, so it reads supportive rather than blunt before it goes to staff."},{"title":"Calming an upset client","text":"A customer-service lead replying to an upset client reviews the draft\u0027s tone and clarity, applies all suggestions, then rereads the result before sending."},{"title":"Fresh feedback on mobile","text":"A school principal drafts a reply to parents on their phone, taps Regenerate for fresh feedback, then edits the wording by hand before sending."}],"prompt":"Review my draft email for tone, clarity and reader sentiment. Tell me where it might come across as blunt or unclear, and suggest friendlier wording that keeps my message intact.","learnMore":"https://support.microsoft.com/en-us/outlook/copilot-pages/get-email-coaching-with-copilot-in-outlook","learnLabel":"Microsoft Support: Get email coaching with Copilot in Outlook","related":["outlook-summary-by-copilot","copilot-in-outlook"]},{"id":"outlook-prioritize-my-inbox","name":"Prioritize My Inbox","aliases":["Prioritise my inbox","Copilot prioritize inbox","Copilot prioritise inbox","Prioritize inbox","Prioritise inbox"],"difficulty":"Hard","category":"Microsoft 365 Apps","tags":["email","automation"],"packs":["core","wave-2"],"introduced":"2024-09","hints":["I\u0027m a receptionist who tells you which new arrivals matter, without ever keeping them waiting.","I help you decide what to read first, guided by topics, keywords or people you choose.","In the reading pane, I explain why a message made the cut.","You\u0027ll find me behind the arrow beside the Copilot button on Windows, or under What\u0027s New on Mac.","I\u0027m the Copilot setting that tags new mail as high, normal or low priority."],"description":"Marks new messages high, normal or low priority as they arrive, based on the topics, keywords or people you tell Copilot are important. An up arrow marks the high-priority mail, and the reading pane explains why.","why":"Important messages are easier to spot among the routine ones, and you decide what counts by telling Copilot your topics, keywords and people. Nothing is held back while it works.","useCases":[{"title":"Escalations stand out","text":"A customer-support manager tells Copilot that mentions of \u0027outage\u0027 and messages from key account owners are important, so urgent escalations stand out on busy mornings."},{"title":"Spot staffing requests","text":"A hospital operations lead adds the clinical director and the keyword \u0027rostering\u0027 to their instructions, so staffing requests get an up arrow among routine notices."},{"title":"Month-end focus","text":"A finance analyst names \u0027month-end close\u0027 as a topic and the CFO as a person, then checks the reading pane to see why a message was marked."}],"prompt":"Prioritise my inbox. High priority: emails from my manager, anything about the Q3 budget and any message mentioning \u0027contract renewal\u0027.","learnMore":"https://support.microsoft.com/en-us/outlook/copilot-outlook/prioritize-my-inbox","learnLabel":"Microsoft Support: Prioritize my inbox","related":["copilot-in-outlook","outlook-summary-by-copilot"]},{"id":"outlook-summary-by-copilot","name":"Summary by Copilot","aliases":["Copilot email summary","Summarize thread","Summarise thread","Summarize","Thread summary in Outlook"],"difficulty":"Medium","category":"Microsoft 365 Apps","tags":["email","files"],"packs":["core"],"hints":["I\u0027m the postcard version of a very long conversation.","I save you scrolling by pulling out the key points of a long email thread.","My points can carry little numbers; select one to jump to the email it came from.","I sit at the top of an open thread, or under the email on mobile.","Press the Summary button and Copilot reads the whole thread so you don\u0027t have to."],"description":"An Outlook feature that reads an email thread and writes the key points at the top, which can include numbered citations that jump to the source emails. New Outlook and Outlook on the web can also summarise a PDF, PowerPoint or Word attachment.","why":"Long reply-all threads are slow to untangle. A quick recap of the key points, with links back to the original messages, gets you up to speed before you reply.","useCases":[{"title":"Back from leave","text":"After a week away, a project manager reads the key points of a long thread first, then jumps to the cited emails to check who approved what."},{"title":"Digest a supplier PDF","text":"A procurement officer selects Summarize a file on a supplier\u0027s PDF attachment in new Outlook to get the gist before deciding whether to read all of it."},{"title":"Catch up on mobile","text":"Between visits, a field sales rep taps the Copilot icon on their phone\u0027s toolbar and reads a long client thread\u0027s summary under the email."}],"prompt":"Summarise this email thread: list the key decisions, open questions and who owns each next step, and cite the email each point comes from.","learnMore":"https://support.microsoft.com/en-us/outlook/copilot-pages/summarize-an-email-thread-with-copilot-in-outlook","learnLabel":"Microsoft Support: Summarize an email thread with Copilot in Outlook","related":["outlook-prioritize-my-inbox","outlook-coaching-by-copilot","copilot-in-outlook"]},{"id":"purview-for-copilot","name":"Purview for Copilot","aliases":["Microsoft Purview for Copilot","Purview Copilot","Microsoft Purview for Microsoft Copilot","Purview for Microsoft 365 Copilot"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["security","governance","privacy"],"packs":["core"],"hints":["I\u0027m not a Copilot add-on; I\u0027m existing safeguards, stretched to cover AI.","I help organisations protect, audit and retain what AI apps read and produce.","Where a sensitivity label applies encryption, Copilot only returns content if you hold EXTRACT as well as VIEW.","My tools live in one Microsoft portal, home to Audit, eDiscovery, Information Protection and Insider Risk Management.","Start with \u0027Purview\u0027, the portal\u0027s name, and finish with the AI helper I look after."],"description":"Microsoft Purview\u0027s existing data-security and compliance tools, such as sensitivity labels, data loss prevention, audit and retention, are extended to cover the prompts, responses and files used by Copilot, agents and other AI apps. AI answers never include data the person can\u0027t access.","why":"The labels and policies already protecting your files carry over to AI, so people can use Copilot with fewer worries about sensitive data, and compliance teams keep a record.","useCases":[{"title":"Labelling client files","text":"A law firm applies encrypting sensitivity labels to client files, so Copilot only returns that content to people holding both the VIEW and EXTRACT usage rights."},{"title":"Stopping card-number pastes","text":"A retailer\u0027s security team uses Endpoint DLP on onboarded Windows PCs to warn or block staff pasting credit card numbers into ChatGPT."},{"title":"Finding AI interactions","text":"A public-sector compliance officer searches eDiscovery for \u0027Copilot activity\u0027 and sets retention policies, so AI interactions are found and kept like other records."}],"prompt":"I\u0027m a Microsoft 365 admin preparing to roll out Copilot. Explain how sensitivity labels, Endpoint DLP, audit and eDiscovery in Microsoft Purview apply to Copilot interactions, then give me a checklist of what to configure first and who should own each step.","learnMore":"https://learn.microsoft.com/en-us/purview/ai-microsoft-purview","learnLabel":"Microsoft Learn: Purview protections for Copilot and AI apps","related":["dspm-for-ai","copilot-controls"]},{"id":"restricted-access-control","name":"Restricted Access Control","aliases":["RAC","Restricted site access","Restricted site access control","Site access restriction"],"difficulty":"Expert","category":"Security \u0026 Admin","tags":["security","governance","admin","files"],"packs":["core"],"hints":["I\u0027m a bouncer: a ticket alone won\u0027t get you in; you must also be on my list.","I curb oversharing by reserving a site for specific groups of people.","Anyone outside my chosen groups is turned away, even with a shared link.","I reach OneDrive as well as SharePoint, unlike the sibling that merely hides things from search and Copilot.","I\u0027m the SharePoint Advanced Management policy that limits site access to chosen security or Microsoft 365 groups."],"description":"A SharePoint Advanced Management policy that limits a SharePoint site or OneDrive to members of up to 10 chosen groups. People outside them lose access, even with permissions or a shared link, and search and Copilot honour it too.","why":"Old permissions and shared links make oversharing easy. IT can lock a sensitive site down to the right team, so nobody else gets in, even via search or Copilot.","useCases":[{"title":"Client matter lock-down","text":"A law firm limits a client-matter site to the matter team\u0027s security group, so partners elsewhere can\u0027t open it, even with an old link."},{"title":"Dynamic project team","text":"A hospital research site is limited to a dynamic security group of current project staff, so people who move departments lose access without anyone editing permissions."},{"title":"Deal team confidentiality","text":"A
